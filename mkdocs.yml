site_name: InvarLock Documentation
site_description: Paired model release-regression evaluation with independently verifiable evidence
site_url: https://invarlock.github.io/invarlock/
repo_url: https://github.com/invarlock/invarlock
repo_name: invarlock

nav:
  - Overview: README.md
  - User guide:
      - Getting started: user-guide/getting-started.md
      - Change scenarios: user-guide/change-scenarios.md
      - Key management: user-guide/key-management.md
      - Runtime providers: user-guide/runtime-providers.md
      - Evaluation request: user-guide/evaluation-request.md
      - Schedule and policy: user-guide/schedule-and-policy.md
      - Evidence and verification: user-guide/evidence-and-verification.md
      - Verification failure lab: user-guide/verification-failure-lab.md
      - Optional diagnostics: user-guide/diagnostics.md
      - CI integration: user-guide/ci-integration.md
      - Publish public evidence: user-guide/public-evidence.md
      - Troubleshooting: user-guide/troubleshooting.md
  - Assurance:
      - Assurance case: assurance/assurance-case.md
      - Decision semantics: assurance/decision-semantics.md
      - Pairing and replay: assurance/pairing-and-replay.md
      - Reproducibility: assurance/reproducibility.md
      - Acceptance checklist: assurance/acceptance-checklist.md
      - Glossary: assurance/glossary.md
  - Reference:
      - CLI: reference/cli.md
      - Architecture: reference/architecture.md
      - Contracts: reference/contracts.md
      - Compatibility covenant: reference/compatibility.md
      - Acceptance attestations: reference/acceptance-attestations.md
      - Evaluator qualification: reference/evaluator-qualification.md
      - Python API: reference/api-guide.md
      - Artifacts: reference/artifacts.md
      - Reports: reference/reports.md
      - Runtime providers: reference/runtime-providers.md
      - Runtime-security API: reference/runtime-security.md
      - Environment: reference/environment.md
      - Lifecycle: reference/lifecycle.md
      - Release verification: reference/release-verification.md
      - Documentation development: reference/documentation.md
  - Security:
      - Trust model: security/trust-model.md
      - Threat model: security/threat-model.md
      - Security practices: security/best-practices.md
      - Dependency-audit exceptions: security/dependency-audit.md

theme:
  name: material
  language: en
  logo: assets/invarlock-mark-dark.svg
  favicon: assets/invarlock-app-icon.svg
  font:
    text: Sora
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets

plugins:
  - search

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/extra.css
