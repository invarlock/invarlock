schema = "invarlock/architecture-policy/v1"
governed_roots = ["src/invarlock", "scripts", "tests"]

# Categories are ordered from most specific to least specific. Every governed
# file must match exactly one category. Limits belong to categories, never to
# individual source files.
[[categories]]
name = "python_tests"
language = "python"
role = "test"
include = ["tests/**/*.py"]
soft_lines = 1000
hard_lines = 1500
soft_function_lines = 200
hard_function_lines = 500
soft_complexity = 20
hard_complexity = 50
soft_direct_files = 75
hard_direct_files = 100

[[categories]]
name = "shell_tests"
language = "shell"
role = "test"
include = ["tests/**/*.sh", "scripts/**/tests/**/*.sh", "scripts/**/*_test.sh"]
soft_lines = 1000
hard_lines = 1500
soft_direct_files = 75
hard_direct_files = 100

[[categories]]
name = "source_python"
language = "python"
role = "production"
include = ["src/invarlock/**/*.py"]
soft_lines = 750
hard_lines = 1000
soft_function_lines = 200
hard_function_lines = 400
soft_complexity = 20
hard_complexity = 50
soft_direct_files = 40
hard_direct_files = 60

[[categories]]
name = "operational_python"
language = "python"
role = "production"
include = ["scripts/**/*.py"]
exclude = ["scripts/**/tests/**/*.py", "scripts/**/*_test.py"]
soft_lines = 750
hard_lines = 1000
soft_function_lines = 200
hard_function_lines = 400
soft_complexity = 20
hard_complexity = 50
soft_direct_files = 40
hard_direct_files = 60

[[categories]]
name = "operational_shell"
language = "shell"
role = "production"
include = ["scripts/**/*.sh"]
exclude = ["scripts/**/tests/**/*.sh", "scripts/**/*_test.sh"]
soft_lines = 750
hard_lines = 1000
soft_direct_files = 40
hard_direct_files = 60

[facades]
allowed_names = ["__init__.py", "__main__.py"]

[tiny_owners]
allowed_names = ["__init__.py", "__main__.py"]

[contract_owners]
include = ["src/invarlock/**/*_protocol.py", "src/invarlock/**/constants.py"]

# These rules express dependency direction without prescribing filenames or a
# particular split topology.
[[dependency_rules]]
name = "library_layers_do_not_depend_on_cli"
include = ["src/invarlock/**/*.py"]
exclude = ["src/invarlock/__main__.py", "src/invarlock/cli/**/*.py"]
forbid_import_prefixes = ["invarlock.cli"]

[[dependency_rules]]
name = "reporting_has_no_cli_output"
include = ["src/invarlock/reporting/**/*.py"]
forbid_import_prefixes = ["invarlock.cli"]
forbid_call_prefixes = ["rich.console.Console.print", "typer.echo"]

[[dependency_rules]]
name = "cli_evaluation_phases_do_not_construct_reports"
include = ["src/invarlock/cli/evaluate_*.py"]
forbid_import_prefixes = [
  "invarlock.reporting.report_contract",
  "invarlock.reporting.report_make",
]

[[dependency_rules]]
name = "orchestrator_environment_does_not_execute"
include = ["src/invarlock/core/orchestration/environment.py"]
forbid_import_prefixes = [
  "invarlock.core.orchestration.execution",
]

[[dependency_rules]]
name = "orchestrator_attempts_depend_only_downstream"
include = ["src/invarlock/core/orchestration/attempts.py"]
forbid_import_prefixes = [
  "invarlock.core.orchestration.environment",
  "invarlock.core.orchestration.execution",
]

[[dependency_rules]]
name = "orchestrator_helpers_are_leaf_support"
include = ["src/invarlock/core/orchestration/helpers.py"]
forbid_import_prefixes = [
  "invarlock.core.orchestration.attempt_results",
  "invarlock.core.orchestration.attempts",
  "invarlock.core.orchestration.environment",
  "invarlock.core.orchestration.execute",
  "invarlock.core.orchestration.execution",
]

[[dependency_rules]]
name = "orchestrator_execution_does_not_prepare_environment"
include = ["src/invarlock/core/orchestration/execution.py"]
forbid_import_prefixes = [
  "invarlock.core.orchestration.environment",
]
