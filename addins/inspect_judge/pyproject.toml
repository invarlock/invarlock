[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invarlock-inspect-judge"
version = "0.15.0"
description = "Bounded optional Inspect judge collection planning and retained export import"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["invarlock==0.15.0"]

[project.optional-dependencies]
inspect = ["inspect-ai==0.3.254"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["invarlock_addins.inspect_judge*"]
namespaces = true

[tool.setuptools.package-data]
"invarlock_addins.inspect_judge" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../src"]
