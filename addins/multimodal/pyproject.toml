[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invarlock-runtime-hf-vision-text"
version = "0.12.1"
description = "First-party Hugging Face vision-text runtime provider for InvarLock"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["invarlock==0.12.1", "pillow>=11.3,<13"]

[project.optional-dependencies]
runtime = [
  "protobuf>=4.25",
  "safetensors>=0.4",
  "sentencepiece>=0.2.1",
  "tiktoken>=0.9.0",
  "torch>=2.11.0,!=2.12.0",
  "torchvision>=0.26.0",
  "transformers>=5.12.0",
]

[project.entry-points."invarlock.runtime_providers"]
hf_vision_text = "invarlock_addins.multimodal.provider:HFVisionTextProvider"

[project.scripts]
invarlock-hf-vision-text-conformance = "invarlock_addins.multimodal.conformance:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["invarlock_addins.multimodal*"]
namespaces = true

[tool.setuptools.package-data]
"invarlock_addins.multimodal" = ["py.typed"]
