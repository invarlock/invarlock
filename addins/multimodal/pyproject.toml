[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invarlock-runtime-hf-vision-text"
version = "0.16.1"
description = "First-party Hugging Face vision-text runtime provider for InvarLock"
readme = "packaging/README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["invarlock==0.16.1", "pillow>=11.3,<13"]

[project.entry-points."invarlock.runtime_providers"]
hf_vision_text = "invarlock_addins.multimodal.provider:HFVisionTextProvider"

[project.scripts]
invarlock-hf-vision-text-conformance = "invarlock_addins.multimodal.conformance:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["invarlock_addins.multimodal*"]
namespaces = true

[tool.setuptools.package-data]
"invarlock_addins.multimodal" = ["py.typed"]
