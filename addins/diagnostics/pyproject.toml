[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invarlock-diagnostics"
version = "0.15.0"
description = "Observation-only numeric diagnostics for InvarLock evidence workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["invarlock_addins.diagnostics*"]
namespaces = true

[tool.setuptools.package-data]
"invarlock_addins.diagnostics" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
