[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invarlock-runtime-tensorrt-llm"
version = "0.12.1"
description = "First-party TensorRT-LLM runtime provider add-in for InvarLock"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["invarlock>=0.12.1,<0.13"]

[project.entry-points."invarlock.runtime_providers"]
tensorrt_llm = "invarlock_addins.tensorrt_llm.provider:TensorRTLLMProvider"

[project.scripts]
invarlock-tensorrt-llm-conformance = "invarlock_addins.tensorrt_llm.conformance:main"
invarlock-tensorrt-llm-runner = "invarlock_addins.tensorrt_llm.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["invarlock_addins.tensorrt_llm*"]
namespaces = true

[tool.setuptools.package-data]
"invarlock_addins.tensorrt_llm" = ["py.typed"]
