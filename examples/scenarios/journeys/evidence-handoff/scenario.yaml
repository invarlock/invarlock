format_version: invarlock/example-scenario-v1
scenario_id: evidence-handoff
title: Hand evidence to an independent verifier
audience: Release reviewers, auditors, and teams receiving an evidence pack from another system
availability: runnable
ecosystems:
  - CI release gates
  - Independent review
input_boundary:
  kind: evidence_handoff
  supplied_by: external_tool_or_team
  candidate_input: An immutable evidence pack plus independently provisioned trust inputs and verifier identity
transaction:
  task: not_applicable
  metric: not_applicable
  execution_mode: verify_existing
  providers:
    - runtime_provider_abi
  acceptance_question: Does the signed evidence match every independently supplied trust input and its recorded policy verdict?
workflow:
  commands:
    - verify
    - report
  runbook: README.md
  related_paths:
    - examples/README.md
    - examples/run_trust_boundary_demo.py
    - docs/user-guide/verification-failure-lab.md
interpretation:
  establishes:
    - The submitted pack is intact and agrees with the verifier-owned artifacts, schedule, policy, runtime, and signer anchors.
  boundary:
    - Verification authenticates a bounded recorded comparison rather than predicting behavior outside its schedule.
