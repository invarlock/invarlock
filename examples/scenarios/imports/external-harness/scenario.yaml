format_version: invarlock/example-scenario-v1
scenario_id: external-harness
title: Import paired results from an evaluation harness
audience: Teams already running a benchmark harness that can retain stable per-record results
availability: operator_recipe
ecosystems:
  - NeMo Evaluator
  - lm-evaluation-harness
  - Internal evaluation harnesses
input_boundary:
  kind: external_evaluation
  supplied_by: external_tool_or_team
  candidate_input: Stable paired records and closed baseline and subject result sets exported by the harness bridge
transaction:
  task: text_causal
  metric: scorer_extension
  execution_mode: import
  providers:
    - runtime_provider_abi
  acceptance_question: Did verifier-replayed per-record scores satisfy the authenticated release policy?
workflow:
  commands:
    - evaluate
    - verify
    - report
  runbook: README.md
  related_paths:
    - examples/README.md
    - docs/reference/runtime-providers.md
    - docs/user-guide/evaluation-request.md
    - docs/user-guide/schedule-and-policy.md
interpretation:
  establishes:
    - The imported per-record results and authenticated scorer extension satisfied the selected policy.
  boundary:
    - Aggregate rewards emitted by the external harness are not accepted without verifier replay.
