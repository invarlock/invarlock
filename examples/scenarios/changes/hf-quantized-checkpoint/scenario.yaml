format_version: invarlock/example-scenario-v1
scenario_id: hf-quantized-checkpoint
title: Evaluate a quantized Hugging Face checkpoint
audience: Teams using AWQ, GPTQModel, HQQ, bitsandbytes, Quanto, TorchAO, or another quantization stack
availability: operator_recipe
ecosystems:
  - AWQ
  - GPTQModel
  - HQQ
  - bitsandbytes
  - Quanto
  - TorchAO
input_boundary:
  kind: hf_quantization
  supplied_by: external_tool_or_team
