  task: text_causal
  metric: exact_match
  execution_mode: import
  providers:
    - hf_transformers
    - runtime_provider_abi
  acceptance_question: Did the quantized candidate preserve the paired task outcomes required by the release policy?
workflow:
  commands:
    - evaluate
    - verify
    - report
  runbook: README.md
  related_paths:
    - examples/README.md
    - docs/reference/runtime-providers.md
    - docs/user-guide/evaluation-request.md
interpretation:
  establishes:
    - The authenticated quantized candidate satisfied the paired task policy under its bound runtime.
  boundary:
    - File size, throughput, memory use, and unsupported loader behavior are separate deployment properties.
