format_version: invarlock/example-scenario-v1
scenario_id: multimodal-upgrade
title: Evaluate a multimodal model upgrade
audience: Teams releasing or replacing vision-language checkpoints
availability: operator_recipe
ecosystems:
  - Hugging Face vision-language models
  - VQA evaluation suites
input_boundary:
  kind: multimodal_upgrade
  supplied_by: external_tool_or_team
  candidate_input: Two immutable vision-language checkpoints plus a content-addressed image store
transaction:
  task: vision_text_generation
  metric: exact_match
  execution_mode: run
  providers:
    - hf_vision_text
  acceptance_question: Did the subject model meet the paired vision-text task policy relative to the baseline?
workflow:
  commands:
    - evaluate
    - verify
    - report
  runbook: README.md
  related_paths:
    - addins/multimodal/README.md
    - public_evidence/evidence/qwen2-vl-2b-7b-multimodal/evidence.meta.json
    - docs/user-guide/runtime-providers.md
interpretation:
  establishes:
    - The authenticated subject model satisfied the exact-match policy on the content-bound vision-text schedule.
  boundary:
    - Open-ended visual quality and semantic equivalence require a separately authenticated scorer extension.
