format_version: invarlock/example-scenario-v1
scenario_id: model-upgrade
title: Evaluate a model upgrade
audience: Application and model-release teams replacing one released checkpoint with another
availability: operator_recipe
ecosystems:
  - Hugging Face Hub
  - Internal model registries
input_boundary:
  kind: model_upgrade
  supplied_by: external_tool_or_team
  candidate_input: The immutable currently deployed checkpoint and the immutable replacement checkpoint
transaction:
  task: text_causal
  metric: exact_match
  execution_mode: run
  providers:
    - hf_transformers
  acceptance_question: Did the replacement model meet the paired task policy relative to the deployed baseline?
workflow:
  commands:
    - evaluate
    - verify
    - report
  runbook: README.md
  related_paths:
    - examples/run/README.md
    - docs/user-guide/schedule-and-policy.md
interpretation:
  establishes:
    - The authenticated replacement checkpoint satisfied the selected paired task policy.
  boundary:
    - The conclusion is limited to the authenticated schedule, metric, policy, and runtime identities.
