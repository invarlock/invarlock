format_version: invarlock/example-scenario-v1
scenario_id: tensorrt-deployment
title: Evaluate a TensorRT-LLM deployment
audience: Teams compiling checkpoints into TensorRT-LLM engines for production inference
availability: operator_recipe
ecosystems:
  - NVIDIA TensorRT-LLM
input_boundary:
  kind: tensorrt_deployment
  supplied_by: external_tool_or_team
  candidate_input: The authenticated source checkpoint and the closed TensorRT-LLM engine bundle selected for deployment
transaction:
  task: text_causal
  metric: exact_match
  execution_mode: run
  providers:
    - hf_transformers
    - tensorrt_llm
  acceptance_question: Did the compiled engine preserve the paired task outcomes required by the release policy?
workflow:
  commands:
    - evaluate
    - verify
    - report
  runbook: README.md
  related_paths:
    - addins/tensorrt_llm/README.md
    - docs/user-guide/runtime-providers.md
    - public_evidence/evidence/tinyllama-tensorrt-llm-checkpoints/evidence.meta.json
interpretation:
  establishes:
    - The authenticated engine bundle satisfied the paired task policy through the pinned TensorRT-LLM runtime.
  boundary:
    - Engine build correctness, throughput, latency, and hardware portability remain separately qualified properties.
