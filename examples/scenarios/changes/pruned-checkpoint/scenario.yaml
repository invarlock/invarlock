format_version: invarlock/example-scenario-v1
scenario_id: pruned-checkpoint
title: Evaluate a pruned checkpoint
audience: Teams applying structured or unstructured pruning before model release
availability: operator_recipe
ecosystems:
  - Sparse checkpoint pipelines
  - Hugging Face safetensors
input_boundary:
  kind: pruning
  supplied_by: external_tool_or_team
  candidate_input: The immutable unpruned baseline and the materialized pruned subject checkpoint
transaction:
  task: text_causal
  metric: normalized_nll_per_utf8_byte
  execution_mode: run
  providers:
    - hf_transformers
  acceptance_question: Did pruning remain within the likelihood-regression policy on the paired release schedule?
workflow:
  commands:
    - evaluate
    - verify
    - report
  runbook: README.md
  related_paths:
    - examples/run/README.md
    - docs/user-guide/evaluation-request.md
    - docs/user-guide/schedule-and-policy.md
interpretation:
  establishes:
    - The authenticated pruned checkpoint satisfied the selected likelihood-regression policy on the paired records.
  boundary:
    - Sparsity, memory use, throughput, and deployment compatibility require separately authenticated measurements.
