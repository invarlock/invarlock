format_version: invarlock/example-scenario-v1
scenario_id: fine-tuned-checkpoint
title: Evaluate a fine-tuned checkpoint
audience: Teams adapting Hugging Face causal language models with PEFT, TRL, or a training pipeline
availability: operator_recipe
ecosystems:
  - Hugging Face PEFT
  - Hugging Face TRL
  - Transformers Trainer
input_boundary:
  kind: fine_tuning
  supplied_by: external_tool_or_team
  candidate_input: A complete baseline checkpoint and the immutable fine-tuned checkpoint selected for release
transaction:
  task: text_causal
  metric: normalized_nll_per_utf8_byte
  execution_mode: run
  providers:
    - hf_transformers
  acceptance_question: Did the fine-tuned checkpoint stay within the likelihood-regression policy on the paired release schedule?
workflow:
  commands:
    - evaluate
    - verify
    - report
  runbook: README.md
  related_paths:
    - examples/run/README.md
    - examples/run/hf_cpu_decision.py
    - docs/user-guide/schedule-and-policy.md
interpretation:
  establishes:
    - The authenticated fine-tuned checkpoint satisfied the selected likelihood-regression policy on the paired records.
  boundary:
    - The result measures expected-continuation likelihood on the selected schedule rather than general model quality.
