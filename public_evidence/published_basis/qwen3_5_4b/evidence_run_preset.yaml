model:
  id: Qwen/Qwen3.5-4B
  adapter: hf_multimodal
  device: auto
  dtype: bfloat16
  device_map: auto
  low_cpu_mem_usage: true
  collect_loading_info: false
  chat_template_kwargs:
    enable_thinking: false
dataset:
  provider:
    kind: vision_text
    path: tmp/model_evidence_container/c30c67b5d2a4c42a/eval/qwen_qwen3_5_4b/dataset/manifest.jsonl
  split: validation
  seq_len: 256
  stride: 256
  preview_n: 16
  final_n: 16
  seed: 42
eval:
  metric:
    kind: accuracy
  loss:
    type: classification
primary_metric:
  drift_band:
    min: 0.8
    max: 1.2
edit:
  name: noop
  plan: {}
auto:
  enabled: true
  tier: balanced
  probes: 0
context:
  run:
    skip_overhead_check: true
guards:
  order:
  - invariants
  - spectral
  - rmt
  - variance
  - invariants
  spectral:
    module_include_patterns:
    - adapter.layers.*.self_attn.*
    - adapter.layers.*.linear_attn.*
    - adapter.layers.*.mlp.*
    - model.language_model.layers.*.self_attn.*
    - model.language_model.layers.*.linear_attn.*
    - model.language_model.layers.*.mlp.*
  rmt:
    module_include_patterns:
    - adapter.layers.*.self_attn.*
    - adapter.layers.*.linear_attn.*
    - adapter.layers.*.mlp.*
    - model.language_model.layers.*.self_attn.*
    - model.language_model.layers.*.linear_attn.*
    - model.language_model.layers.*.mlp.*
output:
  dir: runs
  save_model: false
  save_report: true
