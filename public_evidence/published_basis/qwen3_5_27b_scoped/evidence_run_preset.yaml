# Preset: Qwen3.5 27B scoped image-text evaluation on materialized public VQAv2 data.
#
# This scoped lane covers self-attention and MLP guard scans. Linear-attention
# module coverage remains tracked by the larger-model follow-on findings.

model:
  id: "Qwen/Qwen3.5-27B"
  adapter: "hf_multimodal"
  device: "auto"
  dtype: "bfloat16"
  device_map: "auto"
  low_cpu_mem_usage: true
  collect_loading_info: false
  chat_template_kwargs:
    enable_thinking: false

dataset:
  provider:
    kind: "vision_text"
    path: "artifacts/model-evidence/public_datasets/vqav2_sample_validation_800/manifest.jsonl"
  split: "validation"
  seq_len: 256
  stride: 256
  preview_n: 16
  final_n: 16
  seed: 42

eval:
  metric:
    kind: "accuracy"
  loss:
    type: "classification"

primary_metric:
  drift_band:
    min: 0.80
    max: 1.20

edit:
  name: "noop"
  plan: {}

auto:
  enabled: true
  tier: "balanced"
  probes: 0

context:
  run:
    skip_overhead_check: true

guards:
  order: ["invariants", "spectral", "rmt", "variance", "invariants"]
  spectral:
    module_include_patterns:
      - "adapter.layers.*.self_attn.*"
      - "adapter.layers.*.mlp.*"
      - "model.language_model.layers.*.self_attn.*"
      - "model.language_model.layers.*.mlp.*"
  rmt:
    module_include_patterns:
      - "adapter.layers.*.self_attn.*"
      - "adapter.layers.*.mlp.*"
      - "model.language_model.layers.*.self_attn.*"
      - "model.language_model.layers.*.mlp.*"

output:
  dir: "runs"
  save_model: false
  save_report: true
