<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="0 0 1040 900" role="img" aria-labelledby="title desc">
  <title id="title">One workflow: evaluate, verify, report</title>
  <desc id="desc">Run or import a native comparison, use captured evaluator records, or judge frozen answers. Exact match, normalized NLL and judge scoring have distinct evidence requirements. Evaluate publishes evidence. A recipient verifies it with independent trust inputs and can issue a signed verification receipt. Report explains the evidence without granting verification or deployment approval. Hosted-service comparisons require fresh executions collected by your harness; verification stays offline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#66776e"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #203c32; }
      .heading { font-size: 26px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 650; }
      .body { font-size: 19px; fill: #465e52; }
      .note { font-size: 17px; fill: #465e52; }
      .command { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 25px; font-weight: 700; }
      .card { fill: #fffdf8; stroke: #b8c6bd; stroke-width: 1.5; }
      .line { fill: none; stroke: #66776e; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1040" height="900" rx="20" fill="#f4f0e6"/>
  <text x="40" y="47" class="heading">Your comparison, your requirements</text>
  <text x="40" y="78" class="body">Baseline and subject · paired cases · scorer · policy</text>

  <g id="comparison-inputs">
    <rect x="40" y="103" width="304" height="115" rx="12" class="card"/>
    <text x="60" y="137" class="label">Native run or import</text>
    <text x="60" y="169" class="body">Pinned model artifacts</text>
    <text x="60" y="196" class="body">and runtime evidence</text>
    <rect x="368" y="103" width="304" height="115" rx="12" class="card"/>
    <text x="388" y="137" class="label">Captured records</text>
    <text x="388" y="169" class="body">Evaluator exports or</text>
    <text x="388" y="196" class="body">fresh hosted-service runs</text>
    <rect x="696" y="103" width="304" height="115" rx="12" class="card"/>
    <text x="716" y="137" class="label">Frozen answers</text>
    <text x="716" y="169" class="body">Declared rubric and</text>
    <text x="716" y="196" class="body">retained or new judge calls</text>
  </g>
  <path id="inputs-to-evaluate" d="M 192 218 V 240 H 848 V 218 M 520 218 V 265" class="line"/>

  <g id="evaluate">
    <rect x="180" y="267" width="680" height="117" rx="14" fill="#e1eee4" stroke="#4c8065" stroke-width="2"/>
    <text x="520" y="303" text-anchor="middle" class="command">invarlock evaluate</text>
    <text x="520" y="335" text-anchor="middle" class="label">Exact match · Normalized NLL · Judge</text>
    <text x="520" y="363" text-anchor="middle" class="body">Validate inputs, derive the supported analysis, apply policy</text>
  </g>
  <path id="evaluate-to-evidence" d="M 520 384 V 416" class="line"/>
  <g id="evidence">
    <rect x="180" y="418" width="680" height="107" rx="14" class="card"/>
    <text x="520" y="452" text-anchor="middle" class="heading">Evidence for the declared workflow</text>
    <text x="520" y="482" text-anchor="middle" class="body">Identities · observations · policy · analysis · signature</text>
    <text x="520" y="509" text-anchor="middle" class="note">Native, captured and judge evidence keep their own contracts</text>
  </g>

  <path id="evidence-to-verify" d="M 430 525 V 549 H 24 V 716 H 38" class="line"/>
  <path id="evidence-to-report" d="M 750 525 V 668" class="line"/>
  <g id="recipient-trust">
    <rect x="40" y="571" width="490" height="81" rx="12" fill="#fff3df" stroke="#c49b60" stroke-width="1.5"/>
    <text x="285" y="602" text-anchor="middle" class="label">Independent recipient trust inputs</text>
    <text x="285" y="631" text-anchor="middle" class="body">Expected identities, policy and authorized signer</text>
  </g>
  <path id="trust-to-verify" d="M 285 652 V 668" class="line"/>
  <g id="verify">
    <rect x="40" y="670" width="490" height="92" rx="12" class="card"/>
    <text x="285" y="706" text-anchor="middle" class="command">invarlock verify</text>
    <text x="285" y="738" text-anchor="middle" class="body">Authenticate, bind and replay offline</text>
  </g>
  <g id="report">
    <rect x="560" y="670" width="440" height="92" rx="12" class="card"/>
    <text x="780" y="706" text-anchor="middle" class="command">invarlock report</text>
    <text x="780" y="738" text-anchor="middle" class="body">Explain the retained comparison</text>
  </g>
  <path id="verify-to-receipt" d="M 285 762 V 784" class="line"/>
  <path id="report-to-output" d="M 780 762 V 784" class="line"/>
  <text x="285" y="809" text-anchor="middle" class="label">Verification result + optional signed receipt</text>
  <text x="780" y="809" text-anchor="middle" class="label">HTML · terminal · Markdown</text>
  <text x="780" y="836" text-anchor="middle" class="note">Automation formats depend on the workflow</text>
  <text x="40" y="871" class="note">A report does not replace verification. Explicit unsigned evaluation is local. Deployment remains your decision.</text>
</svg>
