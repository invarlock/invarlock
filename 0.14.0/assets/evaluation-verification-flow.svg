<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="880"
  viewBox="0 0 1600 880"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">InvarLock evaluate, verify, and report flow</title>
  <desc id="desc">
    A closed request declares the baseline, subject, pinned JSONL source or
    canonical schedule, runtime integrations, policy, execution mode, and
    output. Evaluation prepares the schedule, executes each side in its pinned
    OCI runtime or imports complete observations, derives the selected built-in
    metric or replays an authorized text scorer, derives its paired interval,
    and publishes a signed evidence bundle. Independent
    verification applies caller-owned artifact, schedule, policy, runtime, and
    expected-signer anchors, replays the comparison, and signs a completed
    verification statement when one can be formed. Reporting verifies the
    bundle's embedded signature and renders its canonical comparison report.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8.25"
      refY="5"
      markerWidth="6.7"
      markerHeight="6.7"
      orient="auto-start-reverse"
    >
      <path d="M 0.75 1 L 9.5 5 L 0.75 9 z" fill="#1b2b25" />
    </marker>
    <style>
      .section-label {
        font: 700 25px Sora, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .box-title {
        fill: #1b2b25;
        font: 700 24px Sora, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .box-text {
        fill: #1b2b25;
        font: 18px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .small-text {
        fill: #5a675f;
        font: 17px Sora, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .micro-text {
        fill: #5a675f;
        font: 14px Sora, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .band-input {
        fill: #fff8ea;
        stroke: #0f7669;
        stroke-width: 3;
        stroke-dasharray: 13 10;
      }
      .band-output {
        fill: #fff8ea;
        stroke: #2d7a5f;
        stroke-width: 3;
        stroke-dasharray: 13 10;
      }
      .band-verify {
        fill: #fff8ea;
        stroke: #b56a3d;
        stroke-width: 3;
        stroke-dasharray: 13 10;
      }
      .box-input {
        fill: #f3ecde;
        stroke: #0f7669;
        stroke-width: 3;
      }
      .box-output {
        fill: #f3ecde;
        stroke: #2d7a5f;
        stroke-width: 3;
      }
      .box-verify {
        fill: #f3ecde;
        stroke: #b56a3d;
        stroke-width: 3;
      }
      .arrow {
        fill: none;
        stroke: #1b2b25;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="1600" height="880" fill="#f3ecde" />

  <rect x="70" y="45" width="1460" height="300" rx="22" class="band-input" />
  <text x="105" y="165" class="section-label" fill="#0f7669">1. Request /</text>
  <text x="105" y="199" class="section-label" fill="#0f7669">Evaluate</text>

  <rect x="260" y="71" width="270" height="56" rx="10" class="box-input" />
  <text x="395" y="107" text-anchor="middle" class="box-title">Baseline artifact</text>

  <rect x="565" y="57" width="500" height="84" rx="10" class="box-input" />
  <text x="815" y="84" text-anchor="middle" class="box-title">request.yaml</text>
  <text x="815" y="108" text-anchor="middle" class="micro-text">
    artifacts · JSONL or schedule · metric or scorer · policy
  </text>
  <text x="815" y="128" text-anchor="middle" class="micro-text">
    runtime settings · run/import mode · output
  </text>

  <rect x="1100" y="71" width="270" height="56" rx="10" class="box-input" />
  <text x="1235" y="107" text-anchor="middle" class="box-title">Subject artifact</text>

  <rect x="515" y="163" width="600" height="78" rx="12" class="box-input" />
  <text x="815" y="196" text-anchor="middle" class="box-title">invarlock evaluate</text>
  <text x="815" y="222" text-anchor="middle" class="micro-text">
    prepare schedule · run pinned OCI sides or import evidence
  </text>

  <rect x="385" y="263" width="860" height="66" rx="12" class="box-input" />
  <text x="815" y="291" text-anchor="middle" class="box-title">
    Paired comparison and interval
  </text>
  <text x="815" y="315" text-anchor="middle" class="micro-text">
    built-in metric or authorized text scorer → paired interval
  </text>

  <path d="M 530 99 L 565 99" class="arrow" />
  <path d="M 1100 99 L 1065 99" class="arrow" />
  <path d="M 815 141 L 815 163" class="arrow" />
  <path d="M 815 241 L 815 263" class="arrow" />

  <rect x="70" y="365" width="1460" height="170" rx="22" class="band-output" />
  <text x="105" y="435" class="section-label" fill="#2d7a5f">2. Canonical</text>
  <text x="105" y="469" class="section-label" fill="#2d7a5f">Evidence</text>

  <rect x="355" y="382" width="920" height="136" rx="12" class="box-output" />
  <text x="815" y="416" text-anchor="middle" class="box-title">Canonical signed evidence bundle</text>
  <text x="815" y="449" text-anchor="middle" class="box-text">evidence directory · invarlock/evidence-pack-v1</text>
  <text x="815" y="478" text-anchor="middle" class="micro-text">
    normalized request · artifact/runtime/dataset identities · policy/schedule
  </text>
  <text x="815" y="500" text-anchor="middle" class="micro-text">
    runtime evidence · paired records/report · manifest/checksums/signature
  </text>

  <path d="M 815 329 L 815 382" class="arrow" />

  <rect x="70" y="555" width="1460" height="310" rx="22" class="band-verify" />
  <text x="105" y="700" class="section-label" fill="#b56a3d">3. Verify /</text>
  <text x="105" y="734" class="section-label" fill="#b56a3d">Report</text>

  <rect x="260" y="575" width="500" height="105" rx="12" class="box-verify" />
  <text x="510" y="608" text-anchor="middle" class="box-title">Independent trust inputs</text>
  <text x="510" y="633" text-anchor="middle" class="micro-text">
    baseline + subject artifact digests · schedule digest
  </text>
  <text x="510" y="654" text-anchor="middle" class="micro-text">
    policy · runtime digests · signer fingerprint
  </text>
  <text x="510" y="675" text-anchor="middle" class="micro-text">
    verifier key · verifier identity
  </text>

  <rect x="260" y="700" width="500" height="75" rx="12" class="box-verify" />
  <text x="510" y="730" text-anchor="middle" class="box-title">invarlock verify</text>
  <text x="510" y="754" text-anchor="middle" class="micro-text">
    authenticate pack · replay pairs and interval under anchors
  </text>

  <rect x="840" y="700" width="500" height="75" rx="12" class="box-output" />
  <text x="1090" y="730" text-anchor="middle" class="box-title">invarlock report</text>
  <text x="1090" y="754" text-anchor="middle" class="micro-text">
    authenticate signed bundle · render canonical report
  </text>

  <rect x="210" y="795" width="460" height="56" rx="10" class="box-output" />
  <text x="440" y="819" text-anchor="middle" class="box-title">Signed verification receipt</text>
  <text x="440" y="842" text-anchor="middle" class="micro-text">
    anchors · replay verdict · verifier signature
  </text>

  <rect x="690" y="795" width="300" height="56" rx="10" class="box-verify" />
  <text x="840" y="819" text-anchor="middle" class="box-title">Acceptance result</text>
  <text x="840" y="842" text-anchor="middle" class="micro-text">scoped pass or rejection</text>

  <rect x="1010" y="795" width="370" height="56" rx="10" class="box-output" />
  <text x="1195" y="819" text-anchor="middle" class="box-title">Console · optional HTML</text>
  <text x="1195" y="842" text-anchor="middle" class="micro-text">
    human-readable evidence view
  </text>

  <path d="M 510 680 L 510 700" class="arrow" />
  <path d="M 715 518 C 715 555 795 575 795 635 C 795 695 785 737 760 737" class="arrow" />
  <path d="M 965 518 C 965 585 1025 645 1090 700" class="arrow" />
  <path d="M 440 775 L 440 795" class="arrow" />
  <path d="M 650 775 C 700 783 790 788 840 795" class="arrow" />
  <path d="M 1090 775 C 1090 785 1160 790 1195 795" class="arrow" />
</svg>
