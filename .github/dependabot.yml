# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Repo policy:
# - Version-update PRs target staging/next directly.
# - GitHub security-update PRs still target the default branch (main).
# - Direct Dependabot PRs to main are blocked by the dependabot-main-guard
#   workflow; maintainers must land the equivalent fix on staging/next first
#   and carry it through the normal release flow.

version: 2
updates:
  # Keep pyproject.toml and uv.lock together. Hashed workflow locks and tool
  # hooks still require the coordinated checks described in WORKFLOWS.md.
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "staging/next"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    # Group minor/patch updates to reduce PR noise
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "mkdocs*"
          - "pre-commit"
        update-types:
          - "minor"
          - "patch"
      ml-dependencies:
        patterns:
          - "torch"
          - "transformers"
          - "numpy"
          - "scipy"
        update-types:
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging/next"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm (for docs tooling: markdownlint, cspell, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging/next"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
