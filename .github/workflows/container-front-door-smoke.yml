name: Container Front Door

on:
  pull_request:
    branches: [staging/next]
  push:
    branches: [staging/next, 'release/v*']
  workflow_dispatch:

concurrency:
  group: container-front-door-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      INVARLOCK_RUNTIME_IMAGE: invarlock-runtime:local
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: ${{ github.actor != 'nektos/act' }}
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-container-front-door-${{ hashFiles('requirements/workflows/ci-hf-py312.txt') }}

      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements/workflows/ci-hf-py312.txt

      - name: Exercise evaluate, verify, and report
        run: make container-front-door-smoke
