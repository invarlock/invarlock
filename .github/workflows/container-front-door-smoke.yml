name: Container Front Door

on:
  pull_request:
    branches: [staging/next]
  push:
    branches: [staging/next, 'release/v*']
  workflow_dispatch:

concurrency:
  group: container-front-door-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      CONTAINER_ENGINE: ${{ matrix.engine }}
      INVARLOCK_RUNTIME_IMAGE: invarlock-runtime:local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare selected engine
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONTAINER_ENGINE" == podman ]]; then
            sudo apt-get update
            sudo apt-get install --yes podman
          fi
          mkdir -p artifacts/oci-isolation
          "$CONTAINER_ENGINE" version > artifacts/oci-isolation/engine-version.txt
          "$CONTAINER_ENGINE" info --format '{{json .}}' > artifacts/oci-isolation/engine-info.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: ${{ github.actor != 'nektos/act' }}
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-container-front-door-${{ hashFiles('requirements/workflows/ci-hf-py312.txt') }}

      - name: Install test dependencies
        run: |
          python scripts/security/build_hardened_accelerate_wheel.py bootstrap
          python -m pip install --require-hashes --find-links runtime/wheels -r requirements/workflows/ci-hf-py312.txt

      - name: Install candidate wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wheelhouse
          python -m build --no-isolation --wheel --outdir wheelhouse
          python -m pip install --no-deps --force-reinstall wheelhouse/*.whl
          python -c 'from pathlib import Path; import invarlock; assert not Path(invarlock.__file__).resolve().is_relative_to(Path.cwd().resolve())'

      - name: Authenticate runtime source
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          source_bundle="$RUNNER_TEMP/invarlock-source.tar"
          source_result="$(python scripts/qualification_source.py create \
            --repository . \
            --commit "$source_commit" \
            --output "$source_bundle")"
          source_digest="$(python -c 'import json,sys; print(json.load(sys.stdin)["source_bundle_sha256"])' \
            <<<"$source_result")"
          python scripts/qualification_source.py verify \
            --repository . \
            --commit "$source_commit" \
            --bundle "$source_bundle" \
            --bundle-sha256 "$source_digest" >/dev/null
          {
            echo "RUNTIME_SOURCE_COMMIT=$source_commit"
            echo "RUNTIME_SOURCE_BUNDLE=$source_bundle"
            echo "RUNTIME_SOURCE_BUNDLE_SHA256=$source_digest"
          } >> "$GITHUB_ENV"

      - name: Exercise installed-wheel OCI and signed canary journey
        shell: bash
        run: |
          set -euo pipefail
          make runtime-image
          INVARLOCK_RUN_CONTAINER_SMOKE=1 \
          INVARLOCK_CONTAINER_SMOKE_INSTALLED_WHEEL=1 \
          INVARLOCK_CONTAINER_ENGINE="$CONTAINER_ENGINE" \
          INVARLOCK_RUNTIME_IMAGE="$INVARLOCK_RUNTIME_IMAGE" \
          INVARLOCK_OCI_ISOLATION_RESULTS="$GITHUB_WORKSPACE/artifacts/oci-isolation/cases" \
          PYTHONPATH='' \
          python -m pytest -q -m integration \
            --junitxml=artifacts/oci-isolation/results.xml \
            tests/integration/test_container_front_door_journey.py \
            tests/integration/test_oci_isolation.py \
            tests/integration/test_container_native_judge_journey.py

      - name: Require complete engine journey outcomes
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from xml.etree import ElementTree
          report = Path("artifacts/oci-isolation/results.xml")
          cases = list(ElementTree.parse(report).iter("testcase"))
          assert cases, "container parity requires executed test cases"
          assert not [case for case in cases if any(case.find(status) is not None for status in ("skipped", "failure", "error"))], "container parity requires every test to pass"
          for metric in ("exact_match", "normalized_nll_per_utf8_byte"):
              assert any(case.get("name", "").endswith(f"[{metric}]") for case in cases), metric
          assert any(case.get("name") == "test_native_judge_container_capture_evaluate_verify_report" for case in cases), "native judge"
          PYCODE

      - name: Retain OCI isolation outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oci-isolation-outcomes-${{ matrix.engine }}
          path: artifacts/oci-isolation
          if-no-files-found: warn
          retention-days: 30

  smoke:
    if: ${{ always() }}
    needs: [engine-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Docker and Podman journeys
        env:
          ENGINE_RESULT: ${{ needs.engine-smoke.result }}
        run: test "$ENGINE_RESULT" = success
