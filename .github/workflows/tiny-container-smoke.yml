name: Tiny Container Smoke

on:
  push:
    branches: [ staging/next, 'release/v*' ]
  workflow_dispatch:

concurrency:
  group: tiny-container-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      INVARLOCK_ALLOW_NETWORK: "1"
      INVARLOCK_DEDUP_TEXTS: "1"
      INVARLOCK_SMOKE_MODE: "container"
      INVARLOCK_SMOKE_PROFILE: "dev"
      INVARLOCK_RUNTIME_IMAGE: "invarlock-runtime:local"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: ${{ github.actor != 'nektos/act' }}
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-tiny-container-smoke-${{ hashFiles('pyproject.toml', 'requirements/workflows/ci-hf-py312.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-tiny-container-smoke-

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/workflows/ci-hf-py312.txt

      - name: Build runtime image
        run: |
          make runtime-image

      - name: Run tiny container smoke campaign
        run: bash scripts/smoke/run_tiny_container_smoke.sh "$RUNNER_TEMP/invarlock-tiny-container-smoke"
