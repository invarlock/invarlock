name: Secret History Scan

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-history:
    name: gitleaks-history
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Cache gitleaks binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/bin/gitleaks
          key: gitleaks-v8.30.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install gitleaks
        run: |
          gitleaks_bin="$(go env GOPATH)/bin/gitleaks"
          if [ ! -x "${gitleaks_bin}" ]; then
            go install github.com/zricethezav/gitleaks/v8@v8.30.0
          fi
          "${gitleaks_bin}" version
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run gitleaks full history scan
        id: gitleaks_scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/supply-chain
          set +e
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format json \
            --report-path artifacts/supply-chain/gitleaks-history.json
          exit_code=$?
          set -e
          if [ ! -s artifacts/supply-chain/gitleaks-history.json ]; then
            printf '[]\n' > artifacts/supply-chain/gitleaks-history.json
          fi
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Upload gitleaks history artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gitleaks-history
          path: artifacts/supply-chain/gitleaks-history.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail on secret findings
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.gitleaks_scan.outputs.exit_code }}"
          if [ -z "${exit_code}" ]; then
            echo "gitleaks scan did not publish an exit code" >&2
            exit 1
          fi
          if [ "${exit_code}" != "0" ]; then
            echo "gitleaks detected secrets; see uploaded artifact for details" >&2
            exit 1
          fi
