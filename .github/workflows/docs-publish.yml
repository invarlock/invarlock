name: Publish Documentation

on:
  push:
    branches:
      - main
      - 'release/v*'
    paths:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs-publish.yml'
  workflow_dispatch:
    inputs:
      docs_version:
        description: "Optional docs version label override (for example: 0.8.0 or latest)"
        required: false
        type: string

concurrency:
  group: docs-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish Versioned Docs
    if: github.repository == 'invarlock/invarlock'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: python -m pip install --require-hashes -r requirements/workflows/docs-ci-py313.txt

    - name: Resolve docs version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        override='${{ github.event.inputs.docs_version }}'
        ref_name='${{ github.ref_name }}'
        docs_version=''
        if [ -n "${override}" ]; then
          docs_version="${override}"
        elif [ "${ref_name}" = "main" ]; then
          docs_version="latest"
        elif [[ "${ref_name}" == release/v* ]]; then
          docs_version="${ref_name#release/v}"
        else
          docs_version="${ref_name}"
        fi
        echo "docs_version=${docs_version}" >> "${GITHUB_OUTPUT}"

    - name: Build docs
      run: mkdocs build --strict --site-dir site-build

    - name: Publish versioned site
      env:
        DOCS_VERSION: ${{ steps.version.outputs.docs_version }}
      shell: bash
      run: |
        set -euo pipefail
        git fetch origin gh-pages || true
        if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
          git worktree add /tmp/invarlock-gh-pages refs/remotes/origin/gh-pages
        else
          git worktree add -B gh-pages /tmp/invarlock-gh-pages HEAD
          cd /tmp/invarlock-gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
        fi

        cd /tmp/invarlock-gh-pages
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        rm -rf "${DOCS_VERSION}"
        mkdir -p "${DOCS_VERSION}"
        cp -R "${GITHUB_WORKSPACE}/site-build/." "${DOCS_VERSION}/"

        default_target="latest/"
        if [ ! -d latest ] && [ "${DOCS_VERSION}" != "latest" ]; then
          default_target="${DOCS_VERSION}/"
        fi
        cat > index.html <<EOF
        <!doctype html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=${default_target}">
          <title>InvarLock Documentation</title>
        </head>
        <body>
          <p>Redirecting to <a href="${default_target}">${default_target}</a>.</p>
        </body>
        </html>
        EOF

        stable_target="../${DOCS_VERSION}/"
        rm -rf stable
        mkdir -p stable
        cat > stable/index.html <<EOF
        <!doctype html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=${stable_target}">
          <title>InvarLock Stable Documentation</title>
        </head>
        <body>
          <p>Redirecting to <a href="${stable_target}">${stable_target}</a>.</p>
        </body>
        </html>
        EOF

        git add "${DOCS_VERSION}" index.html stable
        if git diff --cached --quiet; then
          echo "No documentation changes to publish."
          exit 0
        fi
        git commit -m "docs: publish ${DOCS_VERSION}"
        git push origin HEAD:gh-pages
