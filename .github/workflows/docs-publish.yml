name: Publish Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs-publish.yml'
  workflow_dispatch:
    inputs:
      docs_version:
        description: "Optional docs version label override (for example: 0.8.0 or latest)"
        required: false
        type: string
      publish_latest:
        description: "Also publish this exact source as latest"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      docs_version:
        description: "Version label to publish (a leading v is removed)"
        required: true
        type: string
      publish_latest:
        description: "Also publish this exact source as latest"
        required: false
        type: boolean
        default: false

concurrency:
  group: docs-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish Versioned Docs
    if: github.repository == 'invarlock/invarlock'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: python -m pip install --require-hashes -r requirements/workflows/docs-ci-py313.txt

    - name: Resolve docs version
      id: version
      shell: bash
      env:
        INVARLOCK_DOCS_VERSION_OVERRIDE: ${{ inputs.docs_version }}
        INVARLOCK_DOCS_REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        override="${INVARLOCK_DOCS_VERSION_OVERRIDE}"
        ref_name="${INVARLOCK_DOCS_REF_NAME}"
        docs_version=''
        if [ -n "${override}" ]; then
          if [[ "${override}" =~ ^v[0-9] ]]; then
            docs_version="${override#v}"
          else
            docs_version="${override}"
          fi
        elif [ "${ref_name}" = "main" ]; then
          docs_version="latest"
        elif [[ "${ref_name}" == release/v* ]]; then
          docs_version="${ref_name#release/v}"
        else
          docs_version="${ref_name}"
        fi
        if [[ ! "${docs_version}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] \
          || [ "${docs_version}" = "." ] \
          || [ "${docs_version}" = ".." ]; then
          echo "docs_version must be one safe path component" >&2
          exit 1
        fi
        echo "docs_version=${docs_version}" >> "${GITHUB_OUTPUT}"

    - name: Build docs
      run: mkdocs build --strict --site-dir site-build

    - name: Publish versioned site
      env:
        DOCS_VERSION: ${{ steps.version.outputs.docs_version }}
        INVARLOCK_PUBLISH_LATEST: ${{ inputs.publish_latest }}
      shell: bash
      run: |
        set -euo pipefail
        publish_latest="${INVARLOCK_PUBLISH_LATEST:-false}"
        worktree_root="${RUNNER_TEMP}/invarlock-gh-pages"
        case "${publish_latest}" in
          true|false) ;;
          *)
            echo "publish_latest must be true or false" >&2
            exit 1
            ;;
        esac

        git fetch origin gh-pages || true
        if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
          git worktree add "${worktree_root}" refs/remotes/origin/gh-pages
        else
          git worktree add -B gh-pages "${worktree_root}" HEAD
          cd "${worktree_root}"
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
        fi

        cd "${worktree_root}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        rm -rf "${DOCS_VERSION}"
        mkdir -p "${DOCS_VERSION}"
        cp -R "${GITHUB_WORKSPACE}/site-build/." "${DOCS_VERSION}/"

        if [ "${publish_latest}" = "true" ] && [ "${DOCS_VERSION}" != "latest" ]; then
          rm -rf latest
          mkdir -p latest
          cp -R "${GITHUB_WORKSPACE}/site-build/." latest/
        fi

        default_target="latest/"
        if [ ! -d latest ] && [ "${DOCS_VERSION}" != "latest" ]; then
          default_target="${DOCS_VERSION}/"
        fi
        cat > index.html <<EOF
        <!doctype html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=${default_target}">
          <title>InvarLock Documentation</title>
        </head>
        <body>
          <p>Redirecting to <a href="${default_target}">${default_target}</a>.</p>
        </body>
        </html>
        EOF

        if [ "${publish_latest}" = "true" ] && [ "${DOCS_VERSION}" != "latest" ]; then
          stable_target="../${DOCS_VERSION}/"
          rm -rf stable
          mkdir -p stable
          cat > stable/index.html <<EOF
        <!doctype html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=${stable_target}">
          <title>InvarLock Stable Documentation</title>
        </head>
        <body>
          <p>Redirecting to <a href="${stable_target}">${stable_target}</a>.</p>
        </body>
        </html>
        EOF
        fi

        git add "${DOCS_VERSION}" index.html
        if [ "${publish_latest}" = "true" ] && [ "${DOCS_VERSION}" != "latest" ]; then
          git add latest stable
        fi
        if git diff --cached --quiet; then
          echo "No documentation changes to publish."
          exit 0
        fi
        git commit -m "docs: publish ${DOCS_VERSION}"
        git push origin HEAD:gh-pages
