name: Evaluator SDK capture

on:
  pull_request:
    paths:
      - 'src/invarlock/**'
      - 'contracts/**'
      - 'requirements/workflows/core-py312.txt'
      - 'requirements/workflows/release-install-py312.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/evaluation_records/**'
      - 'tests/examples/test_langfuse_export.py'
      - 'tests/integration/test_evaluator_parity.py'
      - 'examples/integrations/evaluator-parity/**'
      - 'examples/integrations/evaluator-live/**'
      - 'examples/evaluator-qualification/maintained/CAPTURE.md'
      - 'examples/evaluator-qualification/locks/**'
      - 'examples/evaluator-qualification/matrix.json'
      - 'scripts/evaluator_sdk_gate.sh'
      - 'Makefile'
      - '.github/workflows/evaluator-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: "capture (${{ matrix.evaluator }})"
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        evaluator:
          - lm-evaluation-harness
          - inspect-ai
          - promptfoo
          - deepeval
          - ragas
          - lighteval
          - hugging-face-evaluate
          - pydantic-evals
          - autoevals
          - openevals
          - mlflow
          - garak
          - openai-evals
          - arize-phoenix-evals
          - langfuse
          - opik
          - azure-ai-evaluation
          - evidently
          - trulens
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.4'
      - name: Set up Node for Promptfoo
        if: ${{ matrix.evaluator == 'promptfoo' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.0'
      - name: Exercise the pinned SDK without model or service calls
        env:
          EVALUATOR: ${{ matrix.evaluator }}
        run: make evaluator-sdk-test EVALUATOR="$EVALUATOR"
