name: repo-hygiene

on:
  pull_request:
    branches: [ main, staging/next ]

permissions:
  contents: read

jobs:
  lockfile-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.10.10"
      - name: Check uv.lock sync
        run: make lock-sync

  no-generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Detect forbidden files in PR diff
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          files="$(git diff --name-only --diff-filter=ACMR "$base" "$head")"
          if echo "$files" | grep -E '^(site/|node_modules/|dist/|build/|reports_report/|reports_.*/|runs/)' ; then
            echo "❌ Generated artifacts detected in the PR diff."; exit 1;
          else
            echo "✅ No generated artifacts in the PR diff.";
          fi
      - name: Ensure no duplicate test basenames
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dups < <(find tests -type f -name 'test_*.py' -exec basename {} \; | sort | uniq -d)
          if [ ${#dups[@]} -gt 0 ]; then
            echo "❌ Duplicate test filenames detected:";
            printf '  - %s\n' "${dups[@]}";
            exit 1;
          fi
          echo "✅ No duplicate test basenames in tests/."

  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Prevent >10MB files in PR diff
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          threshold=$((10 * 1024 * 1024))
          rc=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            sz=$(wc -c <"$f")
            if [ "$sz" -gt "$threshold" ]; then
              echo "❌ $f is ${sz} bytes (>10MB)"; rc=1
            fi
          done < <(git diff --name-only --diff-filter=ACMR "$base" "$head")
          exit $rc
