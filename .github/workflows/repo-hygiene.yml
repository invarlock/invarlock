name: repo-hygiene

on:
  pull_request:
    branches: [ main, staging/next ]

permissions:
  contents: read

jobs:
  lockfile-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.10.10"
      - name: Check uv.lock sync
        run: make lock-sync

  no-generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect forbidden files in PR diff
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          files="$(git diff --name-only --diff-filter=ACMR "$base" "$head")"
          if echo "$files" | grep -E '^(site/|node_modules/|dist/|build/|reports_report/|reports_.*/|runs/)' ; then
            echo "Generated artifacts detected in the pull request."; exit 1;
          else
            echo "No generated artifacts detected."
          fi

  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prevent >10MB files in PR diff
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          threshold=$((10 * 1024 * 1024))
          rc=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            sz=$(wc -c <"$f")
            if [ "$sz" -gt "$threshold" ]; then
              echo "$f is ${sz} bytes (>10MB)"; rc=1
            fi
          done < <(git diff --name-only --diff-filter=ACMR "$base" "$head")
          exit $rc
