name: Model Evidence Sweep

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Sweep suite name"
        required: false
        default: "current-supported-experimental"
        type: string
      slug:
        description: "Optional single manifest slug to rerun"
        required: false
        default: ""
        type: string
      device:
        description: "Device passed to scripts/model_evidence/model_evidence_sweep.py"
        required: false
        default: "cuda"
        type: string
      shard_index:
        description: "Zero-based shard index"
        required: false
        default: "0"
        type: string
      shard_count:
        description: "Total shard count"
        required: false
        default: "1"
        type: string
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  model-evidence-sweep:
    runs-on:
      - self-hosted
      - linux
      - gpu
    timeout-minutes: 1440
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      INVARLOCK_ALLOW_NETWORK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install (core + hf)
        run: python -m pip install --require-hashes -r requirements/workflows/ci-hf-py313.txt

      - name: Run shipped-model evidence sweep
        run: |
          SUITE="${{ github.event.inputs.suite || 'current-supported-experimental' }}"
          SLUG="${{ github.event.inputs.slug || '' }}"
          DEVICE="${{ github.event.inputs.device || 'cuda' }}"
          SHARD_INDEX="${{ github.event.inputs.shard_index || '0' }}"
          SHARD_COUNT="${{ github.event.inputs.shard_count || '1' }}"
          OUTPUT_ROOT="reports/model_evidence/${{ github.run_id }}"

          cmd=(
            python scripts/model_evidence/model_evidence_sweep.py
            --suite "$SUITE"
            --profile ci
            --device "$DEVICE"
            --shard-index "$SHARD_INDEX"
            --shard-count "$SHARD_COUNT"
            --output-root "$OUTPUT_ROOT"
          )
          if [ -n "$SLUG" ]; then
            cmd+=(--slug "$SLUG")
          fi
          "${cmd[@]}"

      - name: Upload model evidence artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: model-evidence-${{ github.run_id }}
          path: reports/model_evidence/${{ github.run_id }}/
          retention-days: 14
