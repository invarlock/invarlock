name: Documentation CI

on:
  push:
    branches: [main, staging/next, 'release/v*']
    paths:
      - '*.md'
      - '.github/**/*.md'
      - 'addins/**/*.md'
      - 'docs/**'
      - 'examples/**/*.md'
      - 'public_evidence/**/*.md'
      - 'requirements/**/*.md'
      - 'scripts/**/*.md'
      - 'tests/README.md'
      - 'tests/docs/**'
      - 'mkdocs.yml'
      - 'Makefile'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements/workflows/docs-ci-py313.txt'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    branches: [main, staging/next, 'release/v*']
    paths:
      - '*.md'
      - '.github/**/*.md'
      - 'addins/**/*.md'
      - 'docs/**'
      - 'examples/**/*.md'
      - 'public_evidence/**/*.md'
      - 'requirements/**/*.md'
      - 'scripts/**/*.md'
      - 'tests/README.md'
      - 'tests/docs/**'
      - 'mkdocs.yml'
      - 'Makefile'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements/workflows/docs-ci-py313.txt'
      - '.github/workflows/docs-ci.yml'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements/workflows/docs-ci-py313.txt
      - name: Install documentation linters
        run: npm ci
      - name: Check documentation
        run: make docs-check
      - name: Exercise documented commands
        run: make docs-live-fast
      - name: Upload rendered documentation
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: documentation
          path: site/
          retention-days: 3
      - name: Confirm a clean source tree
        run: |
          rm -rf site
          git diff --exit-code

  external-links:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements/workflows/docs-ci-py313.txt
      - name: Check external links
        run: linkchecker --check-extern docs/
