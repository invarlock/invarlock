name: Documentation CI

on:
  push:
    branches: [main, staging/next]
    paths:
      - '*.md'
      - '*.MD'
      - '**/*.md'
      - '**/*.MD'
      - 'docs/**'
      - 'tests/docs/**'
      - 'mkdocs.yml'
      - 'Makefile'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements/workflows/docs-ci-py313.txt'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    branches: [main, staging/next, 'release/v*']
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      external_links:
        description: "Check rendered documentation and external links"
        required: false
        default: false
        type: boolean

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: "docs"
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/workflows/docs-ci-py313.txt
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements/workflows/docs-ci-py313.txt
      - name: Install documentation linters
        run: npm ci
      - name: Audit documentation dependencies
        run: npm audit --audit-level=low
      - name: Exercise documented commands
        run: make docs-live-fast
      - name: Upload rendered documentation
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: documentation
          path: site/
          retention-days: 3
      - name: Confirm a clean source tree
        run: |
          rm -rf site
          git diff --exit-code

  external-links:
    name: "external-links"
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.external_links) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      PYTHON: python
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/workflows/docs-ci-py313.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements/workflows/docs-ci-py313.txt
      - name: Check external links
        run: make docs-external-links
