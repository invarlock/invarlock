name: Documentation CI

on:
  # Cost optimization: main branch docs build is already in ci.yml
  # This workflow handles docs-only validation on integration/release branches.
  push:
    branches: [ main, staging/next ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs-ci.yml'
  workflow_dispatch:
  pull_request:
    branches: [ main, develop, staging/next ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs-ci.yml'
  schedule:
    # Run weekly to check external links
    - cron: '0 2 * * 1'  # Monday 2 AM UTC

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single consolidated job for docs validation (saves ~10 min setup overhead)
  docs-validate:
    name: Docs Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: '3.13'

    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: '22'

    - name: Cache pip
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      # `act` can clobber PATH after setup-python on some hosts; cache is optional.
      if: ${{ !env.ACT }}
      with:
        path: ~/.cache/pip
        key: docs-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: docs-pip-

    - name: Install dependencies
      run: python -m pip install --require-hashes -r requirements/workflows/docs-ci-py313.txt

    - name: Build docs (strict)
      run: mkdocs build --strict

    - name: Check internal links
      run: python scripts/docs_check.py --links

    - name: Lint markdown
      run: python scripts/docs_lint.py --markdown

    - name: Spell check
      run: python scripts/docs_lint.py --spell

    - name: Check consistency
      run: python scripts/docs_check.py --consistency

    - name: Run curated live examples
      run: make docs-live-fast

    - name: Check for secrets
      run: |
        if grep -r -E "sk-[a-zA-Z0-9]{48}" docs/; then
          exit 1
        fi
        if grep -r -E "ghp_[a-zA-Z0-9]{36}" docs/; then
          exit 1
        fi
        if grep -r -E "/home/|/Users/|C:\\\\" docs/; then
          exit 1
        fi

    - name: Validate examples
      run: python scripts/docs_check.py --examples
      timeout-minutes: 5

    - name: Check build size
      run: |
        SITE_SIZE=$(du -sm site | cut -f1)
        echo "Documentation site size: ${SITE_SIZE}MB"
        if [ "${SITE_SIZE}" -gt 50 ]; then echo "Warning: Site > 50MB"; exit 1; fi

    - name: Ensure clean working tree
      run: |
        rm -rf site
        git diff --exit-code

    - name: Upload build artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: docs-build
        path: site/
        retention-days: 3

  # External links only on schedule (avoids rate limiting)
  check-external-links:
    name: Check External Links
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: '3.13'

    - name: Install link checker
      run: python -m pip install --require-hashes -r requirements/workflows/docs-ci-py313.txt

    - name: Check external links
      run: linkchecker --check-extern docs/

  # Deploy preview only on PRs when Netlify secrets are configured
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.repository == 'invarlock/invarlock'
    needs: [docs-validate]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: python -m pip install --require-hashes -r requirements/workflows/docs-ci-py313.txt

    - name: Build documentation
      run: mkdocs build

    - name: Deploy to Netlify
      if: env.NETLIFY_AUTH_TOKEN != ''
      uses: nwtgck/actions-netlify@4cbaf4c08f1a7bfa537d6113472ef4424e4eb654
      with:
        publish-dir: './site'
        production-branch: main
        github-token: ${{ secrets.GITHUB_TOKEN }}
        deploy-message: "Deploy from GitHub Actions"
        enable-pull-request-comment: true
        enable-commit-comment: false
        overwrites-pull-request-comment: true
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
