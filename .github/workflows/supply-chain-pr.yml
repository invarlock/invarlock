name: Supply Chain PR Scan

on:
  pull_request:
    branches: [ main, staging/next ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Supply Chain Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install supply-chain tools
        run: python -m pip install --require-hashes -r requirements/workflows/release-security-py313.txt

      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build release wheel
        run: |
          rm -rf build dist
          python -m build

      - name: Create install-surface venv
        id: install_surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifact-venv
          python -m venv .artifact-venv
          . .artifact-venv/bin/activate
          python -m pip install dist/*.whl
          site_packages="$(python - <<'PY'
          import site
          paths = site.getsitepackages()
          print(paths[0] if paths else site.getusersitepackages())
          PY
          )"
          echo "python=.artifact-venv/bin/python" >> "$GITHUB_OUTPUT"
          echo "site_packages=${site_packages}" >> "$GITHUB_OUTPUT"

      - name: Run pip-audit
        run: python scripts/security/run_pip_audit.py --path "${{ steps.install_surface.outputs.site_packages }}"

      - name: Generate install-surface SBOM
        run: bash scripts/generate_sbom.sh --scope install-surface --python "${{ steps.install_surface.outputs.python }}" artifacts/supply-chain/sbom.json

      - name: Create HF surface venv
        id: hf_surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hf-venv
          python -m venv .hf-venv
          . .hf-venv/bin/activate
          python -m pip install dist/*.whl --no-deps
          python -m pip install --require-hashes -r requirements/workflows/hf-py313.txt
          site_packages="$(python - <<'PY'
          import site
          paths = site.getsitepackages()
          print(paths[0] if paths else site.getusersitepackages())
          PY
          )"
          echo "site_packages=${site_packages}" >> "$GITHUB_OUTPUT"

      - name: Run HF surface pip-audit
        run: python scripts/security/run_pip_audit.py --path "${{ steps.hf_surface.outputs.site_packages }}"

      - name: Create advanced surface venv
        id: advanced_surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .advanced-venv
          python -m venv .advanced-venv
          . .advanced-venv/bin/activate
          python -m pip install dist/*.whl --no-deps
          python -m pip install --require-hashes -r requirements/workflows/advanced-py313.txt
          site_packages="$(python - <<'PY'
          import site
          paths = site.getsitepackages()
          print(paths[0] if paths else site.getusersitepackages())
          PY
          )"
          echo "site_packages=${site_packages}" >> "$GITHUB_OUTPUT"

      - name: Run advanced surface pip-audit
        run: python scripts/security/run_pip_audit.py --path "${{ steps.advanced_surface.outputs.site_packages }}"

      - name: Run gitleaks history scan
        id: gitleaks_scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/supply-chain
          set +e
          gitleaks git . \
            --redact \
            --no-banner \
            --report-format json \
            --report-path artifacts/supply-chain/gitleaks.json
          exit_code=$?
          gitleaks git . \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path artifacts/supply-chain/gitleaks.sarif
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Upload supply-chain artifacts
        if: ${{ always() && steps.gitleaks_scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: supply-chain-pr-artifacts
          path: |
            artifacts/supply-chain/sbom.json
            artifacts/supply-chain/gitleaks.json
            artifacts/supply-chain/gitleaks.sarif
          if-no-files-found: error
          retention-days: 3

      - name: Fail on secret findings
        if: ${{ always() && steps.gitleaks_scan.outcome != 'skipped' }}
        shell: bash
        run: |
          if [ "${{ steps.gitleaks_scan.outputs.exit_code }}" != "0" ]; then
            echo "gitleaks detected secrets; see uploaded artifact for details" >&2
            exit 1
          fi
