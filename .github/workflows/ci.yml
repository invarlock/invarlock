name: CI

on:
  push:
    branches: [main, staging/next]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the complete repository and distribution gates"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.full && 'full' || 'standard' }}
  # Standard and full checks may run together.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy-engine-interop:
    name: "policy-engine-interop"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install core dependencies
        run: python -m pip install --require-hashes -r requirements/workflows/core-py312.txt
      - name: Install pinned policy engines
        run: |
          install_pinned_engine() {
            local module="$1" attempt status
            for attempt in 1 2 3; do
              if go install "$module"; then
                return 0
              else
                status=$?
              fi
              if [ "$attempt" -eq 3 ]; then
                return "$status"
              fi
              echo "Policy engine download/build failed; retrying pinned installation ($attempt/3)." >&2
              sleep 5
            done
          }
          install_pinned_engine github.com/open-policy-agent/opa@v1.17.0
          install_pinned_engine cuelang.org/go/cmd/cue@v0.16.1
      - name: Run policy-engine interoperability matrix
        run: |
          gopath="$(go env GOPATH)"
          make acceptance-policy-interop OPA="${gopath}/bin/opa" CUE="${gopath}/bin/cue"

  verify-checks:
    name: "verify-checks"
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: default
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Install dependencies
        run: |
          python scripts/security/build_hardened_accelerate_wheel.py bootstrap
          uv pip install --python "$(command -v python)" --compile-bytecode --require-hashes --no-config --find-links runtime/wheels -r requirements/workflows/ci-hf-py313.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Check installed hardened Accelerate APIs
        run: python -I tests/scripts/hardened_accelerate_checks.py
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Exercise installed captured evaluation workflows
        run: python examples/captured-results/wheel_smoke.py
      - name: Verify real ModelKit package handoff
        shell: bash
        run: |
          set -euo pipefail
          kit_root="$(mktemp -d)"
          trap 'rm -rf "$kit_root"' EXIT
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/kitops-ml/kitops/releases/download/v1.15.0/kitops-linux-x86_64.tar.gz \
            --output "$kit_root/kit.tar.gz"
          echo "c95ab7cfe1a57fcb37101454ff1d5b2783781a72cbbb4016018a701c892bf26f  $kit_root/kit.tar.gz" | sha256sum --check --status
          tar -xzf "$kit_root/kit.tar.gz" -C "$kit_root"
          export INVARLOCK_KIT_BINARY="$kit_root/kit"
          INVARLOCK_KIT_BINARY_SHA256="$(sha256sum "$INVARLOCK_KIT_BINARY" | cut -d ' ' -f1)"
          export INVARLOCK_KIT_BINARY_SHA256
          python -m pytest -q tests/integration/test_modelkit_cli.py
      - name: Run repository checks
        run: make verify-checks
      - name: Check full-capacity signed verification
        run: python -m pytest -q 'tests/evaluation_comparison/test_capacity.py::test_full_capacity_signed_independent_recipient[50000]'
      - name: Lint workflows
        run: |
          gopath="$(go env GOPATH)"
          export PATH="${gopath}/bin:$PATH"
          make workflow-lint

  verify-packages:
    name: "verify-packages"
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: default
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Install dependencies
        run: |
          python scripts/security/build_hardened_accelerate_wheel.py bootstrap
          uv pip install --python "$(command -v python)" --compile-bytecode --require-hashes --no-config --find-links runtime/wheels -r requirements/workflows/ci-hf-py313.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Build, install, and validate distributions
        run: make install-smoke inspect-judge-sdk-test langfuse-sdk-test

  evaluator-parity:
    name: "evaluator-parity"
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: default
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Install dependencies
        run: |
          python scripts/security/build_hardened_accelerate_wheel.py bootstrap
          uv pip install --python "$(command -v python)" --compile-bytecode --require-hashes --no-config --find-links runtime/wheels -r requirements/workflows/ci-hf-py313.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Check all dedicated evaluator profiles with an installed recipient
        run: >-
          INVARLOCK_REPLAY_RETAINED_CAMPAIGNS=0
          PYTHON=python
          bash scripts/evaluator_parity_gate.sh

  verify-fast:
    name: "verify-fast"
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.full) }}
    needs: [verify-checks, verify-packages, evaluator-parity]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require every verification check
        env:
          CHECK_RESULT: ${{ needs.verify-checks.result }}
          PACKAGE_RESULT: ${{ needs.verify-packages.result }}
          PARITY_RESULT: ${{ needs.evaluator-parity.result }}
        run: test "$CHECK_RESULT" = success && test "$PACKAGE_RESULT" = success && test "$PARITY_RESULT" = success

  minimum-python-packages:
    name: "minimum-python-packages"
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: default
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Install dependencies
        run: |
          python scripts/security/build_hardened_accelerate_wheel.py bootstrap
          uv pip install --python "$(command -v python)" --compile-bytecode --require-hashes --no-config --find-links runtime/wheels -r requirements/workflows/ci-hf-py312.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Check command surface
        run: make cli-smoke-core
      - name: Build, install, and validate distributions
        run: make install-smoke inspect-judge-sdk-test langfuse-sdk-test

  minimum-python-parity:
    name: "minimum-python-parity"
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: default
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Install dependencies
        run: |
          python scripts/security/build_hardened_accelerate_wheel.py bootstrap
          uv pip install --python "$(command -v python)" --compile-bytecode --require-hashes --no-config --find-links runtime/wheels -r requirements/workflows/ci-hf-py312.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Check all dedicated evaluator profiles with an installed recipient
        run: >-
          INVARLOCK_REPLAY_RETAINED_CAMPAIGNS=0
          PYTHON=python
          bash scripts/evaluator_parity_gate.sh

  minimum-python-tests:
    name: "minimum-python-tests (${{ matrix.shard }})"
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: default
    strategy:
      fail-fast: false
      matrix:
        shard: [core, core-capacity, examples, examples-comparisons, examples-journeys, examples-judge, examples-judge-review, examples-judge-priority, support, runtime]
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Install dependencies
        run: |
          python scripts/security/build_hardened_accelerate_wheel.py bootstrap
          uv pip install --python "$(command -v python)" --compile-bytecode --require-hashes --no-config --find-links runtime/wheels -r requirements/workflows/ci-hf-py312.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Run disjoint minimum-Python tests
        run: python scripts/ci/coverage_runner.py test ${{ matrix.shard }} --workers 2

  minimum-python:
    name: "minimum-python"
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.full) }}
    needs: [minimum-python-tests, minimum-python-packages, minimum-python-parity]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require every minimum-Python check
        env:
          TEST_RESULT: ${{ needs.minimum-python-tests.result }}
          PACKAGE_RESULT: ${{ needs.minimum-python-packages.result }}
          PARITY_RESULT: ${{ needs.minimum-python-parity.result }}
        run: test "$TEST_RESULT" = success && test "$PACKAGE_RESULT" = success && test "$PARITY_RESULT" = success

  coverage-tests:
    name: "coverage-tests (${{ matrix.shard }})"
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [core, core-capacity, examples, examples-comparisons, examples-parity, examples-journeys, examples-judge, examples-judge-review, examples-judge-priority, support, runtime]
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: default
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Install dependencies
        run: |
          python scripts/security/build_hardened_accelerate_wheel.py bootstrap
          uv pip install --python "$(command -v python)" --compile-bytecode --require-hashes --no-config --find-links runtime/wheels -r requirements/workflows/ci-hf-py313.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Install runtime coverage SDK dependencies
        if: ${{ matrix.shard == 'runtime' }}
        run: |
          uv pip install --python "$(command -v python)" --compile-bytecode --require-hashes --no-config -r requirements/workflows/inspect-judge-tests-py313.txt
          python -m pip check
      - name: Install examples coverage SDK dependencies
        if: ${{ startsWith(matrix.shard, 'examples') }}
        run: |
          uv pip install --python "$(command -v python)" --compile-bytecode --require-hashes --no-config -r requirements/workflows/inspect-judge-tests-py313.txt
          uv pip install --python "$(command -v python)" --compile-bytecode --require-hashes --no-config -r requirements/workflows/langfuse-sdk-tests-py313.txt
          python -m pip check
      - name: Collect disjoint test coverage
        env:
          INVARLOCK_REQUIRE_LANGFUSE_SDK: ${{ startsWith(matrix.shard, 'examples') && '1' || '0' }}
          INVARLOCK_REQUIRE_INSPECT_SDK: ${{ (matrix.shard == 'runtime' || startsWith(matrix.shard, 'examples')) && '1' || '0' }}
        run: make coverage-collect-${{ matrix.shard }} PYTEST_WORKERS=2
      - name: Retain coverage and test timings
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: artifacts/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: "coverage"
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.full) }}
    needs: [coverage-tests, verify-fast]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require successful test and capacity checks
        env:
          SHARD_RESULT: ${{ needs.coverage-tests.result }}
          CHECK_RESULT: ${{ needs.verify-fast.result }}
        run: test "$SHARD_RESULT" = success && test "$CHECK_RESULT" = success
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/workflows/coverage-report-py313.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Download coverage measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: coverage-shard-*
          path: artifacts/coverage/
          merge-multiple: true
      - name: Enforce coverage
        run: make coverage-report
      - name: Retain coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-reports
          path: reports/*cov.xml
          if-no-files-found: error
          retention-days: 7

  verify-full:
    name: "verify-full"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: default
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.4"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python scripts/security/build_hardened_accelerate_wheel.py bootstrap
          python -m pip install --require-hashes --find-links runtime/wheels -r requirements/workflows/ci-hf-py313.txt
          python -m pip install --require-hashes -r requirements/workflows/docs-ci-py313.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Check installed hardened Accelerate APIs
        run: python -I tests/scripts/hardened_accelerate_checks.py
      - name: Install documentation linters
        run: npm ci
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Install runtime coverage SDK dependencies
        run: |
          python -m pip install --require-hashes -r requirements/workflows/inspect-judge-tests-py313.txt
          python -m pip check
      - name: Install examples coverage SDK dependencies
        run: |
          python -m pip install --require-hashes -r requirements/workflows/langfuse-sdk-tests-py313.txt
          python -m pip check
      - name: Report temporary storage before full verification
        run: |
          df -hT /tmp "$TMPDIR"
          df -i /tmp "$TMPDIR"
          findmnt --target /tmp
          findmnt --target "$TMPDIR"
          python -c 'import tempfile; print("Python temporary directory:", tempfile.gettempdir())'
      - name: Run complete repository gates
        env:
          INVARLOCK_REQUIRE_INSPECT_SDK: "1"
          INVARLOCK_REQUIRE_LANGFUSE_SDK: "1"
        run: make verify
      - name: Lint workflows
        run: |
          gopath="$(go env GOPATH)"
          export PATH="${gopath}/bin:$PATH"
          make workflow-lint
      - name: Build, install, and validate distributions
        run: make install-smoke inspect-judge-sdk-test langfuse-sdk-test
      - name: Check all dedicated evaluator profiles with an installed recipient
        run: make evaluator-parity-test
      - name: Report temporary storage after full verification
        if: ${{ always() }}
        run: |
          df -hT /tmp "$TMPDIR"
          df -i /tmp "$TMPDIR"

  supply-chain:
    name: "supply-chain"
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Use disk-backed temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install security tools
        run: python -m pip install --require-hashes -r requirements/workflows/security-ci-py313.txt
      - name: Generate tool-environment SBOM
        run: bash scripts/security/generate_sbom.sh --scope tool-environment
      - name: Audit dependencies
        run: python scripts/security/run_pip_audit.py
      - name: Audit maintained dependency locks
        run: |
          python scripts/security/build_hardened_accelerate_wheel.py bootstrap
          python scripts/security/cve_audit.py \
            --out-json artifacts/supply-chain/cve-audit.json \
            --out-md artifacts/supply-chain/cve-audit.md
      - name: Upload dependency audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-cve-audit
          path: |
            artifacts/supply-chain/cve-audit.json
            artifacts/supply-chain/cve-audit.md
          if-no-files-found: error
          retention-days: 14
