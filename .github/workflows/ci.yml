name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    # Allow supply-chain job to run on release tags too.
    tags: [ 'v*' ]
    paths-ignore:
      # docs-only changes are validated in docs-ci.yml on push/PR instead.
      - 'docs/**'
      - '*.md'
      - '.markdownlint*'
      - 'mkdocs.yml'
  pull_request:
    paths-ignore:
      # docs-only changes are validated in docs-ci.yml on push/PR instead.
      - 'docs/**'
      - '*.md'
      - '.markdownlint*'
      - 'mkdocs.yml'
  workflow_dispatch:
    inputs:
      full:
        description: "Run full verify (slow): make verify + mkdocs build"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Weekly full-ish gate to catch regressions without slowing PRs.
    - cron: "0 2 * * 1"  # Monday 2 AM UTC

permissions:
  contents: read

jobs:
  # Single test job (Python 3.13)
  tests-docs:
    if: ${{ github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full == 'true') }}
    runs-on: ubuntu-latest
    env:
      INVARLOCK_LIGHT_IMPORT: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: "default"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        # `act` can clobber PATH after setup-python on some hosts; cache is optional.
        if: ${{ github.actor != 'nektos/act' }}
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.13-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.13-

      - name: Install (core + hf + docs)
        run: python -m pip install --require-hashes -r requirements/workflows/ci-hf-py313.txt

      - name: Curated tests (light import for help/doctor)
        run: |
          pytest -q \
            tests/cli/test_python_m_invarlock.py \
            tests/cli/test_report_help_and_html.py \
            tests/cli/test_doctor_json.py \
            tests/cli/test_doctor_cross_checks.py \
            tests/cli/test_doctor_json_cls_pseudo_counts.py \
            tests/cli/test_doctor_json_cls_measured_no_d012.py \
            tests/cli/test_doctor_json_tiny_relax_note.py \
            tests/integration/scripts/test_tiny_matrix_checklist.py \
            tests/reporting/test_report_schema_v1_accuracy_tags.py \
            tests/reporting/test_report_markdown_estimated_suffix.py \
            tests/reporting/test_report_markdown_no_estimated_for_measured.py

      - name: Allow-list contracts (fast unit set)
        run: |
          pytest -q \
            tests/reporting/test_report_acceptance.py \
            tests/cli/test_console_validation_block.py \
            tests/cli/test_verify_json_shape.py::test_verify_json_envelope_is_stable \
            tests/cli/test_verify_json_single_line.py::test_verify_json_single_line \
            tests/cli/test_plugins_json_shape.py \
            tests/cli/test_doctor_json_format_version.py \
            tests/docs/test_docs_lexicon.py \
            tests/docs/test_docs_schema_label.py \
            tests/reporting/test_evidence_bundle.py \
            tests/ci/test_golden_runs_offline.py

      - name: Docs build (strict)
        run: |
          mkdocs build --strict

  # Minimum-supported Python (3.12) smoke (small subset).
  tests-min-py312:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    env:
      INVARLOCK_LIGHT_IMPORT: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: "default"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        # `act` can clobber PATH after setup-python on some hosts; cache is optional.
        if: ${{ github.actor != 'nektos/act' }}
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Install (core + hf)
        run: python -m pip install --require-hashes -r requirements/workflows/ci-hf-py312.txt

      - name: Min supported smoke
        run: |
          pytest -q \
            tests/core \
            tests/guards \
            tests/reporting \
            tests/cli/test_python_m_invarlock.py

  # Scheduled (or manual full) gate: broader tests + lint/format + docs build.
  verify-full:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full == 'true') }}
    runs-on: ubuntu-latest
    env:
      INVARLOCK_LIGHT_IMPORT: "1"
      PYTHONWARNINGS: "default"
      PYTHON: "python"
      PYTHONPATH: ${{ github.workspace }}/src
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        # `act` can clobber PATH after setup-python on some hosts; cache is optional.
        if: ${{ github.actor != 'nektos/act' }}
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.13-full-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.13-full-

      - name: Install (core + hf + verify tools)
        run: python -m pip install --require-hashes -r requirements/workflows/ci-hf-py313.txt

      - name: Full verify
        run: |
          make verify
          mkdocs build --strict

  # Supply-chain security (weekly + tags only to save cost)
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install supply-chain tools
        run: python -m pip install --require-hashes -r requirements/workflows/security-ci-py313.txt

      - name: Generate SBOM
        run: bash scripts/generate_sbom.sh

      - name: Run pip-audit
        run: pip-audit --ignore-vuln GHSA-4xh5-x5gv-qwph
