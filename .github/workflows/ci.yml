name: CI

on:
  push:
    branches: [main, staging/next, 'release/v*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the complete repository and distribution gates"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy-engine-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core dependencies
        run: python -m pip install --require-hashes -r requirements/workflows/core-py312.txt
      - name: Install pinned policy engines
        run: |
          go install github.com/open-policy-agent/opa@v1.17.0
          go install cuelang.org/go/cmd/cue@v0.16.1
      - name: Run policy-engine interoperability matrix
        run: |
          gopath="$(go env GOPATH)"
          make acceptance-policy-interop OPA="${gopath}/bin/opa" CUE="${gopath}/bin/cue"

  verify-fast:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: default
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.10.10"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/workflows/ci-hf-py313.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Exercise installed pipeline workflows
        run: python examples/pipeline/wheel_smoke.py
      - name: Run fast repository gates
        run: make verify-fast
      - name: Build, install, and validate distributions
        run: make addins-install-smoke
      - name: Lint workflows
        run: |
          gopath="$(go env GOPATH)"
          export PATH="${gopath}/bin:$PATH"
          make workflow-lint

  minimum-python:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: default
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.10.10"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/workflows/ci-hf-py312.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Run minimum-Python tests
        run: make test-fast addins-test PYTEST_WORKERS=auto
      - name: Check command surface
        run: make cli-smoke-core
      - name: Build, install, and validate distributions
        run: make addins-install-smoke

  coverage:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: default
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/workflows/ci-hf-py313.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Enforce coverage
        run: make coverage-enforce

  verify-full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: default
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.10.10"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/workflows/ci-hf-py313.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Install documentation linters
        run: npm ci
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Run complete repository gates
        run: make verify
      - name: Lint workflows
        run: |
          gopath="$(go env GOPATH)"
          export PATH="${gopath}/bin:$PATH"
          make workflow-lint
      - name: Build, install, and validate distributions
        run: make addins-install-smoke

  supply-chain:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install security tools
        run: python -m pip install --require-hashes -r requirements/workflows/security-ci-py313.txt
      - name: Generate tool-environment SBOM
        run: bash scripts/security/generate_sbom.sh --scope tool-environment
      - name: Audit dependencies
        run: python scripts/security/run_pip_audit.py
      - name: Audit maintained dependency locks
        run: |
          python scripts/security/cve_audit.py \
            --out-json artifacts/supply-chain/cve-audit.json \
            --out-md artifacts/supply-chain/cve-audit.md
      - name: Upload dependency audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-cve-audit
          path: |
            artifacts/supply-chain/cve-audit.json
            artifacts/supply-chain/cve-audit.md
          if-no-files-found: error
          retention-days: 14
