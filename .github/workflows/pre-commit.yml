name: pre-commit

on:
  # Cost optimization: only run on PRs (main pushes already passed PR checks)
  pull_request:
    paths:
      - '**.py'
      - '**.yaml'
      - '**.yml'
      - '**.json'
      - '**.md'
      - '.pre-commit-config.yaml'

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Cache pre-commit
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        # `act` can clobber PATH after setup-python on some hosts; cache is optional.
        if: ${{ !env.ACT }}
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-
      - name: Install pre-commit
        run: python -m pip install --require-hashes -r requirements/workflows/precommit-ci-py313.txt
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
