name: pre-commit

on:
  # Cost optimization: only run on PRs (main pushes already passed PR checks)
  pull_request:
    paths:
      - '**.py'
      - '**.yaml'
      - '**.yml'
      - '**.json'
      - '**.md'
      - '.pre-commit-config.yaml'

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        # `act` can clobber PATH after setup-python on some hosts; cache is optional.
        if: ${{ !env.ACT }}
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-
      - name: Install pre-commit
        run: python -m pip install --require-hashes -r requirements/workflows/precommit-ci-py313.txt
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
