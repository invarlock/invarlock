name: Guard Overhead and Stability Benchmark

on:
  # This paired bare/guarded benchmark measures primary-metric impact, runtime,
  # memory, and stability gates. It does not measure detection efficacy.
  # It is expensive and runs only by explicit manual dispatch.
  workflow_dispatch:
    inputs:
      profile:
        description: 'Benchmark profile'
        required: false
        default: 'ci'
        type: choice
        options:
          - ci
          - release
      edits:
        description: 'Comma-separated edit types'
        required: false
        default: 'quant_rtn'
        type: string

env:
  PYTHONPATH: ${{ github.workspace }}/src

permissions:
  contents: read

jobs:
  guard-effect-benchmark:
    if: github.event.inputs.profile != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      matrix:
        # Cost optimization: single Python version for benchmarks
        python-version: ["3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      # `act` can clobber PATH after setup-python on some hosts; cache is optional.
      if: ${{ !env.ACT }}
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install core dependencies
      run: python -m pip install --require-hashes -r requirements/workflows/hf-py313.txt

    - name: Verify installation
      run: |
        python -c "import invarlock.cli.bench; print('Benchmark module imported successfully')"
        python -m invarlock.cli.bench --help

    - name: Run CI overhead and stability benchmark
      id: benchmark-ci
      run: |
        EDITS="${{ github.event.inputs.edits || 'quant_rtn' }}"

        echo "Running overhead and stability benchmark with profile=ci, edits=$EDITS"

        python -m invarlock.cli.bench \
          --edits "$EDITS" \
          --profile ci \
          --dataset wikitext2 \
          --model-id gpt2 \
          --adapter hf_causal \
          --device cpu \
          --seq-len 256 \
          --stride 64 \
          --seed 42 \
          --out benchmarks/ \
          --verbose

    - name: Upload benchmark results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()  # Upload even if benchmark fails
      with:
        name: guard-overhead-stability-results-py${{ matrix.python-version }}
        path: |
          benchmarks/results/
          benchmarks/runs/*/events.jsonl
        retention-days: 30

    - name: Fail if overhead or stability thresholds are not met
      if: always() && steps.benchmark-ci.outcome == 'failure'
      run: |
        echo "Guard overhead and stability benchmark failed - thresholds not met"
        echo "Check the benchmark results for details on which thresholds failed"
        exit 1

  # Separate release-profile job, also manual-only.
  guard-effect-benchmark-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'release'
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - name: Set up Python 3.13
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: python -m pip install --require-hashes -r requirements/workflows/hf-py313.txt

    - name: Run release overhead and stability benchmark
      run: |
        EDITS="${{ github.event.inputs.edits || 'quant_rtn' }}"
        python -m invarlock.cli.bench \
          --edits "$EDITS" \
          --profile release \
          --dataset wikitext2 \
          --model-id gpt2 \
          --adapter hf_causal \
          --device cpu \
          --seq-len 512 \
          --stride 128 \
          --seed 42 \
          --out benchmarks/ \
          --verbose

    - name: Prepare release benchmark report
      run: |
        mkdir -p docs/benchmarks/
        cp benchmarks/results/guard_effect.md docs/benchmarks/guard_effect_latest.md
        cp benchmarks/results/guard_effect.json docs/benchmarks/guard_effect_latest.json

        echo "Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> docs/benchmarks/guard_effect_latest.md
        echo "Commit: ${{ github.sha }}" >> docs/benchmarks/guard_effect_latest.md

    - name: Upload release benchmark results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: guard-overhead-stability-results-release
        path: |
          benchmarks/results/
          docs/benchmarks/guard_effect_latest.md
          docs/benchmarks/guard_effect_latest.json
        retention-days: 90
