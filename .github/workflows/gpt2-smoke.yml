name: GPT-2 Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: gpt2-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      INVARLOCK_ALLOW_NETWORK: "1"
      INVARLOCK_DEDUP_TEXTS: "1"
      INVARLOCK_SMOKE_MODE: "container"
      INVARLOCK_SMOKE_PROFILE: "dev"
      INVARLOCK_SMOKE_JOURNEYS: "strict-bundle,noop,quantized,edited,negative"
      INVARLOCK_RUNTIME_IMAGE: "invarlock-runtime:local"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: ${{ github.actor != 'nektos/act' }}
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-gpt2-smoke-${{ hashFiles('pyproject.toml', 'requirements/workflows/ci-hf-py312.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-gpt2-smoke-

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/workflows/ci-hf-py312.txt

      - name: Build runtime image
        run: |
          make runtime-image

      - name: Run GPT-2 user journey smoke
        run: bash scripts/smoke/run_gpt2_user_journey_smoke.sh "$RUNNER_TEMP/invarlock-gpt2-smoke"
