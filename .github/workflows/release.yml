name: release

on:
  # Only run on tags or manual workflow dispatch (saves compute)
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to package index"
        type: boolean
        default: false
      target:
        description: "Publish target (testpypi|pypi)"
        type: choice
        options: [ testpypi, pypi ]
        default: testpypi
      release_tag:
        description: "Existing release tag to rebuild/publish (for example v0.5.0)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  resolve_release_ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve_release_ref.outputs.release_tag }}
      release_sha: ${{ steps.resolve_release_ref.outputs.release_sha }}
    steps:
      - name: Resolve release ref
        id: resolve_release_ref
        shell: bash
        run: |
          set -euo pipefail

          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          resolve_sha() {
            local tag="$1"
            case "${tag}" in
              v*)
                ;;
              *)
                echo "release_tag must start with v" >&2
                exit 1
                ;;
            esac

            mapfile -t remote_refs < <(
              git ls-remote --tags "${remote}" "refs/tags/${tag}" "refs/tags/${tag}^{}" || true
            )
            if [ "${#remote_refs[@]}" -eq 0 ]; then
              echo "release_tag '${tag}' was not found as a tag" >&2
              exit 1
            fi

            local sha=""
            for ref in "${remote_refs[@]}"; do
              ref_sha="${ref%%$'\t'*}"
              ref_name="${ref#*$'\t'}"
              if [ "${ref_name}" = "refs/tags/${tag}^{}" ]; then
                sha="${ref_sha}"
                break
              fi
              if [ -z "${sha}" ]; then
                sha="${ref_sha}"
              fi
            done

            if [ -z "${sha}" ]; then
              echo "failed to resolve commit SHA for ${tag}" >&2
              exit 1
            fi

            printf '%s\n' "${sha}"
          }

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.release_tag }}"
            if [ -z "${tag}" ]; then
              echo "release_tag is required for manual release dispatch" >&2
              exit 1
            fi
          fi

          sha="$(resolve_sha "${tag}")"

          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${sha}" >> "$GITHUB_OUTPUT"

  build_check:
    needs: resolve_release_ref
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.resolve_release_ref.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install build tooling
        run: python -m pip install --require-hashes -r requirements/workflows/release-security-py313.txt
      - name: Cache gitleaks binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/bin/gitleaks
          key: gitleaks-v8.30.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install gitleaks
        run: |
          gitleaks_bin="$(go env GOPATH)/bin/gitleaks"
          if [ ! -x "${gitleaks_bin}" ]; then
            go install github.com/zricethezav/gitleaks/v8@v8.30.0
          fi
          "${gitleaks_bin}" version
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Resolve gitleaks release range
        id: gitleaks_range
        shell: bash
        run: |
          set -euo pipefail
          release_sha="${{ needs.resolve_release_ref.outputs.release_sha }}"
          git fetch --force --tags origin "refs/tags/v*:refs/tags/v*"
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${release_sha}^" 2>/dev/null || true)"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          if [ -n "${previous_tag}" ]; then
            echo "log_opts=${previous_tag}..${release_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=" >> "$GITHUB_OUTPUT"
            echo "No previous release tag found; scanning full reachable history."
          fi
      - name: Run gitleaks release delta scan
        id: gitleaks_scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/supply-chain
          log_opts="${{ steps.gitleaks_range.outputs.log_opts }}"
          cmd=(
            gitleaks git .
            --config .gitleaks.toml
            --redact
            --no-banner
            --report-format json
            --report-path artifacts/supply-chain/gitleaks.json
          )
          if [ -n "${log_opts}" ]; then
            echo "Scanning release commit range: ${log_opts}"
            cmd+=(--log-opts "${log_opts}")
          else
            echo "Scanning full reachable release history."
          fi
          set +e
          "${cmd[@]}"
          exit_code=$?
          set -e
          if [ ! -s artifacts/supply-chain/gitleaks.json ]; then
            printf '[]\n' > artifacts/supply-chain/gitleaks.json
          fi
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
      - name: Build wheel/sdist
        run: |
          rm -rf build dist
          python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Install smoke from wheel
        env:
          INVARLOCK_LIGHT_IMPORT: "1"
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python - <<'PY'
          import hashlib
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          print(f"Wheel digest verified: {digest}")
          PY
          python -m pip install --upgrade --require-hashes -r requirements/workflows/pip-bootstrap-py313.txt
          python -m pip install dist/*.whl
          invarlock --help
          python -c "import invarlock.cli.app"
      - name: Create release install-surface venv
        id: install_surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifact-venv
          python -m venv .artifact-venv
          . .artifact-venv/bin/activate
          python -m pip install --upgrade --require-hashes -r requirements/workflows/pip-bootstrap-py313.txt
          python -m pip install dist/*.whl
          site_packages="$(python - <<'PY'
          import site
          paths = site.getsitepackages()
          print(paths[0] if paths else site.getusersitepackages())
          PY
          )"
          echo "python=.artifact-venv/bin/python" >> "$GITHUB_OUTPUT"
          echo "site_packages=${site_packages}" >> "$GITHUB_OUTPUT"
      - name: Run release pip-audit
        run: python scripts/security/run_pip_audit.py --path "${{ steps.install_surface.outputs.site_packages }}"
      - name: Generate release install-surface SBOM
        run: bash scripts/security/generate_sbom.sh --scope install-surface --python "${{ steps.install_surface.outputs.python }}" artifacts/supply-chain/sbom.json
      - name: Upload dist artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-sbom
          path: artifacts/supply-chain/sbom.json
          if-no-files-found: error
          retention-days: 3
      - name: Upload gitleaks artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-gitleaks
          path: artifacts/supply-chain/gitleaks.json
          if-no-files-found: error
          retention-days: 3
      - name: Fail on secret findings
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.gitleaks_scan.outputs.exit_code }}"
          if [ -z "${exit_code}" ]; then
            echo "gitleaks scan did not publish an exit code" >&2
            exit 1
          fi
          if [ "${exit_code}" != "0" ]; then
            echo "gitleaks detected secrets; see uploaded artifact for details" >&2
            exit 1
          fi

  publish:
    needs: [build_check, resolve_release_ref]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'push' && 'pypi' || inputs.target }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: >-
      ${{
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.release_tag != '')
      }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.resolve_release_ref.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: _release_dist
      - name: Stage publish distributions
        run: |
          set -euo pipefail
          rm -rf publish-dist
          mkdir -p publish-dist
          cp _release_dist/*.whl publish-dist/
          cp _release_dist/*.tar.gz publish-dist/
      - name: Resolve publish target
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "publish_target=pypi" >> "$GITHUB_OUTPUT"
            echo "publish_repository_url=" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.target }}" = "testpypi" ]; then
            echo "publish_target=testpypi" >> "$GITHUB_OUTPUT"
            echo "publish_repository_url=https://test.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
          else
            echo "publish_target=pypi" >> "$GITHUB_OUTPUT"
            echo "publish_repository_url=" >> "$GITHUB_OUTPUT"
          fi
      - name: Attest release artifacts
        id: attest_release
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: publish-dist/*
      - name: Upload provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-provenance
          path: ${{ steps.attest_release.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 3
      - name: Publish to TestPyPI/PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: publish-dist
          repository-url: ${{ steps.vars.outputs.publish_repository_url }}
          skip-existing: true

  testpypi_smoke:
    needs: [publish, resolve_release_ref]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Download published TestPyPI wheel
        env:
          INVARLOCK_RELEASE_VERSION: ${{ needs.resolve_release_ref.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          version = os.environ["INVARLOCK_RELEASE_VERSION"].removeprefix("v")
          metadata_url = f"https://test.pypi.org/pypi/invarlock/{version}/json"
          with urllib.request.urlopen(metadata_url) as response:
              payload = json.load(response)

          wheel = next(item for item in payload["urls"] if item["filename"].endswith(".whl"))
          destination = Path("wheelhouse") / wheel["filename"]
          with urllib.request.urlopen(wheel["url"]) as response:
              destination.write_bytes(response.read())

          digest = hashlib.sha256(destination.read_bytes()).hexdigest()
          if digest != wheel["digests"]["sha256"]:
              raise SystemExit("TestPyPI wheel digest mismatch")

          requirements = Path("wheelhouse/requirements.txt")
          requirements.write_text(
              f"{destination.resolve()} --hash=sha256:{digest}\n",
              encoding="utf-8",
          )
          print(f"Downloaded {destination.name}")
          PY
      - name: Install published wheel and smoke test
        env:
          INVARLOCK_LIGHT_IMPORT: "1"
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade --require-hashes -r requirements/workflows/pip-bootstrap-py313.txt
          python -m pip install wheelhouse/*.whl
          invarlock --help
          python -c "import invarlock.cli.app"
