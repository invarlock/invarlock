name: release

on:
  # Only run on tags or manual workflow dispatch (saves compute)
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to package index"
        type: boolean
        default: false
      target:
        description: "Publish target (testpypi|pypi)"
        type: choice
        options: [ testpypi, pypi ]
        default: testpypi
      release_tag:
        description: "Existing release tag to validate/publish (for example v0.5.0)"
        type: string
        default: ""
      candidate_version:
        description: "Package version for a non-publishing branch validation (for example 0.13.0)"
        type: string
        default: ""
      candidate_run_id:
        description: "Successful tagged release workflow run ID required for publication"
        type: string
        default: ""
      publication_phase:
        description: "Publication phase (complete normally; bootstrap/finish only for first-time PyPI projects)"
        type: choice
        options: [ complete, bootstrap, finish ]
        default: complete

permissions:
  contents: read

jobs:
  resolve_release_ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve_release_ref.outputs.release_tag }}
      release_sha: ${{ steps.resolve_release_ref.outputs.release_sha }}
    steps:
      - name: Resolve release ref
        id: resolve_release_ref
        shell: bash
        env:
          INVARLOCK_EVENT_SHA: ${{ github.sha }}
          INVARLOCK_MANUAL_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          INVARLOCK_MANUAL_PUBLISH: ${{ inputs.publish }}
          INVARLOCK_MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          resolve_sha() {
            local tag="$1"
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "release_tag must be a version tag such as v1.2.3" >&2
              exit 1
            fi

            mapfile -t remote_refs < <(
              git ls-remote --tags "${remote}" "refs/tags/${tag}" "refs/tags/${tag}^{}" || true
            )
            if [ "${#remote_refs[@]}" -eq 0 ]; then
              echo "release_tag '${tag}' was not found as a tag" >&2
              exit 1
            fi

            local sha=""
            for ref in "${remote_refs[@]}"; do
              ref_sha="${ref%%$'\t'*}"
              ref_name="${ref#*$'\t'}"
              if [ "${ref_name}" = "refs/tags/${tag}^{}" ]; then
                sha="${ref_sha}"
                break
              fi
              if [ -z "${sha}" ]; then
                sha="${ref_sha}"
              fi
            done

            if [ -z "${sha}" ]; then
              echo "failed to resolve commit SHA for ${tag}" >&2
              exit 1
            fi

            printf '%s\n' "${sha}"
          }

          if [[ ! "${INVARLOCK_EVENT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow event SHA is malformed" >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            sha="$(resolve_sha "${tag}")"
          elif [ "${INVARLOCK_MANUAL_PUBLISH}" = "true" ]; then
            if [ -n "${INVARLOCK_MANUAL_CANDIDATE_VERSION}" ]; then
              echo "candidate_version must be empty during publication" >&2
              exit 1
            fi
            tag="${INVARLOCK_MANUAL_RELEASE_TAG}"
            if [ -z "${tag}" ]; then
              echo "release_tag is required for manual publication" >&2
              exit 1
            fi
            sha="$(resolve_sha "${tag}")"
          else
            if [ -n "${INVARLOCK_MANUAL_RELEASE_TAG}" ]; then
              echo "release_tag must be empty during non-publishing validation" >&2
              exit 1
            fi
            version="${INVARLOCK_MANUAL_CANDIDATE_VERSION}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "candidate_version must be a version such as 1.2.3" >&2
              exit 1
            fi
            tag="v${version}"
            sha="${INVARLOCK_EVENT_SHA}"
          fi

          if [ "${sha}" != "${INVARLOCK_EVENT_SHA}" ]; then
            echo "release tag no longer identifies the workflow event commit" >&2
            exit 1
          fi
          sha="${INVARLOCK_EVENT_SHA}"

          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${sha}" >> "$GITHUB_OUTPUT"

  build_check:
    needs: resolve_release_ref
    if: ${{ github.event_name == 'push' || inputs.publish != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHON: python
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONWARNINGS: default
    permissions:
      contents: read
    outputs:
      dist_ledger_sha256: ${{ steps.dist_digests.outputs.ledger_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve_release_ref.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install build tooling
        run: |
          python -m pip install --require-hashes -r requirements/workflows/ci-hf-py313.txt
          python -m pip install --require-hashes -r requirements/workflows/docs-ci-py313.txt
          python -m pip install --require-hashes -r requirements/workflows/release-security-py313.txt
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --force-reinstall dist/*.whl
          npm ci
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Run complete repository gates
        run: make verify
      - name: Audit maintained dependency locks
        id: dependency_audit
        run: |
          python scripts/security/cve_audit.py \
            --out-json artifacts/supply-chain/cve-audit.json \
            --out-md artifacts/supply-chain/cve-audit.md
      - name: Upload dependency audit report
        if: ${{ always() && steps.dependency_audit.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-cve-audit
          path: |
            artifacts/supply-chain/cve-audit.json
            artifacts/supply-chain/cve-audit.md
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce release coverage
        run: make coverage-enforce
      - name: Lint release workflows
        run: |
          gopath="$(go env GOPATH)"
          export PATH="${gopath}/bin:$PATH"
          make workflow-lint
      - name: Cache gitleaks binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/bin/gitleaks
          key: gitleaks-v8.30.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install gitleaks
        run: |
          gitleaks_bin="$(go env GOPATH)/bin/gitleaks"
          if [ ! -x "${gitleaks_bin}" ]; then
            go install github.com/zricethezav/gitleaks/v8@v8.30.0
          fi
          "${gitleaks_bin}" version
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Resolve gitleaks release range
        id: gitleaks_range
        shell: bash
        run: |
          set -euo pipefail
          release_sha="${{ needs.resolve_release_ref.outputs.release_sha }}"
          git fetch --force --tags origin "refs/tags/v*:refs/tags/v*"
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${release_sha}^" 2>/dev/null || true)"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          if [ -n "${previous_tag}" ]; then
            if [[ ! "${previous_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "previous release tag is not a valid version tag" >&2
              exit 1
            fi
            previous_sha="$(git rev-parse "${previous_tag}^{commit}")"
            if [[ ! "${previous_sha}" =~ ^[0-9a-f]{40,64}$ ]]; then
              echo "previous release tag did not resolve to a commit" >&2
              exit 1
            fi
            echo "log_opts=${previous_sha}..${release_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=" >> "$GITHUB_OUTPUT"
            echo "No previous release tag found; scanning full reachable history."
          fi
      - name: Run gitleaks release delta scan
        id: gitleaks_scan
        shell: bash
        env:
          INVARLOCK_GITLEAKS_LOG_OPTS: ${{ steps.gitleaks_range.outputs.log_opts }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/supply-chain
          log_opts="${INVARLOCK_GITLEAKS_LOG_OPTS}"
          cmd=(
            gitleaks git .
            --config .gitleaks.toml
            --redact
            --no-banner
            --report-format json
            --report-path artifacts/supply-chain/gitleaks.json
          )
          if [ -n "${log_opts}" ]; then
            echo "Scanning release commit range: ${log_opts}"
            cmd+=(--log-opts "${log_opts}")
          else
            echo "Scanning full reachable release history."
          fi
          set +e
          "${cmd[@]}"
          exit_code=$?
          set -e
          if [ ! -s artifacts/supply-chain/gitleaks.json ]; then
            printf '[]\n' > artifacts/supply-chain/gitleaks.json
          fi
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
      - name: Upload gitleaks artifacts
        if: ${{ always() && steps.gitleaks_scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-gitleaks
          path: artifacts/supply-chain/gitleaks.json
          if-no-files-found: warn
          retention-days: 3
      - name: Fail on secret findings
        if: ${{ always() && steps.gitleaks_scan.outcome != 'skipped' }}
        shell: bash
        run: |
          exit_code="${{ steps.gitleaks_scan.outputs.exit_code }}"
          if [ -z "${exit_code}" ]; then
            echo "gitleaks scan did not publish an exit code" >&2
            exit 1
          fi
          if [ "${exit_code}" != "0" ]; then
            echo "gitleaks detected secrets; see uploaded artifact for details" >&2
            exit 1
          fi
      - name: Build first-party distributions
        run: |
          rm -rf build dist
          python -m build --no-isolation
          python -m build --no-isolation --outdir dist/addins addins/diagnostics
          python -m build --no-isolation --outdir dist/addins addins/gguf
          python -m build --no-isolation --outdir dist/addins addins/multimodal
          python -m build --no-isolation --outdir dist/addins addins/tensorrt_llm
      - name: Record distribution digests
        id: dist_digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          dist = Path("dist")
          distributions = sorted(
              path
              for path in dist.rglob("*")
              if path.is_file()
              and (path.suffix == ".whl" or path.name.endswith(".tar.gz"))
          )
          wheels = [path for path in distributions if path.suffix == ".whl"]
          source_archives = [
              path for path in distributions if path.name.endswith(".tar.gz")
          ]
          if len(wheels) != 5 or len(source_archives) != 5:
              raise SystemExit(
                  "expected five wheels and five source distributions, found "
                  f"{len(wheels)} wheels and {len(source_archives)} source archives"
              )
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  "
              f"{path.relative_to(dist).as_posix()}\n"
              for path in distributions
          ]
          (dist / "SHA256SUMS").write_text("".join(lines), encoding="utf-8")
          PY
          echo "ledger_sha256=$(sha256sum dist/SHA256SUMS | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Twine check
        run: |
          python -m twine check dist/*.whl dist/*.tar.gz
          python -m twine check dist/addins/*
      - name: Validate first-party distribution source parity
        env:
          INVARLOCK_RELEASE_TAG: ${{ needs.resolve_release_ref.outputs.release_tag }}
        run: >-
          python scripts/release/first_party_distribution_validation.py
          --repo-root .
          --expected-version "${INVARLOCK_RELEASE_TAG#v}"
          --core-dist-dir dist
          --addin-dist-dir dist/addins
      - name: Run clean-checkout release preflight
        env:
          INVARLOCK_RELEASE_SHA: ${{ needs.resolve_release_ref.outputs.release_sha }}
          INVARLOCK_RELEASE_TAG: ${{ needs.resolve_release_ref.outputs.release_tag }}
        run: |
          set -euo pipefail
          temporary_root="$(mktemp -d)"
          release_checkout="${temporary_root}/checkout"
          hash_manifest="${temporary_root}/SHA256SUMS"
          cleanup() {
            git worktree remove --force "${release_checkout}" >/dev/null 2>&1 || true
            rm -rf "${temporary_root}"
          }
          trap cleanup EXIT

          git worktree add --detach "${release_checkout}" "${INVARLOCK_RELEASE_SHA}"
          (
            cd dist
            sha256sum invarlock-*.whl invarlock-*.tar.gz
          ) > "${hash_manifest}"
          python "${release_checkout}/scripts/release/release_preflight.py" \
            --repo-root "${release_checkout}" \
            --release-sha "${INVARLOCK_RELEASE_SHA}" \
            --expected-version "${INVARLOCK_RELEASE_TAG#v}" \
            --dist-dir "${GITHUB_WORKSPACE}/dist" \
            --hash-manifest "${hash_manifest}" \
            --json
      - name: Install smoke from wheel
        env:
          INVARLOCK_LIGHT_IMPORT: "1"
          INVARLOCK_RELEASE_TAG: ${{ needs.resolve_release_ref.outputs.release_tag }}
        run: |
          python -m venv .venv
          . .venv/bin/activate
          export PYTHONNOUSERSITE=1
          export PYTHONSAFEPATH=1
          unset PYTHONPATH
          python -m pip install --upgrade --require-hashes -r requirements/workflows/pip-bootstrap.txt
          python -m pip install --require-hashes -r requirements/workflows/release-install-py313.txt
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -m pip check
          quickstart_root="$(mktemp -d)"
          approval_root="$(mktemp -d)"
          trap 'rm -rf "${quickstart_root}" "${approval_root}"' EXIT
          cp examples/quickstart/run.py "${quickstart_root}/run.py"
          cp -R examples/acceptance-handoff/golden "${quickstart_root}/golden"
          (
            cd "${quickstart_root}"
            python run.py --fixture golden
          )
          cp -R examples/ci/standalone-consumer/. "${approval_root}/"
          mkdir "${approval_root}/incoming"
          cp -R examples/evaluator-qualification/signed-transactions/deployment-approval-inspect-ai/evidence \
            "${approval_root}/incoming/evidence"
          cp examples/evaluator-qualification/signed-transactions/deployment-approval-inspect-ai/verification.receipt.json \
            "${approval_root}/incoming/verification.receipt.json"
          (
            cd "${approval_root}"
            python review/verify_deployment_receipt.py \
              --approval-inputs review/inspect-ai-deployment-approval-inputs.json \
              --evidence incoming/evidence \
              --policy review/policy/acceptance.json \
              --receipt incoming/verification.receipt.json \
              --output deployment-approval.json
          )
          rm -rf "${quickstart_root}" "${approval_root}"
          trap - EXIT
          python -m pip install --no-deps --force-reinstall dist/addins/*.whl
          python -m pip check
          invarlock --help
          python -c "import invarlock.cli.app"
          invarlock-gguf-conformance
          invarlock-hf-vision-text-conformance
          invarlock-tensorrt-llm-conformance
          python -c "from invarlock_addins.diagnostics import spectral_observation; assert spectral_observation([[1.0]])['status'] == 'observation'"
          python -c "from importlib import import_module; from pathlib import Path; from sysconfig import get_path; from invarlock import __version__; from invarlock.core.registry import CoreRegistry; from invarlock.core.runtime_provider import INVARLOCK_RUNTIME_PROVIDER_ABI; registry = CoreRegistry(); expected = {'hf_vision_text': 'invarlock-runtime-hf-vision-text', 'llama_cpp': 'invarlock-runtime-gguf', 'tensorrt_llm': 'invarlock-runtime-tensorrt-llm'}; providers = {name: registry.get_runtime_provider(name) for name in expected}; assert all(provider.name == name and provider.abi_version == INVARLOCK_RUNTIME_PROVIDER_ABI for name, provider in providers.items()); assert all(registry.get_plugin_info(name, 'runtime_providers')['package'] == package and registry.get_plugin_info(name, 'runtime_providers')['version'] == __version__ and registry.get_plugin_info(name, 'runtime_providers')['entry_point'] == name for name, package in expected.items()); site = Path(get_path('purelib')).resolve(); assert all(Path(import_module(provider.__class__.__module__).__file__).resolve().is_relative_to(site) for provider in providers.values())"
          python - <<'PY'
          import os
          from importlib.metadata import version

          projects = (
              "invarlock",
              "invarlock-diagnostics",
              "invarlock-runtime-gguf",
              "invarlock-runtime-hf-vision-text",
              "invarlock-runtime-tensorrt-llm",
          )
          observed = {project: version(project) for project in projects}
          expected = observed["invarlock"]
          if any(candidate != expected for candidate in observed.values()):
              raise SystemExit(f"first-party version mismatch: {observed}")
          release_version = os.environ["INVARLOCK_RELEASE_TAG"].removeprefix("v")
          if expected != release_version:
              raise SystemExit(
                  f"release tag/version mismatch: tag={release_version}, packages={observed}"
              )
          PY
      - name: Create release install-surface venv
        id: install_surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifact-venv
          python -m venv .artifact-venv
          . .artifact-venv/bin/activate
          export PYTHONNOUSERSITE=1
          export PYTHONSAFEPATH=1
          unset PYTHONPATH
          python -m pip install --upgrade --require-hashes -r requirements/workflows/pip-bootstrap.txt
          python -m pip install --require-hashes -r requirements/workflows/release-install-py313.txt
          python -m pip install --no-deps --force-reinstall dist/*.whl dist/addins/*.whl
          python -m pip check
          site_packages="$(python - <<'PY'
          import site
          paths = site.getsitepackages()
          print(paths[0] if paths else site.getusersitepackages())
          PY
          )"
          echo "python=.artifact-venv/bin/python" >> "$GITHUB_OUTPUT"
          echo "site_packages=${site_packages}" >> "$GITHUB_OUTPUT"
      - name: Run release pip-audit
        run: python scripts/security/run_pip_audit.py --path "${{ steps.install_surface.outputs.site_packages }}"
      - name: Generate release install-surface SBOM
        id: generate_sbom
        run: bash scripts/security/generate_sbom.sh --scope install-surface --python "${{ steps.install_surface.outputs.python }}" artifacts/supply-chain/sbom.json
      - name: Verify distribution digests before artifact upload
        env:
          EXPECTED_DIST_LEDGER_SHA256: ${{ steps.dist_digests.outputs.ledger_sha256 }}
        run: |
          set -euo pipefail
          cd dist
          printf '%s  %s\n' "${EXPECTED_DIST_LEDGER_SHA256}" SHA256SUMS | sha256sum --check -
          sha256sum --check SHA256SUMS
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/addins/*.whl
            dist/addins/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload SBOM artifact
        if: ${{ always() && steps.generate_sbom.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-sbom
          path: artifacts/supply-chain/sbom.json
          if-no-files-found: warn
          retention-days: 3

  attest_candidate:
    needs: [build_check, resolve_release_ref]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist
      - name: Reconfirm validated distribution ledger
        env:
          EXPECTED_DIST_LEDGER_SHA256: ${{ needs.build_check.outputs.dist_ledger_sha256 }}
        run: |
          set -euo pipefail
          cd dist
          printf '%s  %s\n' "${EXPECTED_DIST_LEDGER_SHA256}" SHA256SUMS | sha256sum --check -
          sha256sum --check SHA256SUMS
      - name: Attest tagged release candidate
        id: attest_candidate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload tagged candidate provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-provenance
          path: ${{ steps.attest_candidate.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14

  authorize_candidate:
    needs: resolve_release_ref
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.publish == true &&
        inputs.release_tag != ''
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_run_id: ${{ steps.authenticate.outputs.artifact_run_id }}
      dist_ledger_sha256: ${{ steps.verify_candidate.outputs.dist_ledger_sha256 }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve_release_ref.outputs.release_sha }}
      - name: Set up candidate verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate publication inputs
        id: validate_publication
        shell: bash
        env:
          INVARLOCK_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          INVARLOCK_PUBLISH_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "${INVARLOCK_PUBLISH_TARGET}" != "testpypi" ] && [ "${INVARLOCK_PUBLISH_TARGET}" != "pypi" ]; then
            echo "unsupported publication target" >&2
            exit 1
          fi
          if [[ ! "${INVARLOCK_CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "candidate_run_id must identify a successful tagged release run" >&2
            exit 1
          fi
          if [ "${INVARLOCK_CANDIDATE_RUN_ID}" = "${GITHUB_RUN_ID}" ]; then
            echo "publication must use an earlier tagged release run" >&2
            exit 1
          fi
      - name: Authenticate tagged candidate run
        id: authenticate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INVARLOCK_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          INVARLOCK_RELEASE_SHA: ${{ needs.resolve_release_ref.outputs.release_sha }}
          INVARLOCK_RELEASE_TAG: ${{ needs.resolve_release_ref.outputs.release_tag }}
        run: |
          python scripts/release/tagged_release_candidate.py authenticate \
            --release-sha "${INVARLOCK_RELEASE_SHA}" \
            --release-tag "${INVARLOCK_RELEASE_TAG}" \
            --candidate-run-id "${INVARLOCK_CANDIDATE_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}" \
            --api-url "${GITHUB_API_URL}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Download tagged candidate distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: _release_dist
          repository: ${{ github.repository }}
          run-id: ${{ steps.authenticate.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify tagged candidate ledger
        id: verify_candidate
        env:
          INVARLOCK_RELEASE_TAG: ${{ needs.resolve_release_ref.outputs.release_tag }}
        run: |
          python scripts/release/tagged_release_candidate.py verify-ledger \
            --dist-dir _release_dist \
            --release-tag "${INVARLOCK_RELEASE_TAG}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Verify completed bootstrap publication
        if: >-
          ${{
            inputs.target == 'pypi' &&
            inputs.publication_phase == 'finish'
          }}
        env:
          EXPECTED_DIST_LEDGER_SHA256: ${{ steps.verify_candidate.outputs.dist_ledger_sha256 }}
          INVARLOCK_RELEASE_VERSION: ${{ needs.resolve_release_ref.outputs.release_tag }}
        run: |
          python scripts/release/verify_hosted_distributions.py \
            --ledger _release_dist/SHA256SUMS \
            --expected-ledger-sha256 "${EXPECTED_DIST_LEDGER_SHA256}" \
            --target pypi \
            --version "${INVARLOCK_RELEASE_VERSION}" \
            --project invarlock \
            --project invarlock-diagnostics \
            --project invarlock-runtime-gguf \
            --project invarlock-runtime-hf-vision-text

  publication_plan:
    needs: [authorize_candidate, resolve_release_ref]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.publish == true &&
        inputs.release_tag != ''
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Resolve publication phase
        id: plan
        shell: bash
        env:
          INVARLOCK_PUBLICATION_PHASE: ${{ inputs.publication_phase }}
          INVARLOCK_PUBLISH_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [ "${INVARLOCK_PUBLISH_TARGET}" != "pypi" ]; then
            case "${INVARLOCK_PUBLICATION_PHASE}" in
              bootstrap)
                echo "bootstrap publication is only valid for production PyPI" >&2
                exit 1
                ;;
              finish)
                echo "finish publication is only valid for production PyPI" >&2
                exit 1
                ;;
            esac
          fi

          case "${INVARLOCK_PUBLICATION_PHASE}" in
            complete)
              matrix='{"include":[{"package":"core","environment_suffix":""},{"package":"diagnostics","environment_suffix":"-diagnostics"},{"package":"runtime-gguf","environment_suffix":"-runtime-gguf"},{"package":"runtime-hf-vision-text","environment_suffix":"-runtime-hf-vision-text"},{"package":"runtime-tensorrt-llm","environment_suffix":"-runtime-tensorrt-llm"}]}'
              ;;
            bootstrap)
              matrix='{"include":[{"package":"core","environment_suffix":""},{"package":"diagnostics","environment_suffix":"-diagnostics"},{"package":"runtime-gguf","environment_suffix":"-runtime-gguf"},{"package":"runtime-hf-vision-text","environment_suffix":"-runtime-hf-vision-text"}]}'
              ;;
            finish)
              matrix='{"include":[{"package":"runtime-tensorrt-llm","environment_suffix":"-runtime-tensorrt-llm"}]}'
              ;;
            *)
              echo "unsupported publication phase" >&2
              exit 1
              ;;
          esac
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  prepare_publication:
    needs: [authorize_candidate, publication_plan, resolve_release_ref]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.publication_plan.outputs.matrix) }}
    permissions:
      actions: read
      contents: read
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.publish == true &&
        inputs.release_tag != ''
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve_release_ref.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: _release_dist
          repository: ${{ github.repository }}
          run-id: ${{ needs.authorize_candidate.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage publish distributions
        env:
          INVARLOCK_PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          rm -rf publish-dist
          mkdir -p publish-dist
          case "${INVARLOCK_PACKAGE}" in
            core)
              distribution_root="_release_dist"
              distribution_prefix="invarlock"
              ;;
            diagnostics)
              distribution_root="_release_dist/addins"
              distribution_prefix="invarlock_diagnostics"
              ;;
            runtime-gguf)
              distribution_root="_release_dist/addins"
              distribution_prefix="invarlock_runtime_gguf"
              ;;
            runtime-hf-vision-text)
              distribution_root="_release_dist/addins"
              distribution_prefix="invarlock_runtime_hf_vision_text"
              ;;
            runtime-tensorrt-llm)
              distribution_root="_release_dist/addins"
              distribution_prefix="invarlock_runtime_tensorrt_llm"
              ;;
            *)
              echo "unsupported first-party package: ${INVARLOCK_PACKAGE}" >&2
              exit 1
              ;;
          esac

          distributions=()
          while IFS= read -r distribution; do
            distributions+=("${distribution}")
          done < <(
            find "${distribution_root}" -maxdepth 1 -type f \
              \( -name "${distribution_prefix}-*.whl" \
                 -o -name "${distribution_prefix}-*.tar.gz" \) \
              -print | sort
          )
          if [ "${#distributions[@]}" -ne 2 ]; then
            echo "expected one wheel and one source archive for ${INVARLOCK_PACKAGE}" >&2
            exit 1
          fi
          cp "${distributions[@]}" publish-dist/
      - name: Verify distribution digests before publish
        env:
          EXPECTED_DIST_LEDGER_SHA256: ${{ needs.authorize_candidate.outputs.dist_ledger_sha256 }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          ledger = Path("_release_dist/SHA256SUMS")
          expected_ledger_digest = os.environ["EXPECTED_DIST_LEDGER_SHA256"]
          if len(expected_ledger_digest) != 64 or any(
              character not in "0123456789abcdef"
              for character in expected_ledger_digest
          ):
              raise SystemExit("build distribution ledger digest is malformed")
          observed_ledger_digest = hashlib.sha256(ledger.read_bytes()).hexdigest()
          if observed_ledger_digest != expected_ledger_digest:
              raise SystemExit("distribution digest ledger changed after build")
          expected: dict[str, str] = {}
          for line in ledger.read_text(encoding="utf-8").splitlines():
              digest, separator, relative = line.partition("  ")
              if not separator or len(digest) != 64 or any(
                  character not in "0123456789abcdef" for character in digest
              ):
                  raise SystemExit("distribution digest ledger is malformed")
              name = Path(relative).name
              if name in expected:
                  raise SystemExit(f"duplicate distribution filename in ledger: {name}")
              expected[name] = digest

          staged = {
              path.name: path
              for path in Path("publish-dist").iterdir()
              if path.is_file()
          }
          if len(staged) != 2:
              raise SystemExit(
                  "each publication job must stage one wheel and one source archive"
              )
          if not any(name.endswith(".whl") for name in staged) or not any(
              name.endswith(".tar.gz") for name in staged
          ):
              raise SystemExit("staged package formats are incomplete")
          unknown = set(staged) - set(expected)
          if unknown:
              raise SystemExit(
                  "staged distributions are absent from the build digest ledger: "
                  f"{sorted(unknown)}"
              )
          for name, path in sorted(staged.items()):
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed != expected[name]:
                  raise SystemExit(f"distribution digest mismatch: {name}")
              print(f"{name}: OK")
          PY
      - name: Reject conflicting hosted distributions
        env:
          EXPECTED_DIST_LEDGER_SHA256: ${{ needs.authorize_candidate.outputs.dist_ledger_sha256 }}
          INVARLOCK_PACKAGE: ${{ matrix.package }}
          INVARLOCK_PUBLISH_TARGET: ${{ inputs.target }}
          INVARLOCK_RELEASE_VERSION: ${{ needs.resolve_release_ref.outputs.release_tag }}
        run: |
          set -euo pipefail
          case "${INVARLOCK_PACKAGE}" in
            core) project="invarlock" ;;
            diagnostics) project="invarlock-diagnostics" ;;
            runtime-gguf) project="invarlock-runtime-gguf" ;;
            runtime-hf-vision-text) project="invarlock-runtime-hf-vision-text" ;;
            runtime-tensorrt-llm) project="invarlock-runtime-tensorrt-llm" ;;
            *)
              echo "unsupported first-party package: ${INVARLOCK_PACKAGE}" >&2
              exit 1
              ;;
          esac
          python scripts/release/verify_hosted_distributions.py \
            --ledger _release_dist/SHA256SUMS \
            --expected-ledger-sha256 "${EXPECTED_DIST_LEDGER_SHA256}" \
            --target "${INVARLOCK_PUBLISH_TARGET}" \
            --version "${INVARLOCK_RELEASE_VERSION}" \
            --attempts 1 \
            --project "${project}" \
            --allow-missing
      - name: Reconfirm immutable release tag
        env:
          INVARLOCK_RELEASE_SHA: ${{ needs.resolve_release_ref.outputs.release_sha }}
          INVARLOCK_RELEASE_TAG: ${{ needs.resolve_release_ref.outputs.release_tag }}
        run: |
          set -euo pipefail
          annotated="$(git ls-remote --tags origin "refs/tags/${INVARLOCK_RELEASE_TAG}^{}" | awk 'NR == 1 {print $1}')"
          direct="$(git ls-remote --tags origin "refs/tags/${INVARLOCK_RELEASE_TAG}" | awk 'NR == 1 {print $1}')"
          observed="${annotated:-${direct}}"
          if [ "${observed}" != "${INVARLOCK_RELEASE_SHA}" ]; then
            echo "release tag changed after candidate authorization" >&2
            exit 1
          fi
      - name: Upload verified publication files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publish-dist-${{ matrix.package }}
          path: publish-dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare_publication, publication_plan, resolve_release_ref]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.publication_plan.outputs.matrix) }}
    environment: ${{ format('{0}{1}', inputs.target, matrix.environment_suffix) }}
    permissions:
      actions: read
      id-token: write
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.publish == true &&
        inputs.release_tag != ''
      }}
    steps:
      - name: Download verified publication files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: publish-dist-${{ matrix.package }}
          path: publish-dist
      - name: Reconfirm immutable release tag
        env:
          INVARLOCK_RELEASE_SHA: ${{ needs.resolve_release_ref.outputs.release_sha }}
          INVARLOCK_RELEASE_TAG: ${{ needs.resolve_release_ref.outputs.release_tag }}
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          annotated="$(git ls-remote --tags "${remote}" "refs/tags/${INVARLOCK_RELEASE_TAG}^{}" | awk 'NR == 1 {print $1}')"
          direct="$(git ls-remote --tags "${remote}" "refs/tags/${INVARLOCK_RELEASE_TAG}" | awk 'NR == 1 {print $1}')"
          observed="${annotated:-${direct}}"
          if [ "${observed}" != "${INVARLOCK_RELEASE_SHA}" ]; then
            echo "release tag changed after publication preparation" >&2
            exit 1
          fi
      - name: Resolve publish target
        id: vars
        run: |
          if [ "${{ inputs.target }}" = "testpypi" ]; then
            echo "publish_repository_url=https://test.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
          else
            echo "publish_repository_url=" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to TestPyPI/PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: publish-dist
          repository-url: ${{ steps.vars.outputs.publish_repository_url }}
          skip-existing: true

  verify_hosted_release:
    needs: [authorize_candidate, publish, resolve_release_ref]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.publish == true &&
        inputs.publication_phase != 'bootstrap'
      }}
    runs-on: ubuntu-latest
    # Hosted verification can consume about 92 minutes at its documented
    # 12 attempts, 15 serial requests per attempt, and 30-second request timeout.
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve_release_ref.outputs.release_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Download candidate distribution ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: _release_dist
          repository: ${{ github.repository }}
          run-id: ${{ needs.authorize_candidate.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify hosted release artifacts match build
        env:
          EXPECTED_DIST_LEDGER_SHA256: ${{ needs.authorize_candidate.outputs.dist_ledger_sha256 }}
          INVARLOCK_PUBLISH_TARGET: ${{ inputs.target }}
          INVARLOCK_RELEASE_VERSION: ${{ needs.resolve_release_ref.outputs.release_tag }}
        run: |
          python scripts/release/verify_hosted_distributions.py \
            --ledger _release_dist/SHA256SUMS \
            --expected-ledger-sha256 "${EXPECTED_DIST_LEDGER_SHA256}" \
            --target "${INVARLOCK_PUBLISH_TARGET}" \
            --version "${INVARLOCK_RELEASE_VERSION}"

  published_install_smoke:
    needs: [authorize_candidate, resolve_release_ref, verify_hosted_release]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.publish == true &&
        inputs.publication_phase != 'bootstrap'
      }}
    runs-on: ubuntu-latest
    # Leave the same bounded verification budget plus installation headroom.
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve_release_ref.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Download candidate distribution ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: _release_dist
          run-id: ${{ needs.authorize_candidate.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download ledger-selected hosted wheels
        env:
          EXPECTED_DIST_LEDGER_SHA256: ${{ needs.authorize_candidate.outputs.dist_ledger_sha256 }}
          INVARLOCK_PUBLISH_TARGET: ${{ inputs.target }}
          INVARLOCK_RELEASE_VERSION: ${{ needs.resolve_release_ref.outputs.release_tag }}
        run: |
          set -euo pipefail
          python scripts/release/verify_hosted_distributions.py \
            --ledger _release_dist/SHA256SUMS \
            --expected-ledger-sha256 "${EXPECTED_DIST_LEDGER_SHA256}" \
            --target "${INVARLOCK_PUBLISH_TARGET}" \
            --version "${INVARLOCK_RELEASE_VERSION}" \
            --wheelhouse wheelhouse
      - name: Install published wheels and smoke test
        env:
          INVARLOCK_LIGHT_IMPORT: "1"
        run: |
          python -m venv .venv
          . .venv/bin/activate
          export PYTHONNOUSERSITE=1
          export PYTHONSAFEPATH=1
          unset PYTHONPATH
          python -m pip install --upgrade --require-hashes -r requirements/workflows/pip-bootstrap.txt
          python -m pip install --require-hashes -r requirements/workflows/release-install-py313.txt
          python -m pip install --no-deps --force-reinstall wheelhouse/invarlock-*.whl
          python -m pip check
          quickstart_root="$(mktemp -d)"
          approval_root="$(mktemp -d)"
          trap 'rm -rf "${quickstart_root}" "${approval_root}"' EXIT
          cp examples/quickstart/run.py "${quickstart_root}/run.py"
          cp -R examples/acceptance-handoff/golden "${quickstart_root}/golden"
          (
            cd "${quickstart_root}"
            python run.py --fixture golden
          )
          cp -R examples/ci/standalone-consumer/. "${approval_root}/"
          mkdir "${approval_root}/incoming"
          cp -R examples/evaluator-qualification/signed-transactions/deployment-approval-inspect-ai/evidence \
            "${approval_root}/incoming/evidence"
          cp examples/evaluator-qualification/signed-transactions/deployment-approval-inspect-ai/verification.receipt.json \
            "${approval_root}/incoming/verification.receipt.json"
          (
            cd "${approval_root}"
            python review/verify_deployment_receipt.py \
              --approval-inputs review/inspect-ai-deployment-approval-inputs.json \
              --evidence incoming/evidence \
              --policy review/policy/acceptance.json \
              --receipt incoming/verification.receipt.json \
              --output deployment-approval.json
          )
          rm -rf "${quickstart_root}" "${approval_root}"
          trap - EXIT
          python -m pip install --no-deps --force-reinstall wheelhouse/invarlock_*.whl
          python -m pip check
          invarlock --help
          python -c "import invarlock.cli.app"
          invarlock-gguf-conformance
          invarlock-hf-vision-text-conformance
          invarlock-tensorrt-llm-conformance
          python -c "from invarlock_addins.diagnostics import spectral_observation; assert spectral_observation([[1.0]])['status'] == 'observation'"
          python -c "from importlib import import_module; from pathlib import Path; from sysconfig import get_path; from invarlock import __version__; from invarlock.core.registry import CoreRegistry; from invarlock.core.runtime_provider import INVARLOCK_RUNTIME_PROVIDER_ABI; registry = CoreRegistry(); expected = {'hf_vision_text': 'invarlock-runtime-hf-vision-text', 'llama_cpp': 'invarlock-runtime-gguf', 'tensorrt_llm': 'invarlock-runtime-tensorrt-llm'}; providers = {name: registry.get_runtime_provider(name) for name in expected}; assert all(provider.name == name and provider.abi_version == INVARLOCK_RUNTIME_PROVIDER_ABI for name, provider in providers.items()); assert all(registry.get_plugin_info(name, 'runtime_providers')['package'] == package and registry.get_plugin_info(name, 'runtime_providers')['version'] == __version__ and registry.get_plugin_info(name, 'runtime_providers')['entry_point'] == name for name, package in expected.items()); site = Path(get_path('purelib')).resolve(); assert all(Path(import_module(provider.__class__.__module__).__file__).resolve().is_relative_to(site) for provider in providers.values())"
          python - <<'PY'
          from importlib.metadata import version

          projects = (
              "invarlock",
              "invarlock-diagnostics",
              "invarlock-runtime-gguf",
              "invarlock-runtime-hf-vision-text",
              "invarlock-runtime-tensorrt-llm",
          )
          observed = {project: version(project) for project in projects}
          expected = observed["invarlock"]
          if any(candidate != expected for candidate in observed.values()):
              raise SystemExit(f"first-party version mismatch: {observed}")
          PY

  publish_documentation:
    name: Publish tagged documentation
    needs: [published_install_smoke, resolve_release_ref]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.publish == true &&
        inputs.target == 'pypi' &&
        inputs.publication_phase != 'bootstrap'
      }}
    permissions:
      contents: write
    uses: ./.github/workflows/docs-publish.yml
    with:
      docs_version: ${{ needs.resolve_release_ref.outputs.release_tag }}
      publish_latest: true
