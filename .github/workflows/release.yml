name: release

on:
  # Only run on tags or manual workflow dispatch (saves compute)
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to package index"
        type: boolean
        default: false
      target:
        description: "Publish target (testpypi|pypi)"
        type: choice
        options: [ testpypi, pypi ]
        default: testpypi
      release_tag:
        description: "Existing release tag to rebuild/publish (for example v0.5.0)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build_check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Install build tooling
        run: python -m pip install --require-hashes -r requirements/workflows/release-security-py313.txt
      - name: Build wheel/sdist
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Install smoke from wheel
        env:
          INVARLOCK_LIGHT_IMPORT: "1"
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python - <<'PY'
          import hashlib
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          requirements = Path(".smoke/smoke-requirements.txt")
          requirements.parent.mkdir(parents=True, exist_ok=True)
          requirements.write_text(
              f"{wheel.resolve()} --hash=sha256:{digest}\n",
              encoding="utf-8",
          )
          PY
          python -m pip install --no-deps --require-hashes -r .smoke/smoke-requirements.txt
          python -c "import invarlock; import sys; print('invarlock version', getattr(invarlock, '__version__', 'n/a')); sys.exit(0)"
      - name: Generate release SBOM
        run: bash scripts/generate_sbom.sh artifacts/supply-chain/sbom.json
      - name: Upload dist artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: release-sbom
          path: artifacts/supply-chain/sbom.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build_check
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || inputs.target }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: >-
      ${{
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.release_tag != '')
      }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: _release_dist
      - name: Stage publish distributions
        run: |
          set -euo pipefail
          rm -rf publish-dist
          mkdir -p publish-dist
          cp _release_dist/*.whl publish-dist/
          cp _release_dist/*.tar.gz publish-dist/
      - name: Resolve publish target
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "publish_target=pypi" >> "$GITHUB_OUTPUT"
            echo "publish_repository_url=" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.target }}" = "testpypi" ]; then
            echo "publish_target=testpypi" >> "$GITHUB_OUTPUT"
            echo "publish_repository_url=https://test.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
          else
            echo "publish_target=pypi" >> "$GITHUB_OUTPUT"
            echo "publish_repository_url=" >> "$GITHUB_OUTPUT"
          fi
      - name: Attest release artifacts
        id: attest_release
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: publish-dist/*
      - name: Upload provenance bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: release-provenance
          path: ${{ steps.attest_release.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 3
      - name: Publish to TestPyPI/PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: publish-dist
          repository-url: ${{ steps.vars.outputs.publish_repository_url }}
          skip-existing: true

  testpypi_smoke:
    needs: publish
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.target == 'testpypi' && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Download published TestPyPI wheel
        env:
          INVARLOCK_RELEASE_VERSION: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          version = os.environ["INVARLOCK_RELEASE_VERSION"].removeprefix("v")
          metadata_url = f"https://test.pypi.org/pypi/invarlock/{version}/json"
          with urllib.request.urlopen(metadata_url) as response:
              payload = json.load(response)

          wheel = next(item for item in payload["urls"] if item["filename"].endswith(".whl"))
          destination = Path("wheelhouse") / wheel["filename"]
          with urllib.request.urlopen(wheel["url"]) as response:
              destination.write_bytes(response.read())

          digest = hashlib.sha256(destination.read_bytes()).hexdigest()
          if digest != wheel["digests"]["sha256"]:
              raise SystemExit("TestPyPI wheel digest mismatch")

          requirements = Path("wheelhouse/requirements.txt")
          requirements.write_text(
              f"{destination.resolve()} --hash=sha256:{digest}\n",
              encoding="utf-8",
          )
          print(f"Downloaded {destination.name}")
          PY
      - name: Install published wheel and smoke test
        env:
          INVARLOCK_LIGHT_IMPORT: "1"
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --no-deps --require-hashes -r wheelhouse/requirements.txt
          invarlock --help || python -c "import invarlock; import sys; print('invarlock version', getattr(invarlock,'__version__','n/a')); sys.exit(0)"

  bundle_release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: >-
      ${{
        needs.publish.result == 'success' &&
        (
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.target == 'pypi' && inputs.release_tag != '')
        )
      }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist
      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-sbom
          path: artifacts/supply-chain
      - name: Download provenance artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-provenance
          path: provenance
      - name: Sign release artifacts
        uses: sigstore/gh-action-sigstore-python@a5caf349bc536fbef3668a10ed7f5cd309a4b53d
        with:
          inputs: dist/*
          upload-signing-artifacts: true
      - name: Create offline verification bundle
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          INVARLOCK_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${INVARLOCK_RELEASE_TAG}"
          version="${tag#v}"
          bash scripts/release/make_offline_bundle.sh \
            --version "${version}" \
            --tag "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dist-dir dist \
            --sbom artifacts/supply-chain/sbom.json \
            --provenance-dir provenance \
            --output-dir release-assets
      - name: Sign offline verification bundle
        uses: sigstore/gh-action-sigstore-python@a5caf349bc536fbef3668a10ed7f5cd309a4b53d
        with:
          inputs: release-assets/*-offline-bundle.tar.gz
          upload-signing-artifacts: false
      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INVARLOCK_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${INVARLOCK_RELEASE_TAG}"
          version="${tag#v}"
          mkdir -p release-assets
          cp dist/* release-assets/
          cp artifacts/supply-chain/sbom.json "release-assets/invarlock-${version}-sbom.cdx.json"
          cp provenance/* release-assets/

          mapfile -t signing_assets < <(
            find dist -maxdepth 1 -type f \
              \( -name '*.sigstore' -o -name '*.sigstore.json' -o -name '*.crt' -o -name '*.sig' -o -name '*.pem' \)
          )
          if [ ${#signing_assets[@]} -eq 0 ]; then
            echo "No Sigstore signing artifacts found in dist/" >&2
            exit 1
          fi
          cp "${signing_assets[@]}" release-assets/

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" release-assets/* --clobber
