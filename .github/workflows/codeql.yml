name: CodeQL Security Analysis

on:
  push:
    branches: [ main, staging/next, 'release/v*' ]
  pull_request:
    branches: [ main, staging/next, 'release/v*' ]
  # Keep scheduled scans for drift detection and manual trigger for audits.
  schedule:
    # Run weekly on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:  # Manual trigger for security audits

permissions:
  contents: read
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: python
          # Use extended security queries for more thorough analysis
          queries: +security-extended,security-and-quality
          config-file: .github/codeql/codeql-config.yml

      # Autobuild attempts to build any compiled languages (not needed for Python)
      # but helps CodeQL understand the codebase structure
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: "/language:python"
          # Upload SARIF results to GitHub Security tab
          upload: true
