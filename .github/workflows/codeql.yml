name: CodeQL Security Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Keep scheduled scans for drift detection and manual trigger for audits.
  schedule:
    # Run weekly on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:  # Manual trigger for security audits

permissions:
  contents: read
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd677812177e0c29f9c970a6c58d8607ae1bfefd
        with:
          languages: python
          # Use extended security queries for more thorough analysis
          queries: +security-extended,security-and-quality
          config-file: .github/codeql/codeql-config.yml

      # Autobuild attempts to build any compiled languages (not needed for Python)
      # but helps CodeQL understand the codebase structure
      - name: Autobuild
        uses: github/codeql-action/autobuild@dd677812177e0c29f9c970a6c58d8607ae1bfefd

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@dd677812177e0c29f9c970a6c58d8607ae1bfefd
        with:
          category: "/language:python"
          # Upload SARIF results to GitHub Security tab
          upload: true
        # Allow workflow to pass even if code scanning is not enabled in repo settings
        continue-on-error: true
