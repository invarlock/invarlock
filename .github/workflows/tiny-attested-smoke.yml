name: Tiny Attested Smoke

on:
  push:
    branches: [ staging/next ]
  workflow_dispatch:

concurrency:
  group: tiny-attested-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      INVARLOCK_ALLOW_NETWORK: "1"
      INVARLOCK_DEDUP_TEXTS: "1"
      INVARLOCK_SMOKE_MODE: "attested"
      INVARLOCK_SMOKE_PROFILE: "dev"
      INVARLOCK_RUNTIME_IMAGE: "invarlock-runtime:local"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: ${{ github.actor != 'nektos/act' }}
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-tiny-attested-smoke-${{ hashFiles('pyproject.toml', 'requirements/workflows/ci-hf-py312.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-tiny-attested-smoke-

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/workflows/ci-hf-py312.txt

      - name: Build runtime image
        run: |
          make runtime-image

      - name: Run tiny attested smoke campaign
        run: bash scripts/run_tiny_attested_smoke.sh "$RUNNER_TEMP/invarlock-tiny-attested-smoke"
