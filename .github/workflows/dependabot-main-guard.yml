name: dependabot-main-guard

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  enforce-staging-first:
    runs-on: ubuntu-latest
    steps:
      - name: Block direct Dependabot PRs to main
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [[ "${PR_AUTHOR}" == "dependabot[bot]" && "${HEAD_REF}" == dependabot/* && "${BASE_REF}" == "main" ]]; then
            echo "Direct Dependabot PRs to main are blocked."
            echo "PR: ${PR_URL}"
            echo "Land the equivalent dependency fix on staging/next first, validate it there,"
            echo "and carry it through the normal release flow."
            echo "Close this PR after the staging/next fix lands."
            exit 1
          fi

          echo "Dependabot main-branch guard not applicable."
