name: OpenSSF Scorecard

on:
  push:
    # scorecard-action only supports push/schedule on the default branch.
    branches: [ main ]
  branch_protection_rule:
  schedule:
    - cron: '18 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # scorecard-action publish mode rejects extra steps in this job.
      - name: Run OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          # Prefer a dedicated PAT when configured so classic branch protection
          # remains visible to Scorecard; public repos fall back to github.token.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true
          results_file: results.sarif
          results_format: sarif
