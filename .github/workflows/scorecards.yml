name: OpenSSF Scorecard

on:
  push:
    # scorecard-action only supports push/schedule on the default branch.
    branches: [ main ]
  branch_protection_rule:
  schedule:
    - cron: '18 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          # Prefer a dedicated PAT when configured so classic branch protection
          # remains visible to Scorecard; public repos fall back to github.token.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true
          results_file: results.sarif
          results_format: sarif
      - name: Filter informational Scorecard SARIF rules
        uses: ./.github/actions/filter-scorecard-sarif
        with:
          input: results.sarif
          output: results.sarif
          exclude_rule: CIIBestPracticesID
      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: scorecard-results
          path: results.sarif
          if-no-files-found: error
          retention-days: 5
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@b20883b0cd1f46c72ae0ba6d1090936928f9fa30
        with:
          sarif_file: results.sarif
