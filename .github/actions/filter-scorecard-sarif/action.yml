name: Filter Scorecard SARIF
description: Remove allowlisted Scorecard SARIF rules before upload.

inputs:
  input:
    description: Input SARIF path.
    required: true
  output:
    description: Output SARIF path.
    required: true
  exclude_rule:
    description: Rule ID to remove from the SARIF payload.
    required: true

runs:
  using: composite
  steps:
    - name: Filter SARIF
      shell: bash
      run: >-
        python3 scripts/filter_scorecard_sarif.py
        --input "${{ inputs.input }}"
        --output "${{ inputs.output }}"
        --exclude-rule "${{ inputs.exclude_rule }}"
