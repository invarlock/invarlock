version = 1

[[large_script_reviews]]
path = "scripts/evidence_packs/scenarios.json"
max_lines = 1400
rationale = "Large evidence-pack scenario catalog retained as reviewed maintainer workflow data until scenario families are split."

[[large_script_reviews]]
path = "scripts/evidence_packs/python/editing/streaming_transform.py"
max_lines = 1500
rationale = "Reviewed as the bounded raw-transformation materializer; its repaired v1 ABI is independently replayed by a separate package-owned verifier rather than importing this implementation."

[[large_script_reviews]]
path = "scripts/evidence_packs/python/editing/transformation_oracle.py"
max_lines = 1500
rationale = "Reviewed as the script-side v1 numerical and architecture oracle used for replay checks; it deliberately duplicates only public ABI semantics and imports neither the materializer nor its target resolver."

[[large_script_reviews]]
path = "scripts/evidence_packs/python/editing/training_runtime.py"
max_lines = 1200
rationale = "Reviewed as the shared training-profile runtime boundary for reload, inference, and receipt checks; keeping those coupled checks together prevents a receipt from outliving the artifact it proves."

[[large_script_reviews]]
path = "scripts/evidence_packs/python/editing/validate_artifact.py"
max_lines = 3000
rationale = "Reviewed as the compatibility front door for artifact validation while family-specific contracts remain delegated to dedicated modules and exercised by transformation and pruning regression tests."

[[large_script_reviews]]
path = "scripts/evidence_packs/python/verify_pack_checks.py"
max_lines = 1200
rationale = "Reviewed as the shared strict package-verification command surface; centralizing file, manifest, policy, and result checks avoids shell-specific verification drift."

