  "scripts/smoke/check_device_drift.py",
  "scripts/smoke/cli_exhaustive_smoke.sh",
  "scripts/smoke/cli_smoke_fast.sh",
  "scripts/smoke/cli_smoke_negative.sh",
  "scripts/smoke/guard_validation_smoke.py",
  "scripts/smoke/run_cpu_telemetry.sh",
  "scripts/smoke/run_gpt2_user_journey_smoke.sh",
  "scripts/smoke/run_tiny_all_matrix.sh",
  "scripts/smoke/run_tiny_container_smoke.sh",
