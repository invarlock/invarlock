version = 1

[[families]]
name = "scripts-governance"
owner = "maintainers"
stability = "repo-internal"
audience = "ci-only"
expected_runtime = "fast"
network = "never"
gpu = "never"
invoked_by = ["make verify", "make scripts-audit"]
description = "Inventory and hygiene checks for the scripts tree itself."
paths = [
  "scripts/README.md",
  "scripts/checks/check_architecture_fragmentation.py",
  "scripts/checks/check_public_evidence.py",
  "scripts/checks/check_repo_cruft.py",
  "scripts/check_scripts_inventory.py",
  "scripts/scripts_inventory.toml",
  "scripts/select_workspace_python.sh",
]

[[families]]
name = "repo-contracts"
owner = "maintainers"
stability = "ci-stable"
audience = "ci-only"
expected_runtime = "fast"
network = "never"
gpu = "never"
invoked_by = ["make verify", "make contracts-check", "CI"]
description = "Repository consistency checks and shared helpers outside the consolidated docs validation owner."
paths = [
  "scripts/checks/check_config_integrity.py",
  "scripts/checks/check_guard_fallback_diagnostics.py",
  "scripts/checks/sync_packaged_contracts.py",
  "scripts/checks/verify_ci_matrix.sh",
]

[[families]]
