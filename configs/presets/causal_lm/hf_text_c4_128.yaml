# Preset: Causal LM (decoder-only) on C4 via `hf_text`.
#
# Notes:
# - Requires `datasets` and initial network fetch unless cached.
# - `--profile ci` defaults to 240/240 windows unless you set:
#     INVARLOCK_CI_PREVIEW=16 INVARLOCK_CI_FINAL=16
# - Shipped preset counts stay smoke-sized; use `--profile ci|release` for
#   balanced-tier evaluations that need pass-capable token coverage.
# - For a smaller bootstrap in CI, create a local `profiles/ci.yaml` and point
#   `INVARLOCK_CONFIG_ROOT` to it (see docs/user-guide/proof-packs-internals.md).
#
# Example smoke test:
#   INVARLOCK_ALLOW_NETWORK=1 INVARLOCK_CI_PREVIEW=16 INVARLOCK_CI_FINAL=16 \
#   invarlock evaluate \
#     --baseline sshleifer/tiny-gpt2 \
#     --subject sshleifer/tiny-gpt2 \
#     --preset configs/presets/causal_lm/hf_text_c4_128.yaml \
#     --profile ci \
#     --tier balanced \
#     --report-out /tmp/invarlock_c4_smoke

model:
  id: "sshleifer/tiny-gpt2"
  adapter: "hf_causal"
  device: "auto"

dataset:
  provider:
    kind: "hf_text"
    dataset_name: "allenai/c4"
    config_name: "en"
    text_field: "text"
    max_samples: 512
  split: "validation"
  seq_len: 128
  stride: 128
  preview_n: 64
  final_n: 64
  seed: 43

eval:
  metric:
    kind: "ppl_causal"
  loss:
    type: "causal"

edit:
  name: "noop"
  plan: {}

auto:
  enabled: true
  tier: "balanced"
  probes: 0

guards:
  order: ["invariants", "spectral", "rmt", "variance", "invariants"]

output:
  dir: "runs"
  save_model: false
  save_report: true
