# Preset: QwQ 32B on WikiText-2.

model:
  id: "Qwen/QwQ-32B"
  adapter: "hf_causal"
  device: "auto"

dataset:
  provider:
    kind: "hf_text"
    dataset_name: "wikitext"
    config_name: "wikitext-103-v1"
    text_field: "text"
    max_samples: 10000
  split: "train"
  seq_len: 512
  stride: 512
  preview_n: 64
  final_n: 64
  seed: 42

eval:
  metric:
    kind: "ppl_causal"
  loss:
    type: "causal"

primary_metric:
  drift_band:
    min: 0.90
    max: 1.20

edit:
  name: "noop"
  plan: {}

auto:
  enabled: true
  tier: "balanced"
  probes: 0

guards:
  order: ["invariants", "spectral", "rmt", "variance", "invariants"]
  spectral:
    family_caps:
      attn: 8.727
      embed: 0.0
      ffn: 3.079
      other: 0.0
    multiple_testing:
      method: "bh"
      alpha: 0.05
      m: 4

output:
  dir: "runs"
  save_model: false
  save_report: true
