# Preset: OpenLLaMA 7B causal LM on WikiText-2.

model:
  id: "openlm-research/open_llama_7b"
  adapter: "hf_causal"
  device: "auto"

dataset:
  provider: "wikitext2"
  split: "validation"
  seq_len: 512
  stride: 512
  preview_n: 64
  final_n: 64
  seed: 42

eval:
  metric:
    kind: "ppl_causal"
  loss:
    type: "causal"

primary_metric:
  drift_band:
    min: 0.90
    max: 1.20

edit:
  name: "noop"
  plan: {}

auto:
  enabled: true
  tier: "balanced"
  probes: 0

guards:
  order: ["invariants", "spectral", "rmt", "variance", "invariants"]

output:
  dir: "runs"
  save_model: false
  save_report: true
