# Preset: GPT-2 causal LM smoke on WikiText-2.
#
# This ships the tiny GPT-2 smoke asset used by the repo smoke campaign script
# and CI workflow.
# - Runnable (repo checkout): `invarlock evaluate --preset ... --assurance trusted-local`

model:
  id: "gpt2"
  adapter: "hf_causal"
  device: "auto"

dataset:
  provider: "wikitext2"
  split: "validation"
  seq_len: 128
  stride: 128
  preview_n: 8
  final_n: 8
  seed: 43

eval:
  metric:
    kind: "ppl_causal"
  loss:
    type: "causal"

edit:
  name: "noop"
  plan: {}

auto:
  enabled: true
  tier: "balanced"
  probes: 0

context:
  run:
    tiny_relax: true
  eval:
    tiny_relax: true

guards:
  order: ["invariants", "spectral", "rmt", "variance", "invariants"]

output:
  dir: "runs"
  save_model: false
  save_report: true
