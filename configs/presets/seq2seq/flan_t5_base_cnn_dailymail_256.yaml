# Preset: FLAN-T5 base seq2seq summarization on CNN/DailyMail via hf_seq2seq.

model:
  id: "google/flan-t5-base"
  adapter: "hf_seq2seq"
  device: "auto"
  model_identity:
    kind: "remote_revision"
    revision: "7bcac572ce56db69c1ea7c8af255c5d7c9672fc2"

dataset:
  provider:
    kind: "hf_seq2seq"
    dataset_name: "abisee/cnn_dailymail"
    config_name: "3.0.0"
    revision: "96df5e686bee6baa90b8bee7c28b81fa3fa6223d"
    src_field: "article"
    tgt_field: "highlights"
    src_prefix: "summarize: "
    max_samples: 1024
  split: "validation"
  seq_len: 256
  stride: 256
  preview_n: 200
  final_n: 200
  seed: 42

eval:
  metric:
    kind: "ppl_seq2seq"
  loss:
    type: "seq2seq"

primary_metric:
  drift_band:
    min: 0.90
    max: 1.20

edit:
  name: "noop"
  plan: {}

auto:
  enabled: true
  tier: "balanced"
  probes: 0

guards:
  order: ["invariants", "spectral", "rmt", "variance", "invariants"]

output:
  dir: "runs"
  save_model: false
  save_report: true
