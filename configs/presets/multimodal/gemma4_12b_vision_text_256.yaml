# Preset: Gemma 4 12B image-text evaluation on the local vision_text demo fixture.

model:
  id: "google/gemma-4-12B-it"
  adapter: "hf_multimodal"
  device: "auto"
  dtype: "bfloat16"
  device_map: "auto"
  low_cpu_mem_usage: true
  collect_loading_info: false
  attn_implementation: "sdpa"

dataset:
  provider:
    kind: "vision_text"
    path: "tests/fixtures/vision_text/demo_manifest.jsonl"
  split: "validation"
  seq_len: 256
  stride: 256
  preview_n: 1
  final_n: 1
  seed: 42

eval:
  metric:
    kind: "accuracy"
  loss:
    type: "classification"

primary_metric:
  drift_band:
    min: 0.80
    max: 1.20

edit:
  name: "noop"
  plan: {}

auto:
  enabled: true
  tier: "balanced"
  probes: 0

context:
  run:
    skip_overhead_check: true

guards:
  order: ["invariants", "spectral", "rmt", "variance", "invariants"]
  spectral:
    module_include_patterns:
      - "model.language_model.layers.*.self_attn.*"
      - "model.language_model.layers.*.mlp.*"
  rmt:
    module_include_patterns:
      - "model.language_model.layers.*.self_attn.*"
      - "model.language_model.layers.*.mlp.*"

output:
  dir: "runs"
  save_model: false
  save_report: true
