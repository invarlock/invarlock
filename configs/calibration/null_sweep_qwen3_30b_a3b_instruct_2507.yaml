# Calibration config: Null sweep for Qwen3 30B-A3B Instruct 2507 MoE on WikiText-103 via hf_text.

model:
  id: "Qwen/Qwen3-30B-A3B-Instruct-2507"
  adapter: "hf_causal"
  device: "auto"
  dtype: "bfloat16"
  device_map: "auto"
  low_cpu_mem_usage: true
  collect_loading_info: false

dataset:
  provider:
    kind: "hf_text"
    dataset_name: "Salesforce/wikitext"
    config_name: "wikitext-103-v1"
    text_field: "text"
    max_samples: 10000
  split: "train"
  seq_len: 512
  stride: 512
  preview_n: 64
  final_n: 64
  seed: 42

edit:
  name: noop
  plan: {}

eval:
  metric:
    kind: ppl_causal
  loss:
    type: causal

primary_metric:
  drift_band:
    min: 0.90
    max: 1.20

auto:
  enabled: true
  tier: balanced
  probes: 0

context:
  run:
    skip_overhead_check: true

guards:
  order: ["invariants", "spectral", "rmt", "variance", "invariants"]
  spectral:
    family_caps:
      ffn: 3.849
      attn: 3.018
      embed: 1.05
      other: 0.0
      router: 5.0
    module_include_patterns:
      - "model.layers.*.self_attn.*_proj"
      - "model.layers.*.mlp.gate"
      - "model.layers.*.mlp.shared_expert*"
    module_exclude_patterns:
      - "model.layers.*.mlp.experts.*"
  rmt:
    module_include_patterns:
      - "model.layers.*.self_attn.*_proj"
      - "model.layers.*.mlp.gate"
      - "model.layers.*.mlp.shared_expert*"
    module_exclude_patterns:
      - "model.layers.*.mlp.experts.*"
  variance:
    calibration:
      max_seq_len: 64

output:
  dir: runs/null_sweeps/qwen3_30b_a3b_instruct_2507
  save_model: false
  save_report: true
