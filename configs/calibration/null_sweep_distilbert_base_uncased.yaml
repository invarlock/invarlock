# Calibration config: Null sweep for DistilBERT spectral/RMT calibration.

model:
  id: "distilbert-base-uncased"
  adapter: "hf_mlm"
  device: "auto"

dataset:
  provider: "wikitext2"
  split: "validation"
  seq_len: 128
  stride: 128
  preview_n: 64
  final_n: 64
  seed: 42

edit:
  name: noop
  plan: {}

eval:
  metric:
    kind: ppl_mlm
  loss:
    type: mlm
    mask_prob: 0.15
    seed: 42
    random_token_prob: 0.10
    original_token_prob: 0.10

primary_metric:
  drift_band:
    min: 0.90
    max: 1.20

auto:
  enabled: true
  tier: balanced
  probes: 0

guards:
  order: ["invariants", "spectral", "rmt", "variance", "invariants"]

output:
  dir: runs/null_sweeps/distilbert_base_uncased
  save_model: false
  save_report: true
