# Calibration config: Null sweep for Mixtral 8x7B MoE spectral/RMT calibration.

model:
  id: "mistralai/Mixtral-8x7B-v0.1"
  adapter: "hf_causal"
  device: "auto"
  dtype: "bfloat16"
  device_map: "auto"
  low_cpu_mem_usage: true
  collect_loading_info: false

dataset:
  provider:
    kind: "hf_text"
    dataset_name: "Salesforce/wikitext"
    config_name: "wikitext-103-v1"
    text_field: "text"
    max_samples: 10000
  split: "train"
  seq_len: 512
  stride: 512
  preview_n: 64
  final_n: 64
  seed: 42

edit:
  name: noop
  plan: {}

eval:
  metric:
    kind: ppl_causal
  loss:
    type: causal

primary_metric:
  drift_band:
    min: 0.90
    max: 1.20

auto:
  enabled: true
  tier: balanced
  probes: 0

guards:
  order: ["invariants", "spectral", "rmt", "variance", "invariants"]
  spectral:
    family_caps:
      ffn: 3.849
      attn: 3.018
      embed: 1.05
      other: 0.0
      router: 5.0

output:
  dir: runs/null_sweeps/mixtral_8x7b
  save_model: false
  save_report: true
