# Calibration config: Null sweep for Qwen3 8B spectral/RMT calibration.

model:
  id: "Qwen/Qwen3-8B"
  adapter: "hf_causal"
  device: "auto"

dataset:
  provider:
    kind: "hf_text"
    dataset_name: "wikitext"
    config_name: "wikitext-103-v1"
    text_field: "text"
    max_samples: 10000
  split: "train"
  seq_len: 512
  stride: 512
  preview_n: 64
  final_n: 64
  seed: 42

edit:
  name: noop
  plan: {}

eval:
  metric:
    kind: ppl_causal
  loss:
    type: causal

primary_metric:
  drift_band:
    min: 0.90
    max: 1.20

auto:
  enabled: true
  tier: balanced
  probes: 0

guards:
  order: ["invariants", "spectral", "rmt", "variance", "invariants"]

output:
  dir: runs/null_sweeps/qwen3_8b
  save_model: false
  save_report: true
