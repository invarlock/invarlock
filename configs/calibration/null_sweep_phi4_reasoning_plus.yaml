# Calibration config: Null sweep for Phi-4 reasoning plus text-only spectral/RMT calibration.

model:
  id: "microsoft/Phi-4-reasoning-plus"
  adapter: "hf_causal"
  device: "auto"

dataset:
  provider: "wikitext2"
  split: "validation"
  seq_len: 512
  stride: 512
  preview_n: 64
  final_n: 64
  seed: 42

edit:
  name: noop
  plan: {}

eval:
  metric:
    kind: ppl_causal
  loss:
    type: causal

auto:
  enabled: true
  tier: balanced
  probes: 0

guards:
  order: ["invariants", "spectral", "rmt", "variance", "invariants"]

output:
  dir: runs/null_sweeps/phi4_reasoning_plus
  save_model: false
  save_report: true
