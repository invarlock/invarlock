# Smoke calibration config: VE sweep sized for CLI smoke coverage.

model:
  id: "sshleifer/tiny-gpt2"
  adapter: "hf_causal"
  device: "cpu"

dataset:
  provider: "wikitext2"
  split: "validation"
  seq_len: 128
  stride: 128
  preview_n: 8
  final_n: 8
  seed: 42

eval:
  metric:
    kind: ppl_causal
  loss:
    type: causal

edit:
  name: quant_rtn
  plan:
    bitwidth: 8
    per_channel: true
    group_size: 128
    clamp_ratio: 0.0
    scope: "ffn"
    max_modules: 2
    seed: 42

auto:
  enabled: true
  tier: balanced
  probes: 0

context:
  run:
    tiny_relax: true
  eval:
    tiny_relax: true

guards:
  order: ["invariants", "spectral", "rmt", "variance", "invariants"]

output:
  dir: runs/variance_sweeps_smoke
  save_model: false
  save_report: true
