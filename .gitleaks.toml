title = "InvarLock gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Authenticated tokenizer digest fields contain public hashes, not secrets."
condition = "AND"
regexTarget = "match"
paths = [
  '''examples/acceptance-handoff/golden/.*\.json$''',
  '''examples/evaluator-qualification/signed-transactions/[^/]+/evidence/.*\.json$''',
  '''examples/policy-engine-interop/fixtures/.*\.json$''',
  '''public_evidence/(?:catalog_evidence|published_basis)/.*/(?:evaluation\.report\.json|evidence_pack/reports/report-[0-9]+/evaluation\.report\.json)$''',
  '''public_evidence/evidence/.*\.json$''',
  '''tests/fixtures/compatibility/v0\.13\.0/package/evidence/.*\.json$''',
  '''docs/reference/qualification-suites\.manifest\.json$''',
  '''docs/user-guide/runtime-providers\.md$''',
  '''(?:latest|[0-9]+\.[0-9]+\.[0-9]+)/reference/qualification-suites\.manifest\.json$''',
  '''(?:latest|[0-9]+\.[0-9]+\.[0-9]+)/search/search_index\.json$''',
]
regexes = [
  '''tokenizer_(?:hash|sha256|metadata_sha256|contract_sha256)"?\s*:\s*"?(?:[0-9A-Fa-f]{8,128}|PINNED_64_HEX_DIGEST)"?''',
]

[[allowlists]]
description = "Ed25519 type annotations name a public algorithm, not key material."
condition = "AND"
regexTarget = "match"
paths = [
  '''src/invarlock/evaluation_transaction\.py$''',
  '''src/invarlock/evidence_pack_publication\.py$''',
  '''tests/evidence_packs/test_evidence_reporting\.py$''',
]
regexes = [
  '''(?:signing_key|private_key|key):\s*ed25519''',
]

[[allowlists]]
description = "The pipeline signing-key parameter defaults to None and contains no key material."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^src/invarlock/pipeline/evidence\.py$''',
]
regexes = [
  # Gitleaks retains the preceding newline for findings after the first line.
  '''^\n?    signing_key: Ed25519PrivateKey \| None = None,$''',
]

[[allowlists]]
description = "Acceptance key-file size bounds are public limits, not credentials."
condition = "AND"
regexTarget = "match"
paths = [
  '''src/invarlock/acceptance_attestation\.py$''',
]
regexes = [
  '''key",\s*max_bytes=64\s''',
]
