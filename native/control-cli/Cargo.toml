[package]
name = "invarlock-native-command"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
description = "Explicit native execution and durable transaction command"
[[bin]]
name = "invarlock-native"
path = "src/main.rs"
[dependencies]
invarlock-native-execution = { path = "../execution", version = "=0.1.0" }
invarlock-native-filesystem = { path = "../filesystem", version = "=0.1.0" }
invarlock-native-contracts = { path = "../contracts", version = "=0.1.0" }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision", "preserve_order"] }
