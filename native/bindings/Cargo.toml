[package]
name = "invarlock-native-bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "invarlock_native"
crate-type = ["cdylib"]

[dependencies]
invarlock-native-core = { path = "../core" }
pyo3 = { version = "=0.29.0", features = ["extension-module"] }

invarlock-native-contracts = { path = "../contracts" }
invarlock-native-evidence = { path = "../evidence" }
invarlock-native-execution = { path = "../execution" }
invarlock-native-filesystem = { path = "../filesystem" }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision", "preserve_order"] }
