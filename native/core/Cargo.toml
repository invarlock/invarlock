[package]
name = "invarlock-native-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND PSF-2.0"
description = "Portable deterministic scoring and paired analysis"

[dependencies]
sha2 = { version = "=0.10.9", features = ["compress"] }
sha3 = "=0.10.8"
serde_json = { version = "=1.0.149", features = ["arbitrary_precision", "preserve_order"] }
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
invarlock-native-contracts = { path = "../contracts" }
base64 = "=0.22.1"

# sha2 selects its ARM SHA instructions at runtime and retains a software fallback.
# Keep other targets on their existing backend and build requirements.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "=0.10.9", features = ["asm"] }
