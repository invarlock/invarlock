[workspace]
members = ["core", "bindings", "contracts", "filesystem", "evidence", "cli", "execution", "control-cli"]
default-members = ["core"]
exclude = ["vendor/jsonschema", "vendor/serde_json"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0 AND PSF-2.0"

[profile.release]
codegen-units = 1
lto = "thin"

[patch.crates-io]
jsonschema = { path = "vendor/jsonschema" }
serde_json = { path = "vendor/serde_json" }
