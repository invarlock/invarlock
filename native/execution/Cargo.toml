[package]
name = "invarlock-native-execution"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
description = "Bounded process transport and durable execution transactions"
[dependencies]
invarlock-native-filesystem = { path = "../filesystem", version = "=0.1.0" }
libc = "=0.2.186"
sha2 = "=0.10.9"
invarlock-native-contracts = { path = "../contracts", version = "=0.1.0" }
invarlock-native-core = { path = "../core", version = "=0.1.0" }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision", "preserve_order"] }
