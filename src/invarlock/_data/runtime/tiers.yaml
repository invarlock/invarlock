# Tier policy defaults (metrics gates + guard knobs) used at runtime.
#
# Balanced and Conservative are packaged operational policy defaults. This
# file does not provide calibration evidence or a statistical error guarantee
# for a new model, dataset, or edit family. Aggressive is research-oriented and
# outside the current assurance case.
#
# Rationale by key: docs/reference/tier-policy-catalog.md
# Calibration method: docs/assurance/09-tier-v1-calibration.md
# Provenance/digest: docs/assurance/11-policy-provenance.md

balanced:
  metrics:
    pm_ratio:
      ratio_limit_base: 1.10
      min_tokens: 50000
      hysteresis_ratio: 0.002
      min_token_fraction: 0.01
    pm_tail:
      mode: warn
      min_windows: 50
      quantile: 0.95
      quantile_max: 0.20
      epsilon: 0.0001
      mass_max: 1.0
    accuracy:
      delta_min_pp: -1.0
      min_examples: 200
      hysteresis_delta_pp: 0.1
      min_examples_fraction: 0.01
  variance_guard:
    min_gain: 0.0
    min_rel_gain: 0.001
    max_calib: 200
    scope: ffn
    clamp: [0.85, 1.12]
    deadband: 0.02
    seed: 123
    mode: ci
    alpha: 0.05
    tie_breaker_deadband: 0.001
    min_abs_adjust: 0.012
    max_scale_step: 0.03
    min_effect_lognll: 0.0
    predictive_one_sided: true
    topk_backstop: 1
    max_adjusted_modules: 1
    tap: "transformer.h.*.mlp.c_proj"
    predictive_gate: true
    calibration:
      windows: 8
      min_coverage: 6
      seed: 123
  spectral_guard:
    sigma_quantile: 0.95
    deadband: 0.10
    scope: all
    correction_enabled: true
    ignore_preview_inflation: true
    max_caps: 5
    max_spectral_norm: null
    family_caps:
      ffn: 3.849
      attn: 3.018
      embed: 1.05
      other: 0.0
    multiple_testing:
      method: bh
      alpha: 0.05
      m: 4
  rmt_guard:
    q: auto
    deadband: 0.10
    margin: 1.5
    correct: true
    epsilon_default: 0.01
    epsilon_by_family:
      ffn: 0.01
      attn: 0.01
      embed: 0.01
      other: 0.01

