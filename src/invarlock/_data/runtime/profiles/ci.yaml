# CI profile overrides for standard evaluation workflows.
#
# Keeps default CI window sizing and bootstrap depth explicit in packaged
# runtime data so policy behavior does not depend on implicit fallback logic.

dataset:
  # Keep CI above the balanced min-token floor for shipped pilot causal families.
  preview_n: 240
  final_n: 240

eval:
  bootstrap:
    replicates: 1200
    alpha: 0.05

primary_metric:
  overhead_threshold: 0.01
