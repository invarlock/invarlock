<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="641"
  viewBox="0 0 1600 855"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">InvarLock evaluation and verification flow</title>
  <desc id="desc">
    Baseline and subject checkpoints enter the evaluate command, produce paired
    evaluation traces and report artifacts, then the verify command checks
    schema, pairing, gates, and runtime provenance before pass or fail outcome.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8.25"
      refY="5"
      markerWidth="6.7"
      markerHeight="6.7"
      orient="auto-start-reverse"
    >
      <path d="M 0.75 1 L 9.5 5 L 0.75 9 z" fill="#1b2b25" />
    </marker>
    <style>
      .title {
        fill: #1b2b25;
        font: 700 42px Sora, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .section-label {
        font: 700 25px Sora, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .box-title {
        fill: #1b2b25;
        font: 700 24px Sora, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .box-text {
        fill: #1b2b25;
        font: 19px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .small-text {
        fill: #5a675f;
        font: 17px Sora, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .band-input {
        fill: #fff8ea;
        stroke: #0f7669;
        stroke-width: 3;
        stroke-dasharray: 13 10;
      }
      .band-output {
        fill: #fff8ea;
        stroke: #2d7a5f;
        stroke-width: 3;
        stroke-dasharray: 13 10;
      }
      .band-verify {
        fill: #fff8ea;
        stroke: #b56a3d;
        stroke-width: 3;
        stroke-dasharray: 13 10;
      }
      .box-input {
        fill: #f3ecde;
        stroke: #0f7669;
        stroke-width: 3;
      }
      .box-output {
        fill: #f3ecde;
        stroke: #2d7a5f;
        stroke-width: 3;
      }
      .box-verify {
        fill: #f3ecde;
        stroke: #b56a3d;
        stroke-width: 3;
      }
      .arrow {
        fill: none;
        stroke: #1b2b25;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="1600" height="855" rx="0" fill="#f3ecde" />

  <rect x="70" y="45" width="1460" height="320" rx="22" class="band-input" />
  <text x="105" y="188" class="section-label" fill="#0f7669">1. Inputs /</text>
  <text x="105" y="222" class="section-label" fill="#0f7669">Evaluation</text>

  <rect x="345" y="75" width="300" height="56" rx="10" class="box-input" />
  <text x="495" y="111" text-anchor="middle" class="box-title">Baseline checkpoint</text>

  <rect x="955" y="75" width="300" height="56" rx="10" class="box-input" />
  <text x="1105" y="111" text-anchor="middle" class="box-title">Subject checkpoint</text>

  <rect x="605" y="175" width="390" height="78" rx="12" class="box-input" />
  <text x="800" y="208" text-anchor="middle" class="box-title">evaluate command</text>
  <text x="800" y="234" text-anchor="middle" class="small-text">
    container by default; host opt-in
  </text>

  <rect x="475" y="281" width="650" height="66" rx="12" class="box-input" />
  <text x="800" y="309" text-anchor="middle" class="box-title">
    deterministic paired windows
  </text>
  <text x="800" y="333" text-anchor="middle" class="box-text">
    invariants -&gt; spectral -&gt; RMT -&gt; variance -&gt; invariants
  </text>

  <path d="M 490 131 C 490 159 620 160 673 175" class="arrow" />
  <path d="M 1110 131 C 1110 159 980 160 927 175" class="arrow" />
  <path d="M 800 253 L 800 281" class="arrow" />

  <rect x="70" y="385" width="1460" height="205" rx="22" class="band-output" />
  <text x="105" y="475" class="section-label" fill="#2d7a5f">2. Output</text>
  <text x="105" y="509" class="section-label" fill="#2d7a5f">Artifacts</text>

  <rect x="335" y="425" width="330" height="80" rx="12" class="box-input" />
  <text x="500" y="459" text-anchor="middle" class="box-text">runs/.../report.json</text>
  <text x="500" y="487" text-anchor="middle" class="box-text">baseline/subject traces</text>

  <rect x="330" y="535" width="340" height="48" rx="10" class="box-input" />
  <text x="500" y="567" text-anchor="middle" class="box-text">report generate / explain</text>

  <rect x="850" y="425" width="445" height="90" rx="12" class="box-output" />
  <text x="1072" y="461" text-anchor="middle" class="box-text">
    reports/&lt;name&gt;/evaluation.report.json
  </text>
  <text x="1072" y="493" text-anchor="middle" class="box-text">
    reports/&lt;name&gt;/runtime.manifest.json
  </text>

  <path d="M 690 347 C 690 395 565 403 510 425" class="arrow" />
  <path d="M 930 347 C 930 395 1015 402 1065 425" class="arrow" />
  <path d="M 500 505 L 500 535" class="arrow" />

  <rect x="70" y="610" width="1460" height="230" rx="22" class="band-verify" />
  <text x="105" y="697" class="section-label" fill="#b56a3d">3. Verification</text>
  <text x="105" y="731" class="section-label" fill="#b56a3d">and Outcome</text>

  <rect x="815" y="630" width="420" height="72" rx="12" class="box-verify" />
  <text x="1025" y="660" text-anchor="middle" class="box-title">verify command</text>
  <text x="1025" y="686" text-anchor="middle" class="small-text">
    schema + pairing + gates + provenance
  </text>

  <rect x="655" y="719" width="250" height="48" rx="10" class="box-output" />
  <text x="780" y="751" text-anchor="middle" class="box-title">PASS: promote</text>

  <rect x="1115" y="719" width="230" height="48" rx="10" class="box-verify" />
  <text x="1230" y="751" text-anchor="middle" class="box-title">FAIL: block</text>

  <rect x="655" y="785" width="250" height="46" rx="10" class="box-verify" />
  <text x="780" y="804" text-anchor="middle" class="box-text">report html command</text>
  <text x="780" y="823" text-anchor="middle" class="small-text">optional evidence pack</text>

  <path d="M 1072 515 L 1072 630" class="arrow" />
  <path d="M 1025 702 C 1000 711 915 716 860 719" class="arrow" />
  <path d="M 1025 702 C 1068 711 1145 716 1198 719" class="arrow" />
  <path d="M 780 767 L 780 785" class="arrow" />
</svg>
