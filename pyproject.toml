  "transformers>=5.12.0",
  "safetensors>=0.4.0",
  "peft>=0.19.1,<0.20",
]

# Evaluation functionality
eval = [
  "torch>=2.11.0,!=2.12.0",
  "datasets>=3.0",
  "requests>=2.33.0",
]

# Dedicated probe stack for mutual-information/probe execution.
probes = [
  "scikit-learn>=1.4",
]

# External edit integrations
gptq = [
  "torch>=2.11.0,!=2.12.0",
  "torchvision>=0.23.0",
  "gptqmodel>=7.1.0",
  "triton>=2.3.0; platform_system == \"Linux\"",
  "transformers>=5.12.0",
  "safetensors>=0.4.0",
]


awq = [
  "torch>=2.11.0,!=2.12.0",
  "torchvision>=0.23.0",
  "gptqmodel>=7.1.0",
  "transformers>=5.12.0",
  "accelerate>=0.27",
  "safetensors>=0.4.0",
  "triton>=2.3.0; platform_system == \"Linux\"",
