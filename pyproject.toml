[build-system]
requires      = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invarlock"
version = "0.13.0"
description = "Paired model release-regression evaluation with independently verifiable evidence"
authors = [{ name = "InvarLock Team", email = "oss@invarlock.dev" }]
maintainers = [{ name = "InvarLock Maintainers", email = "support@invarlock.dev" }]
license = "Apache-2.0"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
keywords = [
  "machine-learning", "evaluation", "verification", "evidence",
  "model-assurance", "release-regression", "reproducibility"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Typing :: Typed",
]
dependencies = [
    "typer>=0.24.1",
    "click>=8.3.3",
    "cryptography>=48.0.1",
    "rich>=13.0",
    "pyyaml>=6.0.3",
    "jsonschema>=4.0",
]
[project.urls]
Homepage = "https://invarlock.ai"
Repository = "https://github.com/invarlock/invarlock"
Documentation = "https://invarlock.github.io/invarlock/0.13.0/"
Issues = "https://github.com/invarlock/invarlock/issues"
Changelog = "https://github.com/invarlock/invarlock/blob/v0.13.0/CHANGELOG.md"

[project.optional-dependencies]
# Canonical built-in Hugging Face runtime. GGUF and TensorRT-LLM are separate
# first-party distributions under addins/.
hf = [
  "accelerate>=1.14.0",
  "torch>=2.11.0,!=2.12.0",
  "transformers>=5.14.1",
  "safetensors>=0.8.0",
  "protobuf>=4.25",
  "sentencepiece>=0.2.2",
  "tiktoken>=0.9.0",
]

# Development dependencies
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.6",
  "pillow>=11.3,<13",
  "ruff==0.16.0",
  "mypy==1.20.0",
  "types-jsonschema>=4.26",
  "hypothesis>=6.98",
  "pre-commit>=4.6.1",
  "mkdocs>=1.5",
  "mkdocs-material>=9.7.6",
  "mkdocs-mermaid2-plugin>=1.2.3",
  "pymdown-extensions>=11.0.0",
  "build>=0.10.0",
  "wheel>=0.47.0",
  "twine>=4.0.0",
  "peft==0.19.1",
  "torchao==0.17.0",
]

ci = [
  "setuptools>=83.0.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.6",
  "pillow>=11.3,<13",
  "hypothesis>=6.98",
  "ruff==0.16.0",
  "mypy==1.20.0",
  "types-jsonschema>=4.26",
  "build>=0.10.0",
  "wheel>=0.47.0",
  "twine>=4.0.0",
  "peft==0.19.1",
  "torchao==0.17.0",
]

docs-ci = [
  "linkchecker>=10.6.0",
  "mkdocs>=1.5",
  "mkdocs-material>=9.7.6",
  "mkdocs-mermaid2-plugin>=1.2.3",
  "pymdown-extensions>=11.0.0",
]

precommit-ci = [
  "pre-commit>=4.6.1",
]

release-ci = [
  "build>=0.10.0",
  "setuptools>=83.0.0",
  "wheel==0.47.0",
  "twine>=4.0.0",
  "cyclonedx-bom>=4.1",
]

security-ci = [
  "pip>=26.1.2",
  "pip-audit>=2.8",
  "msgpack>=1.2.1",
  "cyclonedx-bom>=4.1",
]

[dependency-groups]
example-peft = [
  "peft==0.19.1",
]
example-torchao = [
  "torchao==0.17.0",
]

[project.entry-points."invarlock.runtime_providers"]
hf_transformers = "invarlock.runtime_providers.hf_transformers:HFTransformersProvider"

# Console scripts
[project.scripts]
invarlock = "invarlock.cli.app:app"
invarlock-qualify-evaluator = "invarlock.evaluator_qualification_cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
"invarlock" = [
  "_data/contracts/*.json",
  "_data/public_evidence/*.json",
]

# Enable namespace packages
[tool.setuptools]
include-package-data = true

# Development tooling configuration
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C90", # mccabe complexity
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by the Ruff formatter
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # imported but unused

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # lenient for now
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "safetensors",
    "safetensors.*",
    "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "invarlock.cli.__init__",
    "invarlock.cli.__main__",
    "invarlock.cli.app",
]
ignore_errors = false


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for full pipelines",
    "regression: Regression tests for stability and reproducibility",
    "slow: Tests that take longer than 30 seconds",
    "gpu: Tests that require GPU (CUDA/MPS)",
    "notebook: Tests for Jupyter notebook functionality",
    "extras: Tests requiring optional provider dependencies",
    "manual: Requires manual setup; excluded from default CI runs",
]
[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["src/invarlock"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
