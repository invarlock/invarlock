  "sphinx>=7.0",
  "matplotlib>=3.10.9",
  "bitsandbytes>=0.41",
  "build>=0.10.0",
  "wheel>=0.46.0",
  "requests>=2.33.0",
  "twine>=4.0.0",
]

ci = [
  "pytest>=7.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.6",
  "hypothesis>=6.98",
  "ruff==0.15.20",
  "mypy>=1.0",
  "mkdocs>=1.5",
  "mkdocs-material>=9.7.6",
  "mkdocs-mermaid2-plugin>=1.2.3",
  "pymdown-extensions>=10.21.3",
  "build>=0.10.0",
  "wheel>=0.46.0",
  "requests>=2.33.0",
]

docs-ci = [
  "linkchecker>=10.5",
  "numpy>=1.24",
  "requests>=2.33.0",
  "pymdown-extensions>=10.21.3",
]

precommit-ci = [
  "pre-commit>=3.0",
]

release-ci = [
  "build>=0.10.0",
  "setuptools>=82.0.1",
  "wheel==0.46.3",
  "requests>=2.33.0",
  "twine>=4.0.0",
  "cyclonedx-bom>=4.1",
