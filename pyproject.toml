[build-system]
requires      = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invarlock"
version = "0.12.1"
description = "Auditable strict verification for edited model checkpoints (InvarLock framework)"
authors = [{ name = "InvarLock Team", email = "oss@invarlock.dev" }]
maintainers = [{ name = "InvarLock Maintainers", email = "support@invarlock.dev" }]
license = "Apache-2.0"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
keywords = [
  "machine-learning", "deep-learning", "transformers", "pytorch", "llm",
  "quantization", "evaluation", "verification", "model-editing",
  "release-assurance", "reproducibility"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
    "typer>=0.15",
    "click>=8.3.3",
    "shellingham>=1.5.4",
    "cryptography>=48.0.1",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "markdown>=3.5",
    "psutil>=5.9",
    "jsonschema>=4.0",
    "idna>=3.15",
    # Strict verification independently replays paired bootstrap statistics.
    "numpy>=1.24",
]
[project.urls]
Homepage = "https://invarlock.ai"
Repository = "https://github.com/invarlock/invarlock"
Documentation = "https://invarlock.github.io/invarlock/0.12.1/"
Issues = "https://github.com/invarlock/invarlock/issues"
Changelog = "https://github.com/invarlock/invarlock/blob/v0.12.1/CHANGELOG.md"

[project.optional-dependencies]
# Core torch dependencies for adapters
adapters = [
  "torch>=2.11.0,!=2.12.0",
  "transformers>=5.12.0",
  "safetensors>=0.4.0",
  "protobuf>=4.25",
  "sentencepiece>=0.2.1",
  "tiktoken>=0.9.0",
  "pillow>=12.3.0",
]

# Hugging Face workflow (adapters + evaluation stack)
hf = [
  "torch>=2.11.0,!=2.12.0",
  "accelerate>=0.26.0",
  "transformers>=5.12.0",
  "safetensors>=0.4.0",
  "protobuf>=4.25",
  "sentencepiece>=0.2.1",
  "tiktoken>=0.9.0",
  "datasets>=3.0",
  "requests>=2.33.0",
  "numpy>=1.24",
  "huggingface_hub>=1.0.0",
  "aiohttp>=3.14.0",
  "h2>=4.3.0",
  "pillow>=12.3.0",
  "peft>=0.19.1,<0.20",
]

# Hugging Face image-text / multimodal workflow.
multimodal = [
  "torch>=2.11.0,!=2.12.0",
  "accelerate>=0.26.0",
  "transformers>=5.12.0",
  "safetensors>=0.4.0",
  "protobuf>=4.25",
  "sentencepiece>=0.2.1",
  "tiktoken>=0.9.0",
  "datasets>=3.0",
  "requests>=2.33.0",
  "numpy>=1.24",
  "huggingface_hub>=1.0.0",
  "aiohttp>=3.14.0",
  "h2>=4.3.0",
  "pillow>=12.3.0",
  "torchvision>=0.26.0",
]

# Full guards functionality
guards = [
  "torch>=2.11.0,!=2.12.0",
  "numpy>=1.24",
]

# Edit functionality
edits = [
  "torch>=2.11.0,!=2.12.0",
