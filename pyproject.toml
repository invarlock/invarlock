[build-system]
requires      = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invarlock"
version = "0.9.0"
description = "Edit‑agnostic robustness evaluation reports for weight edits (InvarLock framework)"
authors = [{ name = "InvarLock Team", email = "oss@invarlock.dev" }]
maintainers = [{ name = "InvarLock Maintainers", email = "support@invarlock.dev" }]
license = "Apache-2.0"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
keywords = [
  "machine-learning", "deep-learning", "transformers", "pytorch", "llm",
  "quantization", "evaluation", "verification", "model-editing",
  "release-assurance", "reproducibility"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
    "typer>=0.15",
    "click>=8.1",
    "shellingham>=1.5.0",
    "cryptography>=46.0.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "markdown>=3.5",
    "psutil>=5.9",
    "jsonschema>=4.0",
    "idna>=3.15",
]
[project.urls]
Homepage = "https://github.com/invarlock/invarlock"
Repository = "https://github.com/invarlock/invarlock"
Documentation = "https://invarlock.github.io/invarlock/0.9.0/"
Issues = "https://github.com/invarlock/invarlock/issues"
Changelog = "https://github.com/invarlock/invarlock/blob/v0.9.0/CHANGELOG.md"

[project.optional-dependencies]
# Core torch dependencies for adapters
adapters = [
  "torch>=2.11.0",
  "transformers>=5.5.0",
  "safetensors>=0.4.0",
  "protobuf>=4.25",
  "sentencepiece>=0.2.1",
  "tiktoken>=0.9.0",
  "pillow>=11.3.0",
]

# Hugging Face workflow (adapters + evaluation stack)
hf = [
  "torch>=2.11.0",
  "accelerate>=0.26.0",
  "transformers>=5.5.0",
  "safetensors>=0.4.0",
  "protobuf>=4.25",
  "sentencepiece>=0.2.1",
  "tiktoken>=0.9.0",
  "datasets>=3.0",
  "requests>=2.33.0",
  "numpy>=1.24",
  "huggingface_hub>=1.0.0",
  "aiohttp>=3.12.14",
  "h2>=4.3.0",
  "pillow>=11.3.0",
]

# Full guards functionality
guards = [
  "torch>=2.11.0",
  "numpy>=1.24",
]

# Edit functionality
edits = [
  "torch>=2.11.0",
]

# Evaluation functionality
eval = [
  "torch>=2.11.0",
  "datasets>=3.0",
  "requests>=2.33.0",
]

# Dedicated probe stack for mutual-information/probe execution.
probes = [
  "scikit-learn>=1.4",
]

# External edit integrations
gptq = [
  "torch>=2.11.0",
  "auto-gptq>=0.7.0; platform_system == \"Linux\" and python_version < \"3.13\"",
  "triton>=2.3.0; platform_system == \"Linux\"",
  "transformers>=5.5.0",
  "safetensors>=0.4.0",
]


awq = [
  "torch>=2.11.0",
  "autoawq>=0.2.0; platform_system == \"Linux\"",
  "transformers>=5.5.0",
  "safetensors>=0.4.0",
  "triton>=2.3.0; platform_system == \"Linux\"",
]

# GPU helper stack (optional extras for CUDA/MPS optimisations)
gpu = [
  "torch>=2.11.0",
  "accelerate>=0.27",
  "bitsandbytes>=0.41",
  "safetensors>=0.4.0",
]

# Convenience install for advanced evidence-pack/policy/plugins/calibration workflows.
advanced = [
  "torch>=2.11.0",
  "transformers>=5.5.0",
  "protobuf>=4.25",
  "sentencepiece>=0.2.1",
  "tiktoken>=0.9.0",
  "datasets>=3.0",
  "requests>=2.33.0",
  "numpy>=1.24",
  "scikit-learn>=1.4",
  "huggingface_hub>=1.0.0",
  "accelerate>=0.27",
  "bitsandbytes>=0.41",
  "auto-gptq>=0.7.0; platform_system == \"Linux\" and python_version < \"3.13\"",
  "autoawq>=0.2.0; platform_system == \"Linux\"",
  "triton>=2.3.0; platform_system == \"Linux\"",
  "aiohttp>=3.12.14",
  "h2>=4.3.0",
  "pillow>=11.3.0",
]


# Complete installation with all features
all = [
  "torch>=2.11.0",
  "transformers>=5.5.0",
  "protobuf>=4.25",
  "sentencepiece>=0.2.1",
  "tiktoken>=0.9.0",
  "datasets>=3.0",
  "requests>=2.33.0",
  "numpy>=1.24",
  "scikit-learn>=1.4",
  "huggingface_hub>=1.0.0",
  "accelerate>=0.27",
  "bitsandbytes>=0.41",
  "auto-gptq>=0.7.0; platform_system == \"Linux\" and python_version < \"3.13\"",
  "autoawq>=0.2.0; platform_system == \"Linux\"",
  "triton>=2.3.0; platform_system == \"Linux\"",
  "aiohttp>=3.12.14",
  "h2>=4.3.0",
  "pillow>=11.3.0",
]

# Development dependencies
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff==0.15.13",
  "black>=23.0",
  "mypy>=1.0",
  "hypothesis>=6.98",
  "pre-commit>=3.0",
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
  "mkdocs-mermaid2-plugin>=1.1",
  "sphinx>=7.0",
  "matplotlib>=3.7",
  "bitsandbytes>=0.41",
  "build>=0.10.0",
  "wheel>=0.46.0",
  "requests>=2.33.0",
  "twine>=4.0.0",
]

ci = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "hypothesis>=6.98",
  "ruff==0.15.13",
  "mypy>=1.0",
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
  "mkdocs-mermaid2-plugin>=1.1",
  "pymdown-extensions>=10.21.3",
  "build>=0.10.0",
  "wheel>=0.46.0",
  "requests>=2.33.0",
]

docs-ci = [
  "linkchecker>=10.5",
  "numpy>=1.24",
  "requests>=2.33.0",
  "pymdown-extensions>=10.21.3",
]

precommit-ci = [
  "pre-commit>=3.0",
]

release-ci = [
  "build>=0.10.0",
  "requests>=2.33.0",
  "twine>=4.0.0",
  "cyclonedx-bom>=4.1",
]

security-ci = [
  "pip-audit>=2.8",
  "requests>=2.33.0",
  "cyclonedx-bom>=4.1",
]

# Entry points for production-ready plugins
[project.entry-points."invarlock.edits"]
quant_rtn = "invarlock.edits:RTNQuantEdit"

[project.entry-points."invarlock.guards"]
spectral = "invarlock.guards:SpectralGuard"
variance = "invarlock.guards:VarianceGuard"
rmt = "invarlock.guards:RMTGuard"
invariants = "invarlock.guards:InvariantsGuard"
hello_guard = "invarlock.plugins:HelloGuard"

[project.entry-points."invarlock.adapters"]
hf_causal = "invarlock.adapters:HF_Causal_Adapter"
hf_mlm = "invarlock.adapters:HF_MLM_Adapter"
hf_seq2seq = "invarlock.adapters:HF_Seq2Seq_Adapter"
hf_auto = "invarlock.adapters:HF_Auto_Adapter"
hf_multimodal = "invarlock.adapters.hf_multimodal:HF_Multimodal_Adapter"
hf_gptq = "invarlock.plugins.hf_gptq_adapter:HF_GPTQ_Adapter"
hf_awq = "invarlock.plugins.hf_awq_adapter:HF_AWQ_Adapter"
hf_bnb = "invarlock.plugins.hf_bnb_adapter:HF_BNB_Adapter"

# Console scripts
[project.scripts]
invarlock = "invarlock.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
"invarlock" = [
  "_data/contracts/*.json",
  "_data/public_evidence/published_basis/*/*.json",
]
"invarlock._data.runtime" = [
  "profiles/*.yaml",
  "tiers.yaml",
]

# Enable namespace packages
[tool.setuptools]
include-package-data = true

# Development tooling configuration
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # imported but unused

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # lenient for now
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "psutil",
    "psutil.*",
    "torch.*",
    "transformers.*",
    "auto_gptq.*",
    "requests",
    "requests.*",
    "yaml",
    "jsonschema",
