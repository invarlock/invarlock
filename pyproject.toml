# Entry points for built-in and optional plugins
[project.entry-points."invarlock.edits"]
quant_rtn = "invarlock.edits:RTNQuantEdit"

[project.entry-points."invarlock.guards"]
spectral = "invarlock.guards.spectral:SpectralGuard"
variance = "invarlock.guards.variance:VarianceGuard"
rmt = "invarlock.guards.rmt:RMTGuard"
invariants = "invarlock.guards.invariants:InvariantsGuard"
demo_hello_guard = "invarlock.plugins:HelloGuard"

[project.entry-points."invarlock.adapters"]
hf_causal = "invarlock.adapters.hf_causal:HF_Causal_Adapter"
hf_mlm = "invarlock.adapters.hf_mlm:HF_MLM_Adapter"
hf_seq2seq = "invarlock.adapters.hf_seq2seq:HF_Seq2Seq_Adapter"
hf_auto = "invarlock.adapters.auto:HF_Auto_Adapter"
hf_multimodal = "invarlock.adapters.hf_multimodal:HF_Multimodal_Adapter"
hf_gptq = "invarlock.plugins:HF_GPTQ_Adapter"
hf_awq = "invarlock.plugins:HF_AWQ_Adapter"
hf_bnb = "invarlock.plugins:HF_BNB_Adapter"
hf_torchao = "invarlock.plugins:HF_TorchAO_Adapter"
hf_hqq = "invarlock.plugins:HF_HQQ_Adapter"
hf_quanto = "invarlock.plugins:HF_Quanto_Adapter"
hf_ct = "invarlock.plugins:HF_CompressedTensors_Adapter"

# Console scripts
[project.scripts]
invarlock = "invarlock.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
"invarlock" = [
  "_data/contracts/*.json",
  "_data/public_evidence/*.json",
]
"invarlock._data.runtime" = [
  "profiles/*.yaml",
  "tiers.yaml",
]

# Enable namespace packages
[tool.setuptools]
include-package-data = true

# Development tooling configuration
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # imported but unused

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # lenient for now
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "psutil",
    "psutil.*",
    "torch.*",
    "transformers.*",
    "gptqmodel.*",
    "requests",
    "requests.*",
    "yaml",
    "jsonschema",
    "datasets.*",
    "sklearn.*",
    "matplotlib.*",
    "tqdm.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Temporary debt allowlist from a no-ignore mypy audit. Keep this list module
# and error-code specific so newly clean modules remain type-checked and new
# error classes cannot hide behind blanket ignore_errors.
module = [
    "invarlock.adapters.hf_causal",
    "invarlock.adapters.hf_mixin",
    "invarlock.adapters.hf_mlm",
    "invarlock.adapters.hf_multimodal",
    "invarlock.edits.quant_rtn",
    "invarlock.eval.bench_policy",
    "invarlock.eval.bench_runner",
    "invarlock.eval.data",
    "invarlock.eval.metrics_activation",
    "invarlock.eval.metrics_runtime",
    "invarlock.eval.metrics_support",
    "invarlock.eval.probes.importance",
    "invarlock.eval.tail_stats",
    "invarlock.guards.invariants",
    "invarlock.guards.rmt",
    "invarlock.guards.rmt_activation_runtime",
    "invarlock.guards.rmt_analysis",
    "invarlock.guards.rmt_detection",
    "invarlock.guards.rmt_policy",
    "invarlock.guards.rmt_runtime",
    "invarlock.guards.spectral_control",
    "invarlock.guards.spectral",
    "invarlock.guards.tier_config",
    "invarlock.guards.variance",
    "invarlock.guards.variance_batching",
    "invarlock.guards.variance_evaluation",
    "invarlock.guards.variance_scaling",
    "invarlock.guards.variance_targets",
    "invarlock.utils",
    "invarlock.core.runner",
    "invarlock.cli.commands.calibrate",
    "invarlock.cli.commands.doctor",
    "invarlock.cli.commands.explain_gates",
    "invarlock.cli.commands.evidence_pack",
    "invarlock.cli.commands.plugins",
    "invarlock.cli.config_execution",
    "invarlock.cli.device",
    "invarlock.cli.output",
    "invarlock.cli.run_config",
    "invarlock.cli.run_execution",
    "invarlock.cli.run_execution_output",
    "invarlock.cli.run_metric_impact",
    "invarlock.cli.run_pairing",
    "invarlock.cli.run_pairing_baseline",
    "invarlock.cli.run_runtime_exec",
    "invarlock.cli.security_helpers",
]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "call-overload",
    "dict-item",
    "import-not-found",
    "index",
    "misc",
    "name-defined",
    "no-any-return",
    "no-redef",
    "operator",
    "redundant-cast",
    "return-value",
    "typeddict-item",
    "typeddict-unknown-key",
    "union-attr",
    "unreachable",
    "unused-ignore",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = [
    "invarlock.adapters.auto",
    "invarlock.cli.__init__",
    "invarlock.cli.__main__",
    "invarlock.cli.app",
    "invarlock.cli.commands.evaluate",
    "invarlock.cli.commands.verify",
    "invarlock.cli.evaluate_output",
    "invarlock.cli.evaluate_phases",
]
ignore_errors = false


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for full pipelines",
    "regression: Regression tests for stability and reproducibility",
    "slow: Tests that take longer than 30 seconds",
    "gpu: Tests that require GPU (CUDA/MPS)",
    "notebook: Tests for Jupyter notebook functionality",
    "extras: Tests requiring optional dependencies (e.g., gptq, awq)",
    "manual: Requires manual setup; excluded from default CI runs",
]
[tool.coverage.run]
branch = true
source = [
    "src",
    "scripts/release",
    "scripts/evidence_packs/python",
]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "src/*/__main__.py",
]

[tool.coverage.report]
show_missing = true
precision = 2
include = [
    "scripts/release/*.py",
    "scripts/evidence_packs/python/create_edit_model.py",
    "scripts/evidence_packs/python/create_edits_batch.py",
    "scripts/evidence_packs/python/editing/edit_metadata_contract.py",
    "scripts/evidence_packs/python/editing/implementations.py",
    "scripts/evidence_packs/python/editing/streaming_pruning.py",
    "scripts/evidence_packs/python/editing/training_artifact_verifier.py",
    "scripts/evidence_packs/python/editing/training_contract.py",
    "scripts/evidence_packs/python/editing/training_receipt.py",
    "scripts/evidence_packs/python/editing/training_runtime.py",
    "scripts/evidence_packs/python/editing/tensor_ops.py",
    "scripts/evidence_packs/python/editing/validate_artifact.py",
    "scripts/evidence_packs/python/preset_generator.py",
    "scripts/evidence_packs/python/task_tools_reports.py",
    "src/invarlock/eval/*",
    "src/invarlock/guards/*",
    "src/invarlock/calibration.py",
    "src/invarlock/clean_pruning_selection_*.py",
    "src/invarlock/clean_selection/*.py",
    "src/invarlock/clean_selection_runtime.py",
    "src/invarlock/cli/*",
    "src/invarlock/reporting/*",
    "src/invarlock/core/*",
    "src/invarlock/adapters/hf_causal.py",
    "src/invarlock/adapters/hf_causal_specs.py",
    "src/invarlock/adapters/hf_multimodal.py",
    "src/invarlock/public_contracts.py",
    "src/invarlock/policy_pack.py",
    "src/invarlock/evidence_pack_json.py",
    "src/invarlock/evidence_pack_contracts/deployable_coverage.py",
    "src/invarlock/evidence_pack_scenario_contract.py",
    "src/invarlock/training_evidence.py",
]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
