[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for full pipelines",
    "regression: Regression tests for stability and reproducibility",
    "slow: Tests that take longer than 30 seconds",
    "gpu: Tests that require GPU (CUDA/MPS)",
    "notebook: Tests for Jupyter notebook functionality",
    "extras: Tests requiring optional dependencies (e.g., gptq, awq)",
    "manual: Requires manual setup; excluded from default CI runs",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::RuntimeWarning",
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src", "scripts/release"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "src/*/__main__.py",
]

[tool.coverage.report]
show_missing = true
precision = 2
include = [
    "scripts/release/*.py",
    "src/invarlock/eval/*",
    "src/invarlock/guards/*",
    "src/invarlock/calibration/*",
    "src/invarlock/cli/*",
    "src/invarlock/reporting/*",
    "src/invarlock/core/*",
    "src/invarlock/adapters/hf_multimodal.py",
    "src/invarlock/public_contracts.py",
    "src/invarlock/policy_pack.py",
]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
