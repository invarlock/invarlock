  "accelerate>=0.27",
  "transformers>=5.12.0",
  "bitsandbytes>=0.41",
  "safetensors>=0.4.0",
]

# Convenience install for advanced evidence-pack/policy/plugins/calibration workflows.
advanced = [
  "torch>=2.11.0,!=2.12.0",
  "transformers>=5.12.0",
  "protobuf>=4.25",
  "sentencepiece>=0.2.1",
  "tiktoken>=0.9.0",
  "datasets>=3.0",
  "requests>=2.33.0",
  "numpy>=1.24",
  "scikit-learn>=1.4",
  "huggingface_hub>=1.0.0",
  "torchvision>=0.26.0",
  "accelerate>=0.27",
  "bitsandbytes>=0.41",
  "gptqmodel>=7.1.0",
  "torchao>=0.17.0",
  "hqq>=0.2.8",
  "optimum-quanto>=0.2.7",
  "compressed-tensors>=0.10.0",
  "triton>=2.3.0; platform_system == \"Linux\"",
  "aiohttp>=3.14.0",
  "h2>=4.3.0",
  "pillow>=12.3.0",
  "peft>=0.19.1,<0.20",
]


# Complete installation with all features
all = [
  "torch>=2.11.0,!=2.12.0",
  "transformers>=5.12.0",
  "protobuf>=4.25",
  "sentencepiece>=0.2.1",
  "tiktoken>=0.9.0",
  "datasets>=3.0",
  "requests>=2.33.0",
  "numpy>=1.24",
  "scikit-learn>=1.4",
  "huggingface_hub>=1.0.0",
  "torchvision>=0.26.0",
  "accelerate>=0.27",
  "bitsandbytes>=0.41",
  "gptqmodel>=7.1.0",
  "torchao>=0.17.0",
  "hqq>=0.2.8",
  "optimum-quanto>=0.2.7",
  "compressed-tensors>=0.10.0",
  "triton>=2.3.0; platform_system == \"Linux\"",
  "aiohttp>=3.14.0",
  "h2>=4.3.0",
  "pillow>=12.3.0",
  "peft>=0.19.1,<0.20",
