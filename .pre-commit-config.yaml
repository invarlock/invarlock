exclude: (^|.*/)reports/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        # Evidence-pack integrity authenticates exact file bytes. Keep structural
        # validation active below, but never rewrite an already signed pack.
        # The authoritative runtime schedule likewise retains the generator's
        # exact canonical bytes and is covered by a byte-for-byte parity check.
        # Retained XML renderings also have an exact-byte reference inventory.
        exclude: '^(public_evidence/evidence/|examples/(captured-results/references/[^/]+/(capture/.*|evidence/.*|verification\.receipt\.json)|acceptance-handoff/golden/.*|evaluator-qualification/(authoritative/runtime-schedule\.json|signed-transactions/[^/]+/.*)|inputs/schedule\.json|import/(baseline|subject|rejected-subject)/(model-artifact\.identity|runtime-provider\.receipt|runtime-scoring\.observation)\.json|integrations/spdx-ai-observation/source/(model-aibom\.spdx3|model-artifact\.identity)\.json)$|tests/fixtures/compatibility/v0\.13\.0/package/.*)|^examples/hosted-service/references/mistral-7b-http/(current/)?report\.xml$'
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
