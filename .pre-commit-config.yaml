exclude: (^|.*/)reports/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        # Evidence-pack integrity authenticates exact file bytes. Keep structural
        # validation active below, but never rewrite an already signed pack.
        exclude: '^(public_evidence/evidence/|examples/(acceptance-handoff/golden/.*|inputs/schedule\.json|import/(baseline|subject|rejected-subject)/(model-artifact\.identity|runtime-provider\.receipt|runtime-scoring\.observation)\.json)$)'
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
